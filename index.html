    empty.appendChild(el('div',{style:'color:var(--mut);font-size:14px;margin-bottom:14px'},isToday?'Noch keine Einträge heute.':'Keine Einträge für diesen Tag.'));
    if(isToday){
      empty.appendChild(el('button',{class:'btn btn-s btn-sm',onClick:()=>set({showQL:true,qlDraft:{emotion:null,intensity:3,note:'',rds:{},medEffect:null,quickEvents:[],time:null}})}, '＋ Ersten Eintrag erstellen'));
    }
    logSec.appendChild(empty);
  }
  // Check-in CTA (secondary action)
  if(isToday){
    const ciRow=el('div',{style:'padding:0 16px;margin-top:8px'});
    ciRow.appendChild(el('button',{class:'btn btn-s btn-w',style:'font-size:14px',onClick:()=>{
      const t=nowTimeStr();
      set({ciStep:0,ciDraft:{time:t,symptoms:{},events:[],healthFlags:{},painLocations:[],ibuprofenMg:0,note:'',medEffect:null},expandedLog:null});
    }},'📊 Detailliertes Check-in starten'));
    logSec.appendChild(ciRow);
  }
  wrap.appendChild(logSec);
  return wrap;
}

// ─────────────────────────────────────────
// RENDER: QUICK LOG SHEET
// ─────────────────────────────────────────
function renderQuickLogSheet(){
  const d=S.qlDraft||{};
  const overlay=el('div',{class:'overlay',onClick:(e)=>{if(e.target===overlay)set({showQL:false,qlDraft:null});}});
  const sheet=el('div',{class:'sheet'});
  sheet.appendChild(el('div',{class:'sheet-handle'}));
  sheet.appendChild(el('div',{class:'sheet-title'},'Was passiert gerade?'));

  // Emotion grid
  const grid=el('div',{class:'emo-grid'});
  EMOTIONS.forEach(emo=>{
    const isOn=d.emotion===emo.id;
    const vcls=emo.v>0?'ep':emo.v<0?'en':'eu';
    const btn=el('div',{class:`emo-btn${isOn?' '+vcls:''}`,onClick:()=>set({qlDraft:{...d,emotion:isOn?null:emo.id,rds:{},medEffect:null}})});
    btn.appendChild(el('span',{class:'emo-ico'},emo.emoji));
    btn.appendChild(el('span',{class:'emo-lbl'},emo.label));
    grid.appendChild(btn);
  });
  sheet.appendChild(grid);

  if(d.emotion){
    // Intensity
    const intRow=el('div',{class:'int-row'});
    for(let i=1;i<=5;i++){
      intRow.appendChild(el('button',{class:`int-btn${d.intensity===i?' on':''}`,onClick:()=>set({qlDraft:{...d,intensity:i}})},String(i)));
    }
    const intLbl=el('div',{style:'text-align:center;font-size:11px;color:var(--mut);margin-bottom:6px'},
      `Intensität: ${'·'.repeat(d.intensity||3)} ${d.intensity||3}/5`);
    sheet.appendChild(intLbl); sheet.appendChild(intRow);

    // Optional context chips
    sheet.appendChild(el('div',{class:'sec-hdr'},'Kontext (optional)'));
    const ctx=el('div',{class:'chips'});
    [{id:'rds',label:'🛑 RDS-Moment'},{id:'med',label:'💊 Medikation'},...EV_CAFF,...EV_FOOD].forEach(item=>{
      const isRds=item.id==='rds'; const isMed=item.id==='med';
      const isOnRds=isRds&&!!d.rds?.active; const isOnMed=isMed&&!!d.medEffect;
      const isOnEv=(d.quickEvents||[]).some(e=>e.label===item.label);
      const isOn=isOnRds||isOnMed||isOnEv;
      const chip=el('button',{class:`chip${isOn?' on':''}`,onClick:()=>{
        if(isRds) set({qlDraft:{...d,rds:isOnRds?{}:{active:true}}});
        else if(isMed) set({qlDraft:{...d,medEffect:isOnMed?null:'choose'}});
        else { const evs=(d.quickEvents||[]).filter(e=>e.label!==item.label); if(!isOnEv) evs.push(item); set({qlDraft:{...d,quickEvents:evs}}); }
      }},item.label||(item.emoji+' '+item.type));
      ctx.appendChild(chip);
    });
    sheet.appendChild(ctx);

    // RDS sub-form
    if(d.rds?.active){
      const rds=el('div',{class:'rds-form'});
      rds.appendChild(el('div',{class:'rds-title'},'🛑 RDS – Was hat es ausgelöst?'));
      const tr=el('div',{class:'chips'});
      RDS_TRIGGERS.forEach(t=>{ tr.appendChild(el('button',{class:`chip${d.rds?.trigger===t.id?' on-r':''}`,onClick:()=>set({qlDraft:{...d,rds:{...d.rds,trigger:t.id}}})},t.label)); });
      rds.appendChild(tr);
      rds.appendChild(el('div',{class:'rds-title',style:'margin-top:10px'},'Wie lange?'));
      const dr=el('div',{class:'chips'});
      RDS_DURS.forEach(t=>{ dr.appendChild(el('button',{class:`chip${d.rds?.duration===t.id?' on-r':''}`,onClick:()=>set({qlDraft:{...d,rds:{...d.rds,duration:t.id}}})},t.label)); });
      rds.appendChild(dr);
      sheet.appendChild(rds);
    }

    // Med effect sub-form
    if(d.medEffect){
      const mef=el('div',{class:'mef-form'});
      mef.appendChild(el('div',{class:'rds-title'},'💊 Wie wirkt das Medikament?'));
      const mr=el('div',{class:'chips'});
      MED_EFFECTS.forEach(e=>{ mr.appendChild(el('button',{class:`chip${d.medEffect===e.id?' on':''}`,onClick:()=>set({qlDraft:{...d,medEffect:e.id}})},`${e.emoji} ${e.label}`)); });
      mef.appendChild(mr); sheet.appendChild(mef);
    }

    // Note
    const noteInput=el('textarea',{placeholder:'Notiz (optional)…'},d.note||'');
    noteInput.addEventListener('input',()=>{ const nd={...S.qlDraft,note:noteInput.value}; S.qlDraft=nd; });
    sheet.appendChild(el('div',{style:'margin-top:10px'},noteInput));

    // Save
    const botRow=el('div',{class:'bot-row',style:'margin-top:14px'});
    botRow.appendChild(el('button',{class:'btn btn-s',style:'flex:1',onClick:()=>set({showQL:false,qlDraft:null})},'Abbrechen'));
    botRow.appendChild(el('button',{class:'btn btn-p',style:'flex:2',onClick:()=>saveQuickLog(S.qlDraft||{})},'Speichern ✓'));
    sheet.appendChild(botRow);
  }
  overlay.appendChild(sheet);
  return overlay;
}

// ─────────────────────────────────────────
// RENDER: CHECK-IN FLOW (3 steps)
// ─────────────────────────────────────────
function renderCheckinFlow(){
  const d=S.ciDraft||{};
  const page=el('div',{class:'ci-page'});

  // Progress dots
  const prog=el('div',{class:'ci-prog'});
  for(let i=0;i<3;i++){
    prog.appendChild(el('div',{class:`ci-dot${i<S.ciStep?' done':i===S.ciStep?' active':''}`}));
  }
  page.appendChild(prog);

  const titles=['Wie geht es dir?','Was ist passiert?','Körper-Check'];
  const top=el('div',{class:'ci-top'});
  top.appendChild(el('button',{class:'btn btn-g btn-sm',onClick:()=>set({ciStep:null,ciDraft:null})},'✕ Abbrechen'));
  top.appendChild(el('h2',{class:'ci-title'},titles[S.ciStep]||''));
  const timeDisp=el('span',{class:'small muted'},d.time||nowTimeStr());
  top.appendChild(timeDisp);
  page.appendChild(top);

  // ── STEP 0: METRICS ──
  if(S.ciStep===0){
    page.appendChild(el('div',{class:'ci-subtitle'},'Aktuelle Verfassung auf einer Skala von 1–5'));
    const primSec=el('div');
    METRICS.filter(m=>m.primary).forEach(m=>{
      const row=el('div',{class:'metric-row'});
      row.appendChild(el('span',{class:'metric-lbl'},m.icon+' '+m.label));
      const btns=el('div',{class:'scale-btns'});
      const cur=d.symptoms?.[m.id];
      for(let i=1;i<=5;i++){
        btns.appendChild(el('button',{class:`sc${cur===i?' s'+i:''}`,onClick:()=>{ const ns={...d.symptoms,[m.id]:i}; set({ciDraft:{...d,symptoms:ns}}); }},String(i)));
      }
      row.appendChild(btns); primSec.appendChild(row);
    });
    page.appendChild(primSec);
    page.appendChild(el('div',{class:'divider'}));
    page.appendChild(el('div',{class:'ci-subtitle',style:'margin-top:8px'},'Innere Signale'));
    METRICS.filter(m=>!m.primary).forEach(m=>{
      const row=el('div',{class:'metric-row'});
      row.appendChild(el('span',{class:'metric-lbl'},m.icon+' '+m.label));
      const btns=el('div',{class:'scale-btns'});
      const cur=d.symptoms?.[m.id];
      for(let i=1;i<=5;i++){
        btns.appendChild(el('button',{class:`sc${cur===i?' s'+i:''}`,onClick:()=>{ const ns={...d.symptoms,[m.id]:i}; set({ciDraft:{...d,symptoms:ns}}); }},String(i)));
      }
      row.appendChild(btns); primSec.appendChild(row);
      page.appendChild(row);
    });
    const botRow=el('div',{class:'bot-row',style:'position:fixed;bottom:0;left:0;right:0;background:var(--bg);padding:14px 16px;padding-bottom:calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--bdr);max-width:460px;margin:0 auto'});
    botRow.appendChild(el('button',{class:'btn btn-s',style:'flex:1',onClick:()=>{ if(Object.keys(d.symptoms||{}).some(k=>d.symptoms[k])) saveCheckin({...d,ciStep:0}); }},'Nur speichern'));
    botRow.appendChild(el('button',{class:'btn btn-p',style:'flex:2',onClick:()=>set({ciStep:1})},'Weiter →'));
    page.appendChild(botRow);
  }

  // ── STEP 1: EVENTS ──
  if(S.ciStep===1){
    page.appendChild(el('div',{class:'ci-subtitle'},'Was hat diesen Moment beeinflusst?'));
    // Med effect
    page.appendChild(el('div',{class:'sec-hdr'},'💊 Medikationswirkung'));
    const mef=el('div',{class:'chips'});
    MED_EFFECTS.forEach(e=>{
      mef.appendChild(el('button',{class:`chip${d.medEffect===e.id?' on':''}`,onClick:()=>set({ciDraft:{...d,medEffect:d.medEffect===e.id?null:e.id}})},`${e.emoji} ${e.label}`));
    });
    page.appendChild(mef);
    // Koffein & Essen
    page.appendChild(el('div',{class:'sec-hdr'},'☕ Koffein & Essen'));
    const caf=el('div',{class:'chips'});
    [...EV_CAFF,...EV_FOOD].forEach(item=>{
      const isOn=(d.events||[]).some(e=>e.label===item.label);
      caf.appendChild(el('button',{class:`chip${isOn?' on':''}`,onClick:()=>{
        const evs=(d.events||[]).filter(e=>e.label!==item.label);
        if(!isOn) evs.push({type:item.type,label:item.label,emoji:item.emoji});
        set({ciDraft:{...d,events:evs}});
      }},item.emoji+' '+item.label));
    });
    page.appendChild(caf);
    // Positive
    page.appendChild(el('div',{class:'sec-hdr'},'✅ Positive Momente'));
    const pos=el('div',{class:'chips'});
    EV_POS_PRESETS.forEach(label=>{
      const isOn=(d.events||[]).some(e=>e.label===label&&e.type==='pos');
      pos.appendChild(el('button',{class:`chip${isOn?' on-g':''}`,onClick:()=>{
        const evs=(d.events||[]).filter(e=>!(e.label===label&&e.type==='pos'));
        if(!isOn) evs.push({type:'pos',label});
        set({ciDraft:{...d,events:evs}});
      }},label));
    });
    page.appendChild(pos);
    // Negative
    page.appendChild(el('div',{class:'sec-hdr'},'⚠️ Schwierige Momente'));
    const neg=el('div',{class:'chips'});
    EV_NEG_PRESETS.forEach(label=>{
      const isOn=(d.events||[]).some(e=>e.label===label&&e.type==='neg');
      neg.appendChild(el('button',{class:`chip${isOn?' on-r':''}`,onClick:()=>{
        const evs=(d.events||[]).filter(e=>!(e.label===label&&e.type==='neg'));
        if(!isOn) evs.push({type:'neg',label});
        set({ciDraft:{...d,events:evs}});
      }},label));
    });
    page.appendChild(neg);
    // Note
    page.appendChild(el('div',{class:'sec-hdr'},'📝 Notiz (optional)'));
    const noteI=el('textarea',{placeholder:'Was geht dir gerade durch den Kopf?'},d.note||'');
    noteI.addEventListener('input',()=>{ S.ciDraft={...S.ciDraft,note:noteI.value}; });
    page.appendChild(noteI);
    const botRow=el('div',{class:'bot-row',style:'position:fixed;bottom:0;left:0;right:0;background:var(--bg);padding:14px 16px;padding-bottom:calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--bdr);max-width:460px;margin:0 auto'});
    botRow.appendChild(el('button',{class:'btn btn-s',style:'flex:1',onClick:()=>set({ciStep:0})},'← Zurück'));
    botRow.appendChild(el('button',{class:'btn btn-p',style:'flex:2',onClick:()=>set({ciStep:2})},'Weiter →'));
    page.appendChild(botRow);
  }

  // ── STEP 2: BODY ──
  if(S.ciStep===2){
    page.appendChild(el('div',{class:'ci-subtitle'},'Körperliche Signale – überspringbar'));
    // Health flags
    page.appendChild(el('div',{class:'sec-hdr'},'🩺 Körperliche Signale'));
    const hf=el('div',{class:'chips'});
    HEALTH_FLAGS.forEach(f=>{
      const isOn=!!(d.healthFlags?.[f.id]);
      hf.appendChild(el('button',{class:`chip${isOn?' on':''}`,onClick:()=>{ const hfs={...d.healthFlags,[f.id]:!isOn}; set({ciDraft:{...d,healthFlags:hfs}}); }},f.emoji+' '+f.label));
    });
    page.appendChild(hf);
    // Ibuprofen
    page.appendChild(el('div',{class:'sec-hdr'},'💊 Ibuprofen'));
    const ibu=el('div',{class:'chips'});
    IBU_OPTS.forEach(mg=>{
      ibu.appendChild(el('button',{class:`chip${d.ibuprofenMg===mg?' on':''}`,onClick:()=>set({ciDraft:{...d,ibuprofenMg:mg}})},mg===0?'Kein':mg+'mg'));
    });
    page.appendChild(ibu);
    // Pain map (only if gelenke)
    if(d.healthFlags?.gelenke){
      page.appendChild(el('div',{class:'sec-hdr'},'🗺️ Schmerz-Lokalisierung'));
      const painWrap=el('div',{class:'pain-wrap'});
      const svg=buildPainSvg({},true,d.painLocations||[]);
      painWrap.innerHTML=svg;
      painWrap.querySelectorAll('circle[data-loc]').forEach(circ=>{
        circ.addEventListener('click',()=>{
          const loc=circ.getAttribute('data-loc');
          const locs=[...(d.painLocations||[])];
          const idx=locs.indexOf(loc);
          if(idx>=0) locs.splice(idx,1); else locs.push(loc);
          set({ciDraft:{...d,painLocations:locs}});
        });
      });
      page.appendChild(painWrap);
      if(d.painLocations?.length){
        const lbls=d.painLocations.map(id=>PAIN_LOCS.find(p=>p.id===id)?.label||id).join(', ');
        page.appendChild(el('div',{class:'small muted',style:'text-align:center;margin-bottom:8px'},lbls));
      }
    }
    const botRow=el('div',{class:'bot-row',style:'position:fixed;bottom:0;left:0;right:0;background:var(--bg);padding:14px 16px;padding-bottom:calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--bdr);max-width:460px;margin:0 auto'});
    botRow.appendChild(el('button',{class:'btn btn-s btn-sm',style:'flex:1',onClick:()=>set({ciStep:1})},'← Zurück'));
    botRow.appendChild(el('button',{class:'btn btn-s btn-sm',style:'flex:1',onClick:()=>saveCheckin(S.ciDraft||{})},'Überspringen'));
    botRow.appendChild(el('button',{class:'btn btn-p',style:'flex:2',onClick:()=>saveCheckin(S.ciDraft||{})},'Speichern ✓'));
    page.appendChild(botRow);
  }

  return page;
}

// ─────────────────────────────────────────
// RENDER: MORNING MODAL
// ─────────────────────────────────────────
function renderMorningModal(){
  const d=S.mDraft||{};
  const overlay=el('div',{class:'overlay',onClick:(e)=>{if(e.target===overlay)set({showMorning:false,mDraft:null});}});
  const sheet=el('div',{class:'sheet'});
  sheet.appendChild(el('div',{class:'sheet-handle'}));
  // Header
  const hdr=el('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-bottom:14px'});
  hdr.appendChild(el('h2',{class:'ci-title',style:'font-size:17px'},'☀️ Tages-Formular'));
  hdr.appendChild(el('span',{class:'small muted'},fmtDateS(S.selDate)));
  sheet.appendChild(hdr);

  // Pause day toggle
  const pRow=el('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:10px 12px;background:var(--dim);border-radius:10px'});
  pRow.appendChild(el('span',{class:'set-lbl'},'⏸ Medikations-Pause'));
  const ptgl=el('label',{class:'tgl'});
  const ptgInp=el('input',{type:'checkbox'}); if(d.isPauseDay) ptgInp.checked=true;
  ptgInp.addEventListener('change',()=>set({mDraft:{...S.mDraft,isPauseDay:ptgInp.checked,medication:ptgInp.checked?'':S.mDraft.medication}}));
  ptgl.appendChild(ptgInp); ptgl.appendChild(el('span',{class:'tgl-sl'}));
  pRow.appendChild(ptgl); sheet.appendChild(pRow);

  if(!d.isPauseDay){
    // Medication
    sheet.appendChild(el('div',{class:'sec-hdr'},'💊 Medikament'));
    const mRow=el('div',{class:'field-row'});
    const medSel=el('select');
    getMeds().forEach(name=>{
      const opt=el('option',{value:name},name); if(d.medication===name) opt.selected=true;
      medSel.appendChild(opt);
    });
    const customOpt=el('option',{value:'custom'},'Eigenes…'); if(!getMeds().includes(d.medication||'') && d.medication) customOpt.selected=true;
    medSel.appendChild(customOpt);
    medSel.addEventListener('change',()=>set({mDraft:{...S.mDraft,medication:medSel.value==='custom'?'':medSel.value}}));
    const doseInp=el('input',{type:'number',placeholder:'mg',min:'0',max:'500',value:d.dosage||''});
    doseInp.addEventListener('input',()=>{ S.mDraft={...S.mDraft,dosage:doseInp.value}; });
    const timeInp=el('input',{type:'time',value:d.takenAt||''});
    timeInp.addEventListener('change',()=>{ S.mDraft={...S.mDraft,takenAt:timeInp.value}; });
    mRow.appendChild(medSel); mRow.appendChild(doseInp); mRow.appendChild(timeInp);
    sheet.appendChild(mRow);
    if(getMedTherapy()){
      const mfRow=el('div',{class:'field-row'});
      mfRow.appendChild(el('span',{class:'field-lbl'},'Hersteller'));
      const mfSel=el('select');
      getManufacturers().forEach(n=>{ const o=el('option',{value:n},n); if(d.manufacturer===n) o.selected=true; mfSel.appendChild(o); });
      mfSel.appendChild(el('option',{value:''},'–'));
      mfSel.addEventListener('change',()=>{ S.mDraft={...S.mDraft,manufacturer:mfSel.value}; });
      mfRow.appendChild(mfSel); sheet.appendChild(mfRow);
    }
    // Special flags
    const flagRow=el('div',{class:'chips',style:'margin-bottom:8px'});
    [{id:'isBaseline',label:'🔬 Baseline'},{id:'isSick',label:'🤒 Krank'}].forEach(f=>{
      flagRow.appendChild(el('button',{class:`chip${d[f.id]?' on':''}`,onClick:()=>set({mDraft:{...S.mDraft,[f.id]:!d[f.id]}})},f.label));
    });
    sheet.appendChild(flagRow);
  }

  // Sleep
  sheet.appendChild(el('div',{class:'sec-hdr'},'😴 Schlaf'));
  const slRow=el('div',{class:'field-row'});
  const wakeInp=el('input',{type:'time',value:d.wakeTime||''});
  wakeInp.addEventListener('change',()=>{ S.mDraft={...S.mDraft,wakeTime:wakeInp.value}; });
  const sleepInp=el('input',{type:'time',value:d.sleepTime||''});
  sleepInp.addEventListener('change',()=>{ S.mDraft={...S.mDraft,sleepTime:sleepInp.value}; });
  slRow.appendChild(el('span',{class:'field-lbl'},'Aufgestanden'));
  slRow.appendChild(wakeInp);
  slRow.appendChild(el('span',{class:'small muted'},'Eingeschlafen'));
  slRow.appendChild(sleepInp);
  sheet.appendChild(slRow);
  if(d.wakeTime&&d.sleepTime){
    const sh=calcSleep(d.wakeTime,d.sleepTime);
    if(sh) sheet.appendChild(el('div',{class:'small muted',style:'margin-bottom:8px'},`→ ${sh}h Schlaf`));
  }
  // Sleep quality
  const sqRow=el('div',{class:'chips',style:'margin-bottom:6px'});
  SLEEP_QUALITY.forEach(q=>{
    sqRow.appendChild(el('button',{class:`chip${d.sleepQuality===q.id?' on':''}`,onClick:()=>set({mDraft:{...S.mDraft,sleepQuality:q.id}})},q.label));
  });
  sheet.appendChild(sqRow);
  if(d.sleepQuality==='bad'){
    const stRow=el('div',{class:'chips'});
    SLEEP_TAGS.forEach(t=>{
      const isOn=(d.sleepTags||[]).includes(t.id);
      stRow.appendChild(el('button',{class:`chip${isOn?' on-p':''}`,onClick:()=>{
        const tgs=(d.sleepTags||[]).filter(x=>x!==t.id);
        if(!isOn) tgs.push(t.id);
        set({mDraft:{...S.mDraft,sleepTags:tgs}});
      }},t.icon+' '+t.label));
    });
    sheet.appendChild(stRow);
  }

  // Context
  sheet.appendChild(el('div',{class:'sec-hdr'},'🗂 Heute ist'));
  const ctxRow=el('div',{class:'chips'});
  CTX_TAGS.forEach(t=>{ ctxRow.appendChild(el('button',{class:`chip${(d.context||[]).includes(t.id)?' on':''}`,onClick:()=>{ const c=[...(d.context||[]).filter(x=>x!==t.id)]; if(!(d.context||[]).includes(t.id)) c.push(t.id); set({mDraft:{...S.mDraft,context:c}}); }},t.icon+' '+t.label)); });
  sheet.appendChild(ctxRow);
  const stRow=el('div',{class:'chips',style:'margin-bottom:8px'});
  STRESS_TAGS.forEach(t=>{ stRow.appendChild(el('button',{class:`chip${(d.stressTags||[]).includes(t.id)?' on':''}`,onClick:()=>{ const c=[...(d.stressTags||[]).filter(x=>x!==t.id)]; if(!(d.stressTags||[]).includes(t.id)) c.push(t.id); set({mDraft:{...S.mDraft,stressTags:c}}); }},t.icon+' '+t.label)); });
  sheet.appendChild(stRow);

  // Vitals (collapsible-ish, just shown directly)
  sheet.appendChild(el('div',{class:'sec-hdr'},'📊 Vitaldaten (optional)'));
  const vitRow=el('div',{class:'field-row'});
  vitRow.appendChild(el('span',{class:'field-lbl'},'⚖️ Gewicht'));
  const wInp=el('input',{type:'number',placeholder:'kg',step:'0.1',value:d.weight||''});
  wInp.addEventListener('input',()=>{ S.mDraft={...S.mDraft,weight:wInp.value}; });
  vitRow.appendChild(wInp);
  sheet.appendChild(vitRow);
  const bpRow=el('div',{class:'field-row'});
  bpRow.appendChild(el('span',{class:'field-lbl'},'❤️ RR'));
  const sysI=el('input',{type:'number',placeholder:'Sys',style:'width:62px',value:d.bpSys||d.bp?.sys||''});
  const diaI=el('input',{type:'number',placeholder:'Dia',style:'width:62px',value:d.bpDia||d.bp?.dia||''});
  const pI=el('input',{type:'number',placeholder:'Puls',style:'width:62px',value:d.bpPuls||d.bp?.puls||''});
  [sysI,diaI,pI].forEach((inp,i)=>inp.addEventListener('input',()=>{ const keys=['bpSys','bpDia','bpPuls']; S.mDraft={...S.mDraft,[keys[i]]:inp.value}; }));
  bpRow.appendChild(sysI); bpRow.appendChild(el('span',{class:'small muted'},'/'));
  bpRow.appendChild(diaI); bpRow.appendChild(el('span',{class:'small muted'},'·'));
  bpRow.appendChild(pI);
  sheet.appendChild(bpRow);

  // Save/Cancel
  const botRow=el('div',{class:'bot-row'});
  botRow.appendChild(el('button',{class:'btn btn-s',style:'flex:1',onClick:()=>set({showMorning:false,mDraft:null})},'Abbrechen'));
  botRow.appendChild(el('button',{class:'btn btn-p',style:'flex:2',onClick:()=>saveMorning(S.mDraft||{})},'Speichern ✓'));
  sheet.appendChild(botRow);
  overlay.appendChild(sheet);
  return overlay;
}

// ─────────────────────────────────────────
// RENDER: STATS – VERLAUF TAB
// ─────────────────────────────────────────
function renderStatsVerlauf(){
  const sec=el('div',{class:'stats-sec'});
  const range=parseInt(S.graphRange)||14;
  // Range selector
  const rr=el('div',{class:'range-row'});
  [['7','7 Tage'],['14','14 Tage'],['30','30 Tage'],['90','3 Monate'],['365','Jahr']].forEach(([v,label])=>{
    rr.appendChild(el('button',{class:`rb${S.graphRange===v?' active':''}`,onClick:()=>set({graphRange:v})},label));
  });
  sec.appendChild(rr);
  // Metric selector
  const ms=el('div',{class:'chips',style:'margin-bottom:12px'});
  METRICS.forEach(m=>{
    ms.appendChild(el('button',{class:`chip${S.graphMetrics.includes(m.id)?' on':''}`,onClick:()=>{
      const gm=[...S.graphMetrics]; const idx=gm.indexOf(m.id);
      if(idx>=0&&gm.length>1) gm.splice(idx,1); else if(idx<0) gm.push(m.id);
      set({graphMetrics:gm});
    }},m.icon+' '+m.label));
  });
  sec.appendChild(ms);
  // Graph
  const card=el('div',{class:'stat-card',style:'overflow:hidden;padding:10px 0'});
  card.appendChild(svgEl(buildTrendGraph(S.graphMetrics,range)));
  // Legend
  const colors={'focus':'#60a5fa','mood':'#4ade80','energy':'#fcd34d','unrest':'#fb923c','impulse':'#c084fc','hunger':'#f472b6'};
  const leg=el('div',{style:'display:flex;gap:12px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--bdr)'});
  S.graphMetrics.forEach(id=>{ const m=METRICS.find(x=>x.id===id); const avg=avgStat(id); leg.appendChild(el('span',{style:`font-size:12px;color:${colors[id]||'#aaa'}`},`${m?.icon} Ø ${avg||'–'}`)); });
  card.appendChild(leg);
  sec.appendChild(card);
  return sec;
}

// ─────────────────────────────────────────
// RENDER: STATS – MUSTER TAB
// ─────────────────────────────────────────
function renderStatsMuster(){
  const sec=el('div',{class:'stats-sec'});
  // Insights
  sec.appendChild(el('div',{class:'sec-hdr'},'💡 Automatische Erkenntnisse'));
  const ins=generateInsights();
  ins.forEach(txt=>{ const c=el('div',{class:'insight'}); c.innerHTML=txt; sec.appendChild(c); });
  // Med comparison
  const cmp=getMedCompareDays();
  if(cmp.med.n>=2||cmp.pause.n>=2){
    sec.appendChild(el('div',{class:'sec-hdr'},`📊 Medikations-Vergleich`));
    const card=el('div',{class:'stat-card'});
    const tbl=el('table',{style:'width:100%;border-collapse:collapse;font-size:12px'});
    const hdRow=el('tr'); ['Metrik',`💊 (${cmp.med.n})`,'Pause',cmp.base.n?'Base':''].filter(Boolean).forEach(h=>hdRow.appendChild(el('th',{style:'text-align:left;padding:5px 4px;color:var(--mut);font-weight:600'},h)));
    tbl.appendChild(hdRow);
    METRICS.forEach(({id,icon,label})=>{
      const m=cmp.med.avgs[id], p=cmp.pause.avgs[id];
      if(!m&&!p) return;
      const tr=el('tr');
      tr.appendChild(el('td',{style:'padding:4px;font-size:12px'},icon+' '+label));
      tr.appendChild(el('td',{style:`padding:4px;color:${rcol(parseFloat(m)||0)}`},m||'–'));
      tr.appendChild(el('td',{style:`padding:4px;color:${rcol(parseFloat(p)||0)}`},p||'–'));
      if(cmp.base.n) tr.appendChild(el('td',{style:'padding:4px;color:var(--mut)'},cmp.base.avgs[id]||'–'));
      tbl.appendChild(tr);
    });
    card.appendChild(tbl); sec.appendChild(card);
  }
  // Event bar chart
  const evts=getEventCounts();
  if(evts.length){
    sec.appendChild(el('div',{class:'sec-hdr'},'📦 Häufigste Events'));
    const card2=el('div',{class:'stat-card',style:'overflow:hidden;padding:10px 0'});
    card2.appendChild(svgEl(buildBarGraph(evts,'var(--acc)')));
    sec.appendChild(card2);
  }
  return sec;
}

// ─────────────────────────────────────────
// RENDER: STATS – KÖRPER TAB
// ─────────────────────────────────────────
function renderStatsKoerper(){
  const sec=el('div',{class:'stats-sec'});
  const daysBack=90;
  // Weight
  const wSer=getBodySeries('weight',daysBack);
  if(wSer.length>=2){
    sec.appendChild(el('div',{class:'sec-hdr'},'⚖️ Gewicht'));
    const wCard=el('div',{class:'stat-card',style:'overflow:hidden;padding:10px 0'});
    wCard.appendChild(svgEl(buildLineGraph(wSer)));
    const diff=(+wSer[wSer.length-1].val - +wSer[0].val).toFixed(1);
    const diffC=diff>0?'var(--red)':diff<0?'var(--grn)':'var(--mut)';
    wCard.appendChild(el('div',{style:`font-size:12px;color:${diffC};padding:6px 12px`},`Aktuell: ${wSer[wSer.length-1].val} kg · Veränderung: ${diff>0?'+':''}${diff} kg`));
    sec.appendChild(wCard);
  }
  // BP
  const bpSer=getBPSeries(daysBack);
  if(bpSer.length>=2){
    sec.appendChild(el('div',{class:'sec-hdr'},'❤️ Blutdruck'));
    const bpCard=el('div',{class:'stat-card'});
    const bpAvgS=Math.round(bpSer.reduce((s,d)=>s+d.sys,0)/bpSer.length);
    const bpAvgD=Math.round(bpSer.reduce((s,d)=>s+d.dia,0)/bpSer.length);
    bpCard.appendChild(el('div',{class:'small muted'},`Ø ${bpAvgS}/${bpAvgD} mmHg · Letzte ${bpSer.length} Messungen`));
    const rows=el('div',{style:'margin-top:8px'});
    bpSer.slice(-5).forEach(d=>{ rows.appendChild(el('div',{class:'small',style:'padding:3px 0;border-bottom:1px solid var(--dim)'},`${d.date}: ${d.sys}/${d.dia}`)); });
    bpCard.appendChild(rows); sec.appendChild(bpCard);
  }
  // Pain heatmap
  const heat=getPainHeat();
  if(Object.keys(heat).length){
    sec.appendChild(el('div',{class:'sec-hdr'},'🗺️ Schmerz-Heatmap'));
    const pCard=el('div',{class:'stat-card'});
    const pw=el('div',{class:'pain-wrap'});
    pw.innerHTML=buildPainSvg(heat,false,[]);
    pCard.appendChild(pw);
    const topLocs=Object.entries(heat).sort((a,b)=>b[1]-a[1]).slice(0,3);
    topLocs.forEach(([id,cnt])=>{ const l=PAIN_LOCS.find(p=>p.id===id); if(l) pCard.appendChild(el('div',{class:'small muted'},`${l.label}: ${cnt}×`)); });
    sec.appendChild(pCard);
  }
  // Health flags overview
  const flagCounts={};
  Object.values(S.data||{}).forEach(day=>{
    (day.logs||[]).forEach(l=>{
      (l.healthFlags||[]).forEach(id=>{ flagCounts[id]=(flagCounts[id]||0)+1; });
      if(l.type==='checkin'&&l.healthFlags&&typeof l.healthFlags==='object') {
        Object.entries(l.healthFlags).forEach(([id,v])=>{ if(v) flagCounts[id]=(flagCounts[id]||0)+1; });
      }
    });
  });
  if(Object.keys(flagCounts).length){
    sec.appendChild(el('div',{class:'sec-hdr'},'🩺 Symptom-Häufigkeit'));
    const fc=el('div',{class:'stat-card'});
    Object.entries(flagCounts).sort((a,b)=>b[1]-a[1]).forEach(([id,cnt])=>{
      const f=HEALTH_FLAGS.find(x=>x.id===id); if(!f) return;
      const row=el('div',{style:'display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--dim);font-size:13px'});
      row.appendChild(document.createTextNode(`${f.emoji} ${f.label}`));
      row.appendChild(el('span',{class:'small muted'},`${cnt}×`));
      fc.appendChild(row);
    });
    sec.appendChild(fc);
  }
  if(!wSer.length&&!bpSer.length&&!Object.keys(heat).length){
    sec.appendChild(el('div',{style:'text-align:center;padding:32px;color:var(--mut);font-size:14px'},'Keine Körperdaten vorhanden.\nGib Gewicht & Blutdruck im Morgen-Formular ein.'));
  }
  return sec;
}

// ─────────────────────────────────────────
// RENDER: STATS – BERICHT TAB
// ─────────────────────────────────────────
function renderStatsBericht(){
  const sec=el('div',{class:'stats-sec'});
  sec.appendChild(el('div',{class:'sec-hdr'},'📄 Klinischer Bericht'));
  const rCard=el('div',{class:'stat-card'});
  const rd=buildReportData();
  const preview=`Zeitraum: ${rd.dateFrom} – ${rd.dateTo}\nTage: ${rd.totalDays} · Check-ins: ${rd.totalCheckins}\nFokus Ø: ${rd.metricAvgs.focus||'–'} · Stimmung Ø: ${rd.metricAvgs.mood||'–'}\nMedikationstage: ${rd.medDays} · Pause: ${rd.pauseDays}`;
  rCard.appendChild(el('div',{class:'report-text'},preview));
  const btnRow=el('div',{class:'bot-row'});
  btnRow.appendChild(el('button',{class:'btn btn-s btn-sm',style:'flex:1',onClick:printReport},'🖨️ Drucken'));
  btnRow.appendChild(el('button',{class:'btn btn-s btn-sm',style:'flex:1',onClick:exportJSON},'💾 JSON'));
  btnRow.appendChild(el('button',{class:'btn btn-s btn-sm',style:'flex:1',onClick:exportCSV},'📊 CSV'));
  rCard.appendChild(btnRow); sec.appendChild(rCard);

  // Import
  sec.appendChild(el('div',{class:'sec-hdr'},'📥 Daten importieren'));
  const impCard=el('div',{class:'stat-card'});
  const ta=el('textarea',{placeholder:'JSON hier einfügen…',style:'height:80px'});
  impCard.appendChild(ta);
  impCard.appendChild(el('button',{class:'btn btn-s btn-w btn-sm',style:'margin-top:8px',onClick:()=>{ if(ta.value.trim()) importJSON(ta.value.trim()); }},'Import starten'));
  sec.appendChild(impCard);

  // Stats summary
  sec.appendChild(el('div',{class:'sec-hdr'},'📈 Übersicht'));
  const sumCard=el('div',{class:'stat-card'});
  METRICS.forEach(({id,icon,label})=>{
    const avg=avgStat(id); if(!avg) return;
    const row=el('div',{style:'display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--dim)'});
    row.appendChild(el('span',{class:'small'},icon+' '+label));
    row.appendChild(el('span',{class:`small metric-chip ${rclass(Math.round(parseFloat(avg)))}`},`Ø ${avg}`));
    sumCard.appendChild(row);
  });
  sec.appendChild(sumCard);
  return sec;
}

// ─────────────────────────────────────────
// RENDER: STATS (router)
// ─────────────────────────────────────────
function renderStats(){
  const wrap=el('div');
  // Topbar
  const tb=el('div',{class:'topbar'});
  const tbl=el('div',{class:'tb-left'});
  tbl.innerHTML=logoSvg();
  tbl.appendChild(el('span',{class:'tb-title'},'Trends'));
  tb.appendChild(tbl); wrap.appendChild(tb);
  // Sub-tabs
  const tabs=el('div',{class:'stats-tabs'});
  [['verlauf','📈 Verlauf'],['muster','🔍 Muster'],['koerper','🩺 Körper'],['bericht','📄 Bericht']].forEach(([id,label])=>{
    tabs.appendChild(el('button',{class:`stab${S.statsTab===id?' active':''}`,onClick:()=>set({statsTab:id})},label));
  });
  wrap.appendChild(tabs);
  const checks=allCheckinLogs();
  if(!checks.length){
    const empty=el('div',{style:'text-align:center;padding:40px 16px;color:var(--mut)'});
    empty.appendChild(el('div',{style:'font-size:36px;margin-bottom:10px'},'📊'));
    empty.appendChild(el('div',{style:'font-size:14px'},'Noch keine Check-in-Daten.\nStarte mit einem Check-in im Heute-Tab.'));
    wrap.appendChild(empty); return wrap;
  }
  if(S.statsTab==='verlauf') wrap.appendChild(renderStatsVerlauf());
  else if(S.statsTab==='muster') wrap.appendChild(renderStatsMuster());
  else if(S.statsTab==='koerper') wrap.appendChild(renderStatsKoerper());
  else if(S.statsTab==='bericht') wrap.appendChild(renderStatsBericht());
  return wrap;
}

// ─────────────────────────────────────────
// RENDER: MEHR TAB
// ─────────────────────────────────────────
function renderMehr(){
  const wrap=el('div');
  const tb=el('div',{class:'topbar'});
  const tbl=el('div',{class:'tb-left'});
  tbl.innerHTML=logoSvg(); tbl.appendChild(el('span',{class:'tb-title'},'Einstellungen'));
  tb.appendChild(tbl); wrap.appendChild(tb);

  const sec=el('div',{class:'mehr-sec'});
  const st=loadSettings();

  // Personal data
  sec.appendChild(el('div',{class:'sec-hdr'},'👤 Persönliche Daten'));
  const pd=el('div',{class:'stat-card'});
  [['patientName','Name'],['doctorName','Behandler'],['height','Größe (cm)']].forEach(([k,label])=>{
    const r=el('div',{class:'set-row'});
    r.appendChild(el('span',{class:'set-lbl'},label));
    const inp=el('input',{type:'text',placeholder:label,value:st[k]||''});
    inp.addEventListener('change',()=>{ const s=loadSettings(); s[k]=inp.value; saveSettings(s); });
    r.appendChild(inp); pd.appendChild(r);
  });
  sec.appendChild(pd);

  // Treatment status
  sec.appendChild(el('div',{class:'sec-hdr'},'💊 Behandlungsstatus'));
  const ts=el('div',{class:'chips',style:'padding:0 0 10px'});
  [['standard','Standard'],['untreated','Unbehandelt'],['no_meds','Ohne Medikation']].forEach(([v,l])=>{
    ts.appendChild(el('button',{class:`chip${(st.treatmentStatus||'standard')===v?' on':''}`,onClick:()=>{ const s=loadSettings(); s.treatmentStatus=v; saveSettings(s); set({}); }},l));
  });
  sec.appendChild(ts);

  // Med therapy toggle
  const mtCard=el('div',{class:'stat-card'});
  const mtRow=el('div',{class:'set-row'});
  const mtLeft=el('div');
  mtLeft.appendChild(el('div',{class:'set-lbl'},'Hersteller-Tracking'));
  mtLeft.appendChild(el('div',{class:'set-desc'},'Erweiterte Medikamenten-Dokumentation'));
  mtRow.appendChild(mtLeft);
  const mtgl=el('label',{class:'tgl'}); const mtInp=el('input',{type:'checkbox'});
  if(getMedTherapy()) mtInp.checked=true;
  mtInp.addEventListener('change',()=>{ const s=loadSettings(); s.medTherapy=mtInp.checked; saveSettings(s); set({}); });
  mtgl.appendChild(mtInp); mtgl.appendChild(el('span',{class:'tgl-sl'}));
  mtRow.appendChild(mtgl); mtCard.appendChild(mtRow); sec.appendChild(mtCard);

  // Medications list
  sec.appendChild(el('div',{class:'sec-hdr'},'🗂 Medikamente'));
  const mCard=el('div',{class:'stat-card'});
  getMeds().forEach((m,i)=>{
    const r=el('div',{class:'set-row'});
    r.appendChild(el('span',{class:'small'},m));
    r.appendChild(el('button',{class:'btn btn-d btn-sm',onClick:()=>{
      const s=loadSettings(); const meds=getMeds().filter((_,j)=>j!==i);
      s.meds=meds; saveSettings(s); set({});
    }},'✕'));
    mCard.appendChild(r);
  });
  const addMed=el('div',{class:'field-row',style:'margin-top:8px'});
  const newMedI=el('input',{type:'text',placeholder:'Neues Medikament…'});
  addMed.appendChild(newMedI);
  addMed.appendChild(el('button',{class:'btn btn-s btn-sm',onClick:()=>{
    if(!newMedI.value.trim()) return;
    const s=loadSettings(); const meds=getMeds(); meds.push(newMedI.value.trim());
    s.meds=meds; saveSettings(s); newMedI.value=''; set({});
  }},'+ Add'));
  mCard.appendChild(addMed); sec.appendChild(mCard);

  // Manufacturers
  sec.appendChild(el('div',{class:'sec-hdr'},'🏭 Hersteller'));
  const mfCard=el('div',{class:'stat-card'});
  getManufacturers().forEach((m,i)=>{
    const r=el('div',{class:'set-row'});
    r.appendChild(el('span',{class:'small'},m));
    r.appendChild(el('button',{class:'btn btn-d btn-sm',onClick:()=>{
      const s=loadSettings(); const mf=getManufacturers().filter((_,j)=>j!==i);
      s.manufacturers=mf; saveSettings(s); set({});
    }},'✕'));
    mfCard.appendChild(r);
  });
  const addMf=el('div',{class:'field-row',style:'margin-top:8px'});
  const newMfI=el('input',{type:'text',placeholder:'Neuer Hersteller…'});
  addMf.appendChild(newMfI);
  addMf.appendChild(el('button',{class:'btn btn-s btn-sm',onClick:()=>{
    if(!newMfI.value.trim()) return;
    const s=loadSettings(); const mf=getManufacturers(); mf.push(newMfI.value.trim());
    s.manufacturers=mf; saveSettings(s); newMfI.value=''; set({});
  }},'+ Add'));
  mfCard.appendChild(addMf); sec.appendChild(mfCard);

  // Danger zone
  sec.appendChild(el('div',{class:'sec-hdr'},'⚠️ Daten'));
  const dzCard=el('div',{class:'stat-card'});
  const allDays=Object.keys(S.data||{}).length;
  const allLogs=Object.values(S.data||{}).reduce((s,d)=>s+(d.logs?.length||0),0);
  dzCard.appendChild(el('div',{class:'small muted',style:'margin-bottom:10px'},`${allDays} Tage · ${allLogs} Log-Einträge`));
  const dzRow=el('div',{class:'bot-row'});
  dzRow.appendChild(el('button',{class:'btn btn-s btn-sm',style:'flex:1',onClick:exportJSON},'💾 Backup'));
  dzRow.appendChild(el('button',{class:'btn btn-d btn-sm',style:'flex:1',onClick:()=>{
    if(confirm('⚠️ ALLE Daten löschen? Dies kann nicht rückgängig gemacht werden!'))
      if(confirm('Wirklich sicher?')){ S.data={}; persist(); showToast('Daten gelöscht'); set({}); }
  }},'🗑️ Alles löschen'));
  dzCard.appendChild(dzRow); sec.appendChild(dzCard);

  // Version
  sec.appendChild(el('div',{class:'small muted',style:'text-align:center;padding:16px'},`FocusLog v2.0 · Alle Daten bleiben auf diesem Gerät.`));
  wrap.appendChild(sec);
  return wrap;
}

// ─────────────────────────────────────────
// MAIN RENDER
// ─────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  // Full-screen views (no nav, no FAB)
  if(S.ciStep!==null && S.ciDraft){
    app.appendChild(renderCheckinFlow());
    return;
  }
  // Normal tabs
  if(S.tab==='today') app.appendChild(renderToday());
  else if(S.tab==='trends') app.appendChild(renderStats());
  else if(S.tab==='mehr') app.appendChild(renderMehr());
  // Nav
  app.appendChild(renderNav());
  // FAB
  const fab=el('button',{class:'fab',onClick:()=>set({showQL:true,qlDraft:{emotion:null,intensity:3,note:'',rds:{},medEffect:null,quickEvents:[]}})}, '＋ Jetzt loggen');
  app.appendChild(fab);
  // Overlays
  if(S.showQL && S.qlDraft) app.appendChild(renderQuickLogSheet());
  if(S.showMorning && S.mDraft!==null) app.appendChild(renderMorningModal());
}

render();
</script>
