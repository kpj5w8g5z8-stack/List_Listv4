<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FocusLog">
<title>FocusLog</title>
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%230a0e1a'/><path d='M36 90h26c5 0 8-5 10-14l10-36c3-10 8-10 11 0l15 80c2 10 7 10 10 0l10-45c3-10 6-15 10-15h42' stroke='%2360a5fa' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='108' cy='75' r='7' fill='%234ade80'/></svg>">
<style>
:root{--bg:#0a0e1a;--surf:#12172a;--card:#161d30;--bdr:#253050;--acc:#60a5fa;--accL:#93c5fd;--grn:#4ade80;--red:#ff7070;--yel:#fcd34d;--ora:#fdba74;--pur:#c084fc;--pnk:#f472b6;--tel:#2dd4bf;--txt:#f4f7ff;--mut:#94a8c8;--dim:#1e2840;--r:14px;--nav:68px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;min-height:100%;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{max-width:460px;margin:0 auto;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 80px)}
/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;padding-top:calc(env(safe-area-inset-top) + 10px)}
.tb-left{display:flex;align-items:center;gap:8px}
.tb-title{font-size:20px;font-weight:800;letter-spacing:-.5px}
.tb-date{font-size:13px;color:var(--mut)}
/* Date strip */
.date-strip{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.date-strip::-webkit-scrollbar{display:none}
.dp{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:22px;font-size:10px;cursor:pointer;border:1.5px solid transparent;background:var(--dim);color:var(--mut);gap:2px;-webkit-tap-highlight-color:transparent}
.dp .dn{font-weight:700;font-size:15px}.dp .dw{font-size:10px;text-transform:uppercase}
.dp.active{background:var(--acc);color:#0a0e1a;border-color:var(--acc)}
.dp.has{background:rgba(96,165,250,.12);color:var(--accL);border-color:rgba(96,165,250,.25)}
.dp.today-ring{border-color:var(--acc)}
/* Cards */
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
/* Morning card */
.mc-empty{background:rgba(96,165,250,.05);border:1.5px dashed rgba(96,165,250,.3);border-radius:var(--r);padding:16px;margin:0 16px 10px;text-align:center}
.mc-empty .mc-et{font-size:14px;color:var(--mut);margin-bottom:10px}
.mc-filled{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 16px;margin:0 16px 10px}
.mc-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mc-main{font-size:14px;font-weight:700}
.mc-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.mc-pill{font-size:11px;padding:3px 8px;border-radius:8px;background:var(--dim);color:var(--mut)}
.mc-pill.grn{background:rgba(74,222,128,.12);color:var(--grn)}
.mc-pill.ora{background:rgba(253,186,116,.12);color:var(--ora)}
.mc-pill.red{background:rgba(255,112,112,.12);color:var(--red)}
.mc-pill.pur{background:rgba(192,132,252,.12);color:var(--pur)}
/* Log list */
.log-section{padding:0 16px}
.log-section-title{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px}
.log-entry{display:flex;gap:10px;padding:11px 13px;border-radius:var(--r);background:var(--card);border:1px solid var(--bdr);margin-bottom:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s}
.log-entry.sel{border-color:var(--acc);background:rgba(96,165,250,.06)}
.le-time{font-size:11px;color:var(--mut);min-width:36px;padding-top:2px;flex-shrink:0}
.le-icon{font-size:20px;flex-shrink:0;line-height:1.2}
.le-body{flex:1;min-width:0}
.le-main{font-size:14px;font-weight:600;line-height:1.3}
.le-sub{font-size:12px;color:var(--mut);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.le-del-row{display:flex;justify-content:flex-end;margin-top:8px;padding-top:8px;border-top:1px solid var(--dim)}
/* Intensity dots */
.idots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:5px}
.idot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.idot.pos{background:var(--grn)}.idot.neg{background:var(--red)}.idot.neu{background:var(--mut)}.idot.on{background:var(--acc)}
/* FAB */
.fab{position:fixed;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);left:50%;transform:translateX(-50%);z-index:60;background:var(--acc);border:none;border-radius:100px;padding:14px 28px;font-size:15px;font-weight:700;color:#0a0e1a;cursor:pointer;box-shadow:0 4px 24px rgba(96,165,250,.45);white-space:nowrap;-webkit-tap-highlight-color:transparent}
/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:70;display:flex;align-items:flex-end}
.sheet{background:var(--surf);border-radius:24px 24px 0 0;padding:0 16px 20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));width:100%;max-height:92vh;overflow-y:auto}
.sheet-handle{width:42px;height:4px;background:var(--bdr);border-radius:2px;margin:10px auto 14px}
.sheet-title{font-size:17px;font-weight:800;margin-bottom:14px;text-align:center}
/* Emotion grid */
.emo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.emo-btn{display:flex;flex-direction:column;align-items:center;border-radius:14px;padding:10px 4px 8px;cursor:pointer;border:2px solid var(--bdr);background:rgba(255,255,255,.02);font-family:inherit;gap:5px;-webkit-tap-highlight-color:transparent;transition:border-color .12s,background .12s}
.emo-ico{font-size:26px;line-height:1}.emo-lbl{font-size:10px;color:var(--mut);text-align:center;line-height:1.2}
.emo-btn.ep{border-color:var(--grn);background:rgba(74,222,128,.12)}.emo-btn.ep .emo-lbl{color:var(--grn)}
.emo-btn.en{border-color:var(--red);background:rgba(255,112,112,.12)}.emo-btn.en .emo-lbl{color:var(--red)}
.emo-btn.eu{border-color:var(--mut);background:rgba(148,168,200,.12)}.emo-btn.eu .emo-lbl{color:var(--mut)}
/* Intensity */
.int-row{display:flex;gap:10px;justify-content:center;margin:10px 0}
.int-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--bdr);background:none;color:var(--mut);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.int-btn.on{border-color:var(--acc);background:var(--acc);color:#0a0e1a}
/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chip{padding:6px 12px;border-radius:20px;border:1.5px solid var(--bdr);background:var(--dim);color:var(--mut);font-size:13px;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip.on{border-color:var(--acc);background:rgba(96,165,250,.15);color:var(--accL)}
.chip.on-g{border-color:var(--grn);background:rgba(74,222,128,.12);color:var(--grn)}
.chip.on-r{border-color:var(--red);background:rgba(255,112,112,.12);color:var(--red)}
.chip.on-y{border-color:var(--yel);background:rgba(252,211,77,.12);color:var(--yel)}
.chip.on-p{border-color:var(--pur);background:rgba(192,132,252,.12);color:var(--pur)}
/* Check-in */
.ci-page{padding:0 16px;padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:120px}
.ci-prog{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
.ci-dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.ci-dot.done{background:rgba(96,165,250,.4)}.ci-dot.active{background:var(--acc)}
.ci-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.ci-title{font-size:21px;font-weight:800}
.ci-subtitle{font-size:12px;color:var(--mut);margin-bottom:16px}
.metric-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.metric-lbl{font-size:13px;color:var(--mut);width:95px;flex-shrink:0}
.scale-btns{display:flex;gap:5px}
.sc{width:42px;height:35px;border-radius:10px;border:2px solid var(--bdr);background:var(--dim);color:var(--mut);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.sc.s1{border-color:#ef4444;background:rgba(239,68,68,.2);color:#ef4444}
.sc.s2{border-color:var(--ora);background:rgba(253,186,116,.2);color:var(--ora)}
.sc.s3{border-color:var(--yel);background:rgba(252,211,77,.2);color:var(--yel)}
.sc.s4{border-color:#86efac;background:rgba(134,239,172,.2);color:#86efac}
.sc.s5{border-color:var(--grn);background:rgba(74,222,128,.2);color:var(--grn)}
/* Morning modal */
.sec-hdr{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px}
.field-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.field-lbl{font-size:13px;color:var(--mut);min-width:72px;flex-shrink:0}
/* Inputs */
input[type=text],input[type=time],input[type=number],select,textarea{background:var(--dim);border:1.5px solid var(--bdr);border-radius:10px;color:var(--txt);font-family:inherit;font-size:14px;padding:8px 10px;outline:none;-webkit-appearance:none}
input[type=time]{min-width:88px}input[type=number]{width:72px}
select{background-image:url("data:image/svg+xml;utf8,<svg fill='%2394a8c8' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%2394a8c8' stroke-width='1.5' stroke-linecap='round' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 8px center;background-size:12px;padding-right:26px;min-width:110px;cursor:pointer}
textarea{width:100%;resize:none;min-height:65px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.field-row.col{flex-direction:column;align-items:flex-start}
/* Buttons */
.btn{border-radius:12px;border:none;font-family:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;font-size:15px;-webkit-tap-highlight-color:transparent;transition:opacity .12s}
.btn:active{opacity:.75}
.btn-p{background:var(--acc);color:#0a0e1a}
.btn-s{background:var(--dim);color:var(--txt);border:1.5px solid var(--bdr)}
.btn-d{background:rgba(255,112,112,.12);color:var(--red);border:1.5px solid rgba(255,112,112,.25)}
.btn-g{background:none;color:var(--mut)}
.btn-w{width:100%}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:10px}
.bot-row{display:flex;gap:9px;margin-top:14px}
/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(18,23,42,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bdr);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50;max-width:460px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;cursor:pointer;border:none;background:none;font-family:inherit;color:var(--mut);font-size:10px;font-weight:600;-webkit-tap-highlight-color:transparent}
.nav-item .ni{font-size:22px}.nav-item.active{color:var(--acc)}
/* Stats */
.stats-tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.stats-tabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:7px 15px;border-radius:20px;border:1.5px solid var(--bdr);background:var(--dim);color:var(--mut);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stab.active{background:var(--acc);border-color:var(--acc);color:#0a0e1a}
.stats-sec{padding:0 16px}
.stat-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.insight{background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.2);border-radius:var(--r);padding:11px 14px;margin-bottom:8px;font-size:13px;line-height:1.5}
.insight strong{color:var(--acc)}
.range-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.rb{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:600;border:1.5px solid var(--bdr);background:var(--dim);color:var(--mut);cursor:pointer;font-family:inherit}
.rb.active{background:rgba(96,165,250,.18);border-color:var(--acc);color:var(--accL)}
.chart-wrap{overflow-x:auto;margin:-4px 0 8px}
.chart-wrap svg{display:block}
/* Pain silhouette */
.pain-wrap{display:flex;justify-content:center;margin:8px 0}
.pain-wrap svg{max-width:160px}
/* Mehr */
.mehr-sec{padding:0 16px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--dim);gap:10px}
.set-row:last-child{border-bottom:none}
.set-lbl{font-size:14px;font-weight:500}
.set-desc{font-size:12px;color:var(--mut);margin-top:2px}
/* Toggle */
.tgl{position:relative;width:48px;height:28px;flex-shrink:0}
.tgl input{opacity:0;width:0;height:0;position:absolute}
.tgl-sl{position:absolute;cursor:pointer;inset:0;background:var(--dim);border-radius:28px;border:2px solid var(--bdr);transition:.2s}
.tgl-sl::before{content:"";position:absolute;width:20px;height:20px;border-radius:50%;left:2px;top:2px;background:var(--mut);transition:.2s}
.tgl input:checked+.tgl-sl{background:rgba(96,165,250,.25);border-color:var(--acc)}
.tgl input:checked+.tgl-sl::before{transform:translateX(20px);background:var(--acc)}
/* Report */
.report-text{background:var(--dim);border:1px solid var(--bdr);border-radius:10px;padding:12px;font-size:11px;color:var(--mut);white-space:pre-wrap;font-family:monospace;max-height:180px;overflow-y:auto;margin-bottom:10px}
/* Toast */
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 60px);left:50%;transform:translateX(-50%);background:var(--grn);color:#0a0e1a;font-weight:700;font-size:14px;padding:10px 22px;border-radius:20px;z-index:200;box-shadow:0 4px 16px rgba(74,222,128,.35);white-space:nowrap;animation:toastIn .25s ease}
@keyframes toastIn{from{transform:translateX(-50%) translateY(-8px);opacity:0}}
/* Utilities */
.muted{color:var(--mut)}.small{font-size:12px}.gap{margin-bottom:8px}.gap-lg{margin-bottom:16px}
.flex{display:flex;align-items:center;gap:8px}.fb{display:flex;align-items:center;justify-content:space-between}
.ta{color:var(--acc)}.tg{color:var(--grn)}.tr{color:var(--red)}.fw7{font-weight:700}.fw6{font-weight:600}
.divider{height:1px;background:var(--dim);margin:12px 0}
.metric-chip{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:7px;font-size:11px;font-weight:600;margin:2px}
.mc1{background:rgba(239,68,68,.15);color:#ef4444}.mc2{background:rgba(253,186,116,.15);color:var(--ora)}
.mc3{background:rgba(252,211,77,.15);color:var(--yel)}.mc4{background:rgba(134,239,172,.15);color:#86efac}
.mc5{background:rgba(74,222,128,.15);color:var(--grn)}
.p16{padding:0 16px}
/* Print */
@media print{body{background:#fff;color:#111}.nav,.fab,.topbar,.date-strip,.overlay,.toast,#app{display:none!important}#pro{display:block!important}}
#pro{display:none;position:fixed;inset:0;background:#fff;color:#111;overflow-y:auto;z-index:9999;font-size:12px;line-height:1.6;padding:32px}
#pro h1{font-size:18px;margin-bottom:4px}#pro h2{font-size:14px;margin:18px 0 6px;border-bottom:1px solid #ddd;padding-bottom:4px}
#pro table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:12px}
#pro td,#pro th{border:1px solid #ddd;padding:5px 8px}#pro th{background:#f5f5f5;font-weight:700}
.rds-form,.mef-form{background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:12px;padding:12px;margin-top:10px}
.rds-title{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="pro"></div>
<script>
// ─────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────
const SK='focuslog_v2', SET_KEY='focuslog_v2_settings';
const WDAYS=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONTHS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

const METRICS=[
  {id:'focus',  label:'Fokus',        icon:'🎯',primary:true},
  {id:'mood',   label:'Stimmung',     icon:'😊',primary:true},
  {id:'energy', label:'Energie',      icon:'🔋',primary:true},
  {id:'unrest', label:'Innere Unruhe',icon:'⚡',primary:false},
  {id:'impulse',label:'Impulsivität', icon:'💥',primary:false},
  {id:'hunger', label:'Hunger',       icon:'🍽️',primary:false},
];

const EMOTIONS=[
  {id:'gut',       label:'Gut',          emoji:'😊',v:1},
  {id:'flow',      label:'Im Flow',      emoji:'🎯',v:1},
  {id:'energy_pos',label:'Energievoll',  emoji:'⚡',v:1},
  {id:'relaxed',   label:'Entspannt',    emoji:'😌',v:1},
  {id:'ok',        label:'OK',           emoji:'😐',v:0},
  {id:'thinking',  label:'Nachdenklich', emoji:'🤔',v:0},
  {id:'tired',     label:'Müde',         emoji:'😴',v:0},
  {id:'empty',     label:'Leer/Numb',    emoji:'🌫️',v:-1},
  {id:'gereizt',   label:'Gereizt',      emoji:'😤',v:-1},
  {id:'anxious',   label:'Ängstlich',    emoji:'😰',v:-1},
  {id:'sad',       label:'Traurig',      emoji:'😢',v:-1},
  {id:'overwhelm', label:'Überwältigt',  emoji:'🌊',v:-1},
];

const MED_EFFECTS=[
  {id:'working',label:'Wirkt gut',     emoji:'✅'},
  {id:'strong', label:'Sehr stark',   emoji:'🚀'},
  {id:'fading', label:'Nachlassend',  emoji:'⬇️'},
  {id:'rebound',label:'Rebound',      emoji:'🔄'},
  {id:'crash',  label:'Crash',        emoji:'💤'},
  {id:'none',   label:'Nicht gespürt',emoji:'❌'},
];

const RDS_TRIGGERS=[
  {id:'feedback',label:'Kritik/Feedback'},{id:'ignored',label:'Übersehen'},
  {id:'rejected',label:'Abgelehnt'},      {id:'own_fail',label:'Eigener Fehler'},
  {id:'compare', label:'Vergleich'},      {id:'other',   label:'Anderes'},
];
const RDS_DURS=[
  {id:'instant',label:'Sofort vorbei'},{id:'30min',label:'< 30 Min'},
  {id:'2h',     label:'< 2 Std'},     {id:'long', label:'> 2 Std'},
];

const HEALTH_FLAGS=[
  {id:'verdauung', label:'Verdauung',   emoji:'🫃'},
  {id:'gelenke',   label:'Gelenke',     emoji:'🦵'},
  {id:'depression',label:'Niedergeschlagen',emoji:'🌧️'},
  {id:'sport',     label:'Sport',       emoji:'🏃'},
  {id:'sensory',   label:'Reizüberflutung',emoji:'🔊'},
];
const IBU_OPTS=[0,200,400,600,800];

const EV_CAFF=[
  {type:'caff',label:'Kaffee',emoji:'☕'},
  {type:'caff',label:'Matcha/Tee',emoji:'🍵'},
  {type:'caff',label:'Energy-Drink',emoji:'🥤'},
];
const EV_FOOD=[
  {type:'food',label:'Mahlzeit',emoji:'🍽️'},
  {type:'food',label:'Snack',emoji:'🍎'},
];
const EV_POS_PRESETS=['Im Flow','Aufgabe erledigt','Produktiv','Gute Energie','Ausgeglichen'];
const EV_NEG_PRESETS=['Prokrastiniert','Wut-Ausbruch','Vergessen','Reizbar','Task-Blockade'];

const CTX_TAGS=[
  {id:'arbeit',  label:'Arbeit',  icon:'🏢'},{id:'urlaub',  label:'Urlaub',  icon:'🏖'},
  {id:'familie', label:'Familie', icon:'👨‍👩‍👧'},{id:'freizeit',label:'Freizeit',icon:'🎮'},
];
const STRESS_TAGS=[
  {id:'stress',  label:'Stress',       icon:'🔴'},{id:'screen',  label:'Viel Bildschirm',icon:'📱'},

function migrateV1(old){
  const out={};
  Object.keys(old||{}).forEach(date=>{
    const d=old[date]; if(!d) return;
    const morning={};
    if(d.medication) morning.medication=d.medication;
    if(d.dosage) morning.dosage=d.dosage;
    if(d.takenAt) morning.takenAt=d.takenAt;
    if(d.manufacturer) morning.manufacturer=d.manufacturer;
    if(d.isPauseDay!==undefined) morning.isPauseDay=!!d.isPauseDay;
    if(d.isBaseline!==undefined) morning.isBaseline=!!d.isBaseline;
    if(d.isSick!==undefined) morning.isSick=!!d.isSick;
    if(d.aufgestandenAt) morning.wakeTime=d.aufgestandenAt;
    if(d.schlafenAt) morning.sleepTime=d.schlafenAt;
    if(d.gewicht) morning.weight=parseFloat(d.gewicht)||null;
    if(d.gewichtTime) morning.weightTime=d.gewichtTime;
    if(d.sys||d.dia) morning.bp={sys:parseInt(d.sys)||0,dia:parseInt(d.dia)||0,puls:parseInt(d.puls)||0,time:d.bpTime||''};
    const ctx=[]; const stt=[];
    CTX_TAGS.forEach(t=>{ if(d.dayCtx?.[t.id]) ctx.push(t.id); });
    STRESS_TAGS.forEach(t=>{ if(d.dayCtx?.[t.id]) stt.push(t.id); });
    if(ctx.length) morning.context=ctx;
    if(stt.length) morning.stressTags=stt;
    // Sleep quality from checkins
    const chks=Object.values(d.checkins||{}).filter(Boolean);
    let sq=null; const stags=new Set();
    chks.forEach(c=>{
      if(c.schlafschlecht!==undefined && sq===null) sq=c.schlafschlecht?'bad':'ok';
      Object.entries(c.sleepTags||{}).forEach(([id,v])=>{ if(v) stags.add(id); });
    });
    if(sq) morning.sleepQuality=sq;
    if(stags.size) morning.sleepTags=[...stags];
    const logs=[];
    Object.entries(d.checkins||{}).forEach(([hour,c])=>{
      if(!c) return;
      const log={id:`mig_${date}_${hour}`,time:`${String(hour).padStart(2,'0')}:00`,type:'checkin'};
      if(c.symptoms) log.symptoms={...c.symptoms};
      if(c.events) log.events=[...c.events];
      if(c.note) log.note=c.note;
      if(c.healthFlags) log.healthFlags={...c.healthFlags};
      if(c.painLocations) log.painLocations=[...c.painLocations];
      if(c.ibuprofenMg) log.ibuprofenMg=c.ibuprofenMg;
      logs.push(log);
    });
    logs.sort((a,b)=>a.time.localeCompare(b.time));
    out[date]={};
    if(Object.keys(morning).length) out[date].morning=morning;
    if(logs.length) out[date].logs=logs;
  });
  return out;
}

function load(){
  const v2r=localStorage.getItem(SK);
  if(v2r){ try{ return JSON.parse(v2r); }catch{} }
  let v1=null;
  for(const key of ['focuslog_v1','adhs_v4','adhs_tracker_v3','adhs_v3']){
    const raw=localStorage.getItem(key); if(!raw) continue;
    try{
      let p=JSON.parse(raw);
      if(p.data) p=p.data;
      if(typeof p==='object' && Object.keys(p).some(k=>/^\d{4}/.test(k)))
        v1={...p,...(v1||{})};
    }catch{}
  }
  if(!v1) return {};
  const v2=migrateV1(v1);
  try{ localStorage.setItem(SK,JSON.stringify(v2)); }catch{}
  return v2;
}

function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function nowTimeStr(){ const d=new Date(); return `${p2(d.getHours())}:${p2(d.getMinutes())}`; }
function p2(n){ return String(n).padStart(2,'0'); }
function uid(){ return `${Date.now()}_${Math.random().toString(36).slice(2,7)}`; }

function fmtDate(str){
  const [y,m,d]=str.split('-').map(Number);
  const date=new Date(y,m-1,d);
  return `${WDAYS[date.getDay()]}, ${d}. ${MONTHS[m-1]} ${y}`;
}
function fmtDateS(str){
  const [,m,d]=str.split('-').map(Number);
  return `${d}. ${MONTHS[m-1]}`;
}
function fmtDateXS(str){
  const [,,d]=str.split('-').map(Number);
  return d;
}
function wdayStr(str){
  const [y,m,d]=str.split('-').map(Number);
  return WDAYS[new Date(y,m-1,d).getDay()];
}

function calcSleep(wake, sleep){
  if(!wake||!sleep) return null;
  const [wh,wm]=wake.split(':').map(Number);
  const [sh,sm]=sleep.split(':').map(Number);
  let diff=(sh*60+sm)-(wh*60+wm);
  if(diff<0) diff+=24*60; // next day
  const totalSleep=24*60-diff;
  if(totalSleep<0||totalSleep>20*60) return null;
  return (totalSleep/60).toFixed(1);
}

function getLast14(){
  const days=[]; const d=new Date();
  for(let i=13;i>=0;i--){
    const dd=new Date(d); dd.setDate(d.getDate()-i);
    days.push(`${dd.getFullYear()}-${p2(dd.getMonth()+1)}-${p2(dd.getDate())}`);
  }
  return days;
}

function buildTrendData(ids, rangeDays){
  const allDays=Object.keys(S.data||{}).sort();
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-rangeDays);
  const filtered=allDays.filter(d=>new Date(d)>=cutoff);
  return filtered.map(date=>{
    const logs=(S.data[date]?.logs||[]).filter(l=>l.type==='checkin');
    const obj={date};
    ids.forEach(id=>{
      const vals=logs.map(l=>l.symptoms?.[id]).filter(v=>v>0);
      obj[id]=vals.length ? vals.reduce((s,v)=>s+v,0)/vals.length : null;
    });
    return obj;
  }).filter(o=>ids.some(id=>o[id]!==null));
}

function hourlyAvg(id){
  const byHour={};
  allCheckinLogs().forEach(l=>{
    const h=parseInt(l.time)||0;
    if(!byHour[h]) byHour[h]=[];
    if(l.symptoms?.[id]>0) byHour[h].push(l.symptoms[id]);
  });
  return Object.entries(byHour).map(([h,vals])=>({h:+h,avg:vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:null}))
    .filter(o=>o.avg!==null).sort((a,b)=>a.h-b.h);
}

function getBestHour(id='focus'){
  const ha=hourlyAvg(id); if(!ha.length) return null;
  return ha.reduce((best,cur)=>cur.avg>best.avg?cur:best);
}

function getMedCompareDays(){
  const medDays=[], pauseDays=[], baseDays=[];
  Object.entries(S.data||{}).forEach(([date,day])=>{
    const m=day.morning||{};
    const logs=(day.logs||[]).filter(l=>l.type==='checkin');
    if(!logs.length) return;
    const avgs={};
    METRICS.forEach(({id})=>{
      const vals=logs.map(l=>l.symptoms?.[id]).filter(v=>v>0);
      avgs[id]=vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:null;
    });
    if(m.isBaseline) baseDays.push(avgs);
    else if(m.isPauseDay||!m.medication) pauseDays.push(avgs);
    else medDays.push(avgs);
  });
  const mean=(arr,id)=>{const v=arr.map(a=>a[id]).filter(v=>v!=null);return v.length?(v.reduce((s,x)=>s+x,0)/v.length).toFixed(2):null;};
  return {med:{n:medDays.length,avgs:METRICS.reduce((o,{id})=>({...o,[id]:mean(medDays,id)}),{})},
          pause:{n:pauseDays.length,avgs:METRICS.reduce((o,{id})=>({...o,[id]:mean(pauseDays,id)}),{})},
          base:{n:baseDays.length,avgs:METRICS.reduce((o,{id})=>({...o,[id]:mean(baseDays,id)}),{})}};
}

function generateInsights(){
  const ins=[]; const checks=allCheckinLogs();
  if(checks.length<5) return ['Noch nicht genug Daten für Muster. Bitte mehr Check-ins durchführen.'];
  const best=getBestHour('focus');
  if(best) ins.push(`Dein <strong>bester Fokus-Zeitpunkt</strong> ist meistens um <strong>${best.h}:00 Uhr</strong> (Ø ${best.avg.toFixed(1)}/5).`);
  const moodAvg=parseFloat(avgStat('mood')); const focAvg=parseFloat(avgStat('focus'));
  if(moodAvg&&focAvg) ins.push(`Deine durchschnittliche Stimmung liegt bei <strong>${moodAvg}/5</strong>, dein Fokus bei <strong>${focAvg}/5</strong>.`);
  // Sleep correlation
  const pairs=[];
  Object.entries(S.data||{}).forEach(([date,day])=>{
    const m=day.morning; if(!m?.wakeTime||!m?.sleepTime) return;
    const sh=calcSleep(m.wakeTime,m.sleepTime); if(!sh) return;
    const logs=(day.logs||[]).filter(l=>l.type==='checkin');
    const fvals=logs.map(l=>l.symptoms?.focus).filter(v=>v>0);
    if(!fvals.length) return;
    pairs.push([parseFloat(sh),fvals.reduce((s,v)=>s+v,0)/fvals.length]);
  });
  if(pairs.length>=7){
    const mx=pairs.reduce((s,[x])=>s+x,0)/pairs.length;
    const my=pairs.reduce((s,[,y])=>s+y,0)/pairs.length;
    const num=pairs.reduce((s,[x,y])=>s+(x-mx)*(y-my),0);
    const den=Math.sqrt(pairs.reduce((s,[x])=>s+(x-mx)**2,0)*pairs.reduce((s,[,y])=>s+(y-my)**2,0));
    const r=den>0?num/den:0;
    if(Math.abs(r)>0.2) ins.push(`Schlaf & Fokus: Korrelation <strong>r=${r.toFixed(2)}</strong> (n=${pairs.length}) – ${r>0?'mehr Schlaf → besserer Fokus':'kaum linearer Zusammenhang'}.`);
  }
  // Med pause difference
  const cmp=getMedCompareDays();
  if(cmp.med.n>=3 && cmp.pause.n>=3){
    const diff=parseFloat(cmp.med.avgs.focus)-parseFloat(cmp.pause.avgs.focus);
    if(diff>0.3) ins.push(`An Medikationstagen ist dein Fokus im Schnitt um <strong>+${diff.toFixed(1)} Punkte</strong> höher als an Pause-Tagen.`);
    else if(diff<-0.2) ins.push(`Kein klarer Fokus-Vorteil an Medikationstagen messbar (n=${cmp.med.n} vs n=${cmp.pause.n}).`);
  }
  return ins;
}

const GW=320, GH=100, GP=30;

function buildTrendGraph(ids, rangeDays){
  const data=buildTrendData(ids,rangeDays);
  if(!data.length) return `<div style="color:var(--mut);font-size:12px;padding:16px;text-align:center">Keine Daten für diesen Zeitraum</div>`;
  const colors={'focus':'#60a5fa','mood':'#4ade80','energy':'#fcd34d','unrest':'#fb923c','impulse':'#c084fc','hunger':'#f472b6'};
  const cw=Math.max(GW,data.length*28);
  let svg=`<svg width="${cw}" height="${GH+GP*2}" viewBox="0 0 ${cw} ${GH+GP*2}">`;
  // Grid lines
  for(let i=1;i<=5;i++){
    const y=GP+GH-(i/5)*GH;
    svg+=`<line x1="0" y1="${y}" x2="${cw}" y2="${y}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`;
    svg+=`<text x="2" y="${y+4}" font-size="9" fill="rgba(255,255,255,.3)">${i}</text>`;
  }
  ids.forEach(id=>{
    const col=colors[id]||'#aaa';
    const pts=data.map((o,i)=>o[id]!=null?{x:GP+(i/(data.length-1||1))*(cw-GP*2),y:GP+GH-(o[id]/5)*GH,v:o[id]}:null).filter(Boolean);
    if(pts.length<1) return;
    let path=`M${pts[0].x} ${pts[0].y}`;
    for(let i=1;i<pts.length;i++){
      const cx=(pts[i-1].x+pts[i].x)/2;
      path+=` C${cx} ${pts[i-1].y} ${cx} ${pts[i].y} ${pts[i].x} ${pts[i].y}`;
    }
    svg+=`<path d="${path}" stroke="${col}" stroke-width="2.5" fill="none" opacity="0.9"/>`;
    pts.forEach(p=>{ svg+=`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${col}" opacity="0.85"/>`; });
  });
  // X labels (every 2nd)
  data.forEach((o,i)=>{
    if(i%2!==0&&data.length>7) return;
    const x=GP+(i/(data.length-1||1))*(cw-GP*2);
    const lbl=fmtDateXS(o.date);
    svg+=`<text x="${x}" y="${GH+GP*2-4}" font-size="9" fill="rgba(255,255,255,.4)" text-anchor="middle">${lbl}</text>`;
  });
  svg+=`</svg>`;
  return svg;
}

function buildBarGraph(items, color='var(--acc)'){
  if(!items.length) return '<div style="color:var(--mut);font-size:12px;padding:12px;text-align:center">Keine Daten</div>';
  const max=Math.max(...items.map(i=>i[1]),1);
  const bw=32, gap=8, h=80, pad=16;
  const w=items.length*(bw+gap)+pad*2;
  let svg=`<svg width="${w}" height="${h+30}" viewBox="0 0 ${w} ${h+30}">`;
  items.forEach(([label,val],i)=>{
    const bh=(val/max)*h; const x=pad+i*(bw+gap); const y=h-bh;
    svg+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="5" fill="${color}" opacity="0.8"/>`;
    svg+=`<text x="${x+bw/2}" y="${h+14}" font-size="9" fill="rgba(255,255,255,.5)" text-anchor="middle">${label.slice(0,6)}</text>`;
    svg+=`<text x="${x+bw/2}" y="${y-4}" font-size="9" fill="rgba(255,255,255,.7)" text-anchor="middle">${val}</text>`;
  });
  svg+=`</svg>`;
  return svg;
}

function buildLineGraph(series, h=80, colorFn=()=>GW){
  if(!series.length) return '';
  const min=Math.min(...series.map(d=>d.val));
  const max=Math.max(...series.map(d=>d.val));
  const rng=max-min||1; const cw=Math.max(GW,series.length*28);
  let svg=`<svg width="${cw}" height="${h+40}" viewBox="0 0 ${cw} ${h+40}">`;
  const pts=series.map((d,i)=>({x:20+(i/(series.length-1||1))*(cw-40),y:10+(1-(d.val-min)/rng)*(h-10)}));
  let path=`M${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length;i++){
    const cx=(pts[i-1].x+pts[i].x)/2;
    path+=` C${cx} ${pts[i-1].y} ${cx} ${pts[i].y} ${pts[i].x} ${pts[i].y}`;
  }
  svg+=`<path d="${path}" stroke="var(--acc)" stroke-width="2.5" fill="none"/>`;
  pts.forEach((p,i)=>{
    svg+=`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--acc)"/>`;
    if(i%2===0) svg+=`<text x="${p.x}" y="${h+32}" font-size="9" fill="rgba(255,255,255,.4)" text-anchor="middle">${fmtDateXS(series[i].date)}</text>`;
    svg+=`<text x="${p.x}" y="${p.y-7}" font-size="9" fill="rgba(255,255,255,.7)" text-anchor="middle">${series[i].val}</text>`;
  });
  svg+=`</svg>`;
  return svg;
}

    if(interactive && isActive){ fill='rgba(255,112,112,.4)'; stroke='var(--red)'; }

    svg+=`<circle cx="${loc.cx}" cy="${loc.cy}" r="${loc.r}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"${interactive?` data-loc="${loc.id}" style="cursor:pointer"`:''} title="${loc.label}${c?' ('+c+')':''}"/>`;
  });
  svg+=`</svg>`;
  return svg;
}

function buildReportData(){
  const allDays=Object.keys(S.data||{}).sort();
  const checks=allCheckinLogs();
  const st=loadSettings();
  // Weight
  const wDays=allDays.filter(d=>S.data[d]?.morning?.weight);
  const wFirst=wDays.length?+S.data[wDays[0]].morning.weight:null;
  const wLast=wDays.length?+S.data[wDays[wDays.length-1]].morning.weight:null;
  // BP
  const bpDays=allDays.filter(d=>S.data[d]?.morning?.bp?.sys);
  const avgSys=bpDays.length?Math.round(bpDays.reduce((s,d)=>s+(+S.data[d].morning.bp.sys),0)/bpDays.length):null;
  const avgDia=bpDays.length?Math.round(bpDays.reduce((s,d)=>s+(+S.data[d].morning.bp.dia),0)/bpDays.length):null;
  const avgPuls=bpDays.length?Math.round(bpDays.reduce((s,d)=>s+((+S.data[d].morning.bp.puls)||0),0)/bpDays.length):null;
  // Sleep
  const sleepPairs=allDays.filter(d=>S.data[d]?.morning?.wakeTime&&S.data[d]?.morning?.sleepTime)
    .map(d=>calcSleep(S.data[d].morning.wakeTime,S.data[d].morning.sleepTime)).filter(Boolean).map(Number);
  const avgSleep=sleepPairs.length?(sleepPairs.reduce((s,v)=>s+v,0)/sleepPairs.length).toFixed(1):null;
  // Med days
  const medDays=allDays.filter(d=>S.data[d]?.morning?.medication&&!S.data[d]?.morning?.isPauseDay);
  const pauseDaysList=allDays.filter(d=>S.data[d]?.morning?.isPauseDay);
  // RDS events
  let rdsCount=0;
  Object.values(S.data||{}).forEach(day=>{
    (day.logs||[]).forEach(l=>{ if(l.type==='quick'&&l.rds?.trigger) rdsCount++; });
  });
  // Ibuprofen total
  let ibuTotal=0;
  Object.values(S.data||{}).forEach(day=>{
    (day.logs||[]).forEach(l=>{ if(l.ibuprofenMg) ibuTotal+=l.ibuprofenMg; });
  });
  return {
    dateFrom:allDays[0]||'–', dateTo:allDays[allDays.length-1]||'–',
    totalDays:allDays.length, totalCheckins:checks.length,
    metricAvgs:METRICS.reduce((o,{id})=>({...o,[id]:avgStat(id)}),{}),
    wFirst,wLast,avgSys,avgDia,avgPuls,avgSleep,
    medDays:medDays.length, pauseDays:pauseDaysList.length,
    rdsCount,ibuTotal,
    settings:st,
    insights:generateInsights(),
    medCompare:getMedCompareDays(),
    bestHour:getBestHour('focus'),
  };
}

function buildReport(rd){
  const s=rd.settings||{};
  const today=new Date().toLocaleDateString('de-DE');
  let html=`<h1>FocusLog – Klinischer Bericht</h1>`;
  html+=`<p><strong>Erstellt:</strong> ${today}</p>`;
  if(s.patientName) html+=`<p><strong>Patient:</strong> ${s.patientName}</p>`;
  if(s.doctorName) html+=`<p><strong>Behandler:</strong> ${s.doctorName}</p>`;
  html+=`<h2>Zeitraum & Datenübersicht</h2>`;
  html+=`<table><tr><th>Zeitraum</th><td>${rd.dateFrom} bis ${rd.dateTo}</td></tr>`;
  html+=`<tr><th>Auswertbare Tage</th><td>${rd.totalDays}</td></tr>`;
  html+=`<tr><th>Check-ins gesamt</th><td>${rd.totalCheckins}</td></tr>`;
  html+=`<tr><th>Medikationstage</th><td>${rd.medDays}</td></tr>`;
  html+=`<tr><th>Pause-Tage</th><td>${rd.pauseDays}</td></tr></table>`;
  html+=`<h2>Durchschnittswerte (1–5)</h2><table><tr><th>Metrik</th><th>Ø Wert</th></tr>`;
  METRICS.forEach(({id,label})=>{
    const v=rd.metricAvgs[id]; if(!v) return;
    html+=`<tr><td>${label}</td><td>${v}</td></tr>`;
  });
  html+=`</table>`;
  if(rd.medCompare.med.n>=3||rd.medCompare.pause.n>=3){
    html+=`<h2>Medikations-Vergleich</h2><table><tr><th>Metrik</th><th>Mit Medikation (n=${rd.medCompare.med.n})</th><th>Ohne / Pause (n=${rd.medCompare.pause.n})</th>`;
    if(rd.medCompare.base.n) html+=`<th>Baseline (n=${rd.medCompare.base.n})</th>`;
    html+=`</tr>`;
    METRICS.forEach(({id,label})=>{
      const m=rd.medCompare.med.avgs[id], p=rd.medCompare.pause.avgs[id];
      if(!m&&!p) return;
      const diff=(m&&p)?(parseFloat(m)-parseFloat(p)).toFixed(2):null;
      html+=`<tr><td>${label}</td><td>${m||'–'}</td><td>${p||'–'}</td>`;
      if(rd.medCompare.base.n) html+=`<td>${rd.medCompare.base.avgs[id]||'–'}</td>`;
      if(diff) html+=`<td style="color:${diff>0?'green':'red'}">${diff>0?'+':''}${diff}</td>`;
      html+=`</tr>`;
    });
    html+=`</table>`;
  }
  if(rd.avgSleep) html+=`<h2>Schlaf & Körper</h2><table><tr><th>Ø Schlafdauer</th><td>${rd.avgSleep}h</td></tr>`;
  if(rd.wFirst&&rd.wLast){ html+=`<tr><th>Gewicht Beginn</th><td>${rd.wFirst} kg</td></tr><tr><th>Gewicht Aktuell</th><td>${rd.wLast} kg</td></tr>`; }
  if(rd.avgSys) html+=`<tr><th>Ø Blutdruck</th><td>${rd.avgSys}/${rd.avgDia} mmHg · Puls ${rd.avgPuls}</td></tr>`;
  if(rd.avgSleep) html+=`</table>`;
  if(rd.rdsCount>0) html+=`<h2>RDS-Ereignisse</h2><p>Erfasste RDS-Momente im Zeitraum: <strong>${rd.rdsCount}</strong></p>`;
  if(rd.bestHour) html+=`<h2>Zeitlicher Fokus-Peak</h2><p>Beste Fokus-Stunde: <strong>${rd.bestHour.h}:00 Uhr</strong> (Ø ${rd.bestHour.avg.toFixed(1)}/5)</p>`;
  html+=`<h2>Automatische Analyse</h2><ul>${rd.insights.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  html+=`<hr><p style="font-size:10px;color:#999">Erstellt mit FocusLog – kein Ersatz für ärztliche Beratung.</p>`;
  return html;
}

function el(tag, props, ...children){
  const e=document.createElement(tag);
  if(props) Object.entries(props).forEach(([k,v])=>{
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on'))  e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c=>{ if(c==null) return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}

function renderMorningCard(date){
  const m=getMorning(date);
  const isToday=date===todayStr();
  if(!m){
    const card=el('div',{class:'mc-empty'});
    card.appendChild(el('div',{class:'mc-et'},isToday?'☀️ Noch kein Tagesstart erfasst':'Kein Tagesformular für diesen Tag'));
    if(isToday||true){
      const btn=el('button',{class:'btn btn-p btn-sm',onClick:()=>set({showMorning:true,mDraft:{...(getMorning(date)||{})}})},isToday?'Morgen-Routine starten':'Eintragen');
      card.appendChild(btn);
    }
    return card;
  }
  const card=el('div',{class:'mc-filled'});
  // Header row
  const row=el('div',{class:'mc-row'});
  const left=el('div');
  if(m.isPauseDay){
    left.appendChild(el('div',{class:'mc-main'},'⏸ Medikations-Pause'));
  } else if(m.medication){
    const treat=getTreatmentStatus();
    const badge=m.isBaseline?' 🔬':'';
    left.appendChild(el('div',{class:'mc-main'},`💊 ${m.medication} ${m.dosage||''}mg${m.takenAt?' · '+m.takenAt:''}${badge}`));
  } else {
    left.appendChild(el('div',{class:'mc-main',style:'color:var(--mut)'},'Kein Medikament'));
  }
  if(m.wakeTime&&m.sleepTime){
    const sh=calcSleep(m.wakeTime,m.sleepTime);
    const qe=m.sleepQuality==='good'?'😴 ':(m.sleepQuality==='bad'?'🥱 ':'😴 ');
    left.appendChild(el('div',{class:'small muted',style:'margin-top:4px'},`${qe}${sh||'?'}h Schlaf · wach ${m.wakeTime}`));
  }
  row.appendChild(left);
  const editBtn=el('button',{class:'btn btn-s btn-sm',onClick:()=>set({showMorning:true,mDraft:{...m}})}, '✏️ Bearbeiten');
  row.appendChild(editBtn);
  card.appendChild(row);
  // Pills
  const pills=el('div',{class:'mc-pills'});
  if(m.context?.length) m.context.forEach(id=>{ const t=CTX_TAGS.find(x=>x.id===id); if(t) pills.appendChild(el('span',{class:'mc-pill'},t.icon+' '+t.label)); });
  if(m.stressTags?.length) m.stressTags.forEach(id=>{ const t=STRESS_TAGS.find(x=>x.id===id); if(t) pills.appendChild(el('span',{class:`mc-pill ${id==='stress'?'red':id==='routine'?'grn':''}` },t.icon+' '+t.label)); });
  if(m.isSick) pills.appendChild(el('span',{class:'mc-pill red'},'🤒 Krank'));
  if(m.weight) pills.appendChild(el('span',{class:'mc-pill'},`⚖️ ${m.weight} kg`));
  if(pills.children.length) card.appendChild(pills);
  return card;
}

function renderLogEntry(log, date){

  const sub=el('div',{class:'le-sub'});
  if(log.type==='quick'){
    const emo=EMOTIONS.find(e=>e.id===log.emotion);
    const isRds=!!log.rds?.trigger; const isME=!!log.medEffect;
    if(isRds){
      ico.textContent='🛑';
      const trig=RDS_TRIGGERS.find(t=>t.id===log.rds.trigger);
      main.innerHTML=`RDS · <span style="color:var(--red)">${trig?.label||'RDS-Moment'}</span>`;
    } else if(isME){
      ico.textContent='💊';
      const eff=MED_EFFECTS.find(e=>e.id===log.medEffect);
      main.innerHTML=`Medikation: ${eff?.emoji||''} <span style="color:var(--acc)">${eff?.label||log.medEffect}</span>`;
    } else {
      ico.textContent=emo?.emoji||'💭';
      const vcls=emo?.v>0?'pos':emo?.v<0?'neg':'neu';
      main.appendChild(document.createTextNode((emo?.emoji||'')+(emo?.label||log.emotion||'')));
      if(log.intensity){
        const dots=el('span',{class:'idots'});
        for(let i=1;i<=5;i++) dots.appendChild(el('span',{class:`idot ${i<=log.intensity?vcls:''}`}));
        main.appendChild(dots);
      }
    }
    if(log.note) sub.textContent=`"${log.note}"`;
    if(log.rds?.duration){ const dur=RDS_DURS.find(d=>d.id===log.rds.duration); if(dur) sub.textContent=`Dauer: ${dur.label}`; }
  } else if(log.type==='checkin'){
    ico.textContent='📊';
    main.textContent='Check-in';
    const s=log.symptoms||{};
    const parts=['focus','mood','energy'].filter(id=>s[id]).map(id=>{
      const m=METRICS.find(x=>x.id===id);
      return `${m.icon}${s[id]}`;
    });
    if(parts.length) sub.textContent=parts.join(' · ');
    if(log.events?.length) { const ev=log.events.map(e=>e.label).join(', '); sub.textContent+=(sub.textContent?' | ':'')+ev; }
    if(log.medEffect){ const eff=MED_EFFECTS.find(e=>e.id===log.medEffect); if(eff) sub.textContent+=' · '+eff.emoji; }
  }
  body.appendChild(main);
  if(sub.textContent) body.appendChild(sub);

    if(log.type==='checkin'&&log.symptoms){
      const s=log.symptoms;
      const chips=el('div',{style:'display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px'});
      METRICS.forEach(({id,icon,label})=>{
        if(!s[id]) return;
        const v=s[id];
        chips.appendChild(el('span',{class:`metric-chip ${rclass(v)}`},`${icon} ${label} ${v}`));
      });
      det.appendChild(chips);
    }
    if(log.healthFlags?.length){
      const hf=log.healthFlags.map(id=>HEALTH_FLAGS.find(x=>x.id===id)).filter(Boolean).map(f=>f.emoji+f.label).join(' · ');
      det.appendChild(el('div',null,hf));
    }
    if(log.ibuprofenMg) det.appendChild(el('div',null,`💊 Ibuprofen ${log.ibuprofenMg}mg`));
    if(log.painLocations?.length) det.appendChild(el('div',null,`🦵 Schmerz: ${log.painLocations.join(', ')}`));

  }
  entry.appendChild(ico);

  return entry;
}
