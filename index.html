<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FocusLog">
<title>FocusLog</title>
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%230a0e1a'/><path d='M40 90h25c5 0 8-5 10-15l10-35c3-10 8-10 11 0l15 80c2 10 7 10 10 0l10-45c2-10 5-15 10-15h40' stroke='%2360a5fa' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='106' cy='75' r='6' fill='%234ade80'/></svg>">
<style>
:root {
  --bg:#0a0e1a; --surface:#12172a; --card:#161d30; --border:#253050;
  --accent:#60a5fa; --accentL:#93c5fd;
  --green:#4ade80; --red:#ff7070; --yellow:#fcd34d; --orange:#fdba74;
  --purple:#c084fc; --pink:#f472b6;
  --text:#f4f7ff; --muted:#94a8c8; --dim:#1e2840;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  min-height:100vh;max-width:430px;margin:0 auto;padding-bottom:calc(80px + env(safe-area-inset-bottom));font-size:16px;}
.topbar{padding:52px 20px 12px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--bg) 70%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
.topbar-logo{display:flex;align-items:center;gap:10px;}
.topbar h1{font-size:28px;font-weight:700;}
.sub{font-size:13px;color:var(--muted);margin-top:3px;}
.section{padding:0 16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;overflow:hidden;}
.tagesverlauf-card{background:linear-gradient(165deg,rgba(96,165,250,.14),var(--card) 55%);border:1px solid rgba(96,165,250,.35);box-shadow:0 0 0 1px rgba(96,165,250,.06) inset;}
.tagesverlauf-label{color:var(--accentL);font-size:12px;font-weight:700;letter-spacing:.04em;}
.card-label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px;margin-top:0;}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;overflow:hidden;}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;overflow:hidden;}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;overflow:hidden;}
@media(max-width:320px){.row4{grid-template-columns:repeat(2,minmax(0,1fr));}.row3{grid-template-columns:repeat(2,minmax(0,1fr));}}
.btn{width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;}
.btn.primary{background:var(--accent);}
.btn.green{background:var(--green);color:#0a0e1a;}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:13px;margin-top:8px;}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:10px;width:auto;}
.btn.sm.active{background:rgba(96,165,250,.2);border:1px solid var(--accent);color:var(--accentL);}
.btn.sm.ghost-sm{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn:disabled{opacity:.4;cursor:default;}
input,textarea,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:12px;padding:13px 15px;color:var(--text);font-size:16px;font-family:inherit;outline:none;
  box-sizing:border-box;min-width:0;-webkit-appearance:none;appearance:none;}
select{background:#161d30;}
textarea{min-height:70px;resize:vertical;line-height:1.6;}
input[type=time],input[type=date]{padding:10px 8px;font-size:14px;max-width:100%;overflow:hidden;}
.scale-row{display:flex;gap:6px;}
.scale-btn{flex:1;padding:12px 0;border-radius:10px;cursor:pointer;font-size:17px;font-weight:700;
  border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);font-family:inherit;}
.date-strip-month{font-size:13px;font-weight:700;color:var(--accentL);letter-spacing:.02em;margin:0 0 7px 2px;display:flex;align-items:center;gap:6px;}
.date-strip-month::before{content:"📅";font-size:12px;}
.date-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.date-strip::-webkit-scrollbar{display:none;}
.date-pill{display:flex;flex-direction:column;align-items:center;padding:8px 12px;border-radius:12px;
  cursor:pointer;border:1.5px solid var(--border);background:transparent;min-width:52px;font-family:inherit;}
.date-pill.active{background:rgba(96,165,250,.18);border-color:var(--accent);}
.date-pill.has-data{border-color:var(--green);}
.date-pill-dow{font-size:11px;color:var(--muted);}
.date-pill-day{font-size:18px;font-weight:700;}
.date-pill-dot{width:5px;height:5px;border-radius:50%;background:var(--green);margin-top:2px;}
.med-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;
  padding:10px 16px;cursor:pointer;color:var(--muted);font-size:14px;font-family:inherit;}
.med-btn.has-med{background:rgba(96,165,250,.15);border-color:var(--accent);color:var(--accentL);}
.timeline-scroll{overflow-x:auto;padding-bottom:4px;}
.timeline-row{display:flex;gap:6px;min-width:max-content;padding-bottom:4px;}
.hour-dot{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:36px;}
.hour-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;border:1.5px dashed var(--dim);background:transparent;color:var(--muted);position:relative;}
.hour-label{font-size:9px;color:var(--muted);}
.med-badge{position:absolute;top:-5px;right:-4px;font-size:10px;}
.entry-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.entry-row:last-child{border-bottom:none;}
.entry-time{font-size:14px;color:var(--muted);min-width:40px;padding-top:2px;}
.entry-tags{display:flex;flex-wrap:wrap;gap:4px;flex:1;}
.etag{font-size:12px;border-radius:6px;padding:3px 8px;}
.entry-note{font-size:13px;color:var(--muted);margin-top:3px;}
.event-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;
  font-size:13px;cursor:pointer;border:1.5px solid transparent;font-family:inherit;background:rgba(255,255,255,.04);
  border-color:var(--border);color:var(--muted);}
.event-chip.pos{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.4);color:var(--green);}
.event-chip.neg{background:rgba(255,112,112,.1);border-color:rgba(255,112,112,.4);color:var(--red);}
.event-chip.caff{background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.4);color:var(--accentL);}
.event-chip.food{background:rgba(253,186,116,.1);border-color:rgba(253,186,116,.4);color:var(--orange);}
.event-chip.med{background:rgba(192,132,252,.1);border-color:rgba(192,132,252,.4);color:var(--purple);}
.event-chip.health{background:rgba(148,168,200,.1);border-color:rgba(148,168,200,.3);color:var(--muted);}
.event-chip.ctx{background:rgba(96,165,250,.08);border-color:rgba(96,165,250,.3);color:var(--accentL);}
.chip-del{cursor:pointer;opacity:.6;margin-left:3px;font-size:15px;}
.chips-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.health-checks{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.hcheck{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  cursor:pointer;border:1.5px solid var(--border);background:rgba(255,255,255,.03);}
.hcheck.on{background:rgba(148,168,200,.1);border-color:rgba(148,168,200,.4);}
.hcheck-icon{font-size:18px;min-width:24px;text-align:center;}
.hcheck-label{font-size:14px;color:var(--muted);flex:1;}
.hcheck.on .hcheck-label{color:var(--text);}
.hcheck-box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.hcheck.on .hcheck-box{background:rgba(148,168,200,.3);border-color:var(--muted);}
.preset-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.preset-btn{padding:7px 13px;border-radius:20px;cursor:pointer;font-size:13px;font-family:inherit;
  border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);}
.preset-btn.active-tag{border-color:var(--accent);background:rgba(96,165,250,.15);color:var(--accentL);}
.graph-wrap{overflow-x:auto;padding-bottom:32px;}
.graph-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);}
.legend-dot{width:10px;height:10px;border-radius:50%;}
.legend-line{width:18px;height:3px;border-radius:2px;}
.legend-line.dash{background:none!important;border-top:3px dashed currentColor;height:0;}
.bp-sub{font-size:12px;font-weight:600;margin:10px 0 2px;display:flex;align-items:center;gap:6px;}
.bp-sub.base{color:#56B4E9;}
.bp-sub.peak{color:#E69F00;}
.peak-hint{font-size:12px;color:var(--orange);line-height:1.5;background:rgba(253,186,116,.1);border:1px solid rgba(253,186,116,.3);border-radius:10px;padding:8px 10px;margin:8px 0;}
.combo-peak{margin-bottom:10px;background:rgba(192,132,252,.07);border:1px solid rgba(192,132,252,.28);border-radius:14px;padding:11px 14px;}
.trend-tip{position:fixed;z-index:400;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);box-shadow:0 8px 28px rgba(0,0,0,.55);pointer-events:none;max-width:210px;line-height:1.55;display:none;}
.trend-tip .tt-date{font-weight:700;margin-bottom:4px;color:var(--accentL);}
.trend-tip .tt-row{color:var(--muted);}
.trend-tip .tt-none{color:var(--dim);}
.stat-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
.stat-tabs::-webkit-scrollbar{display:none;}
.stat-tab{padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;
  white-space:nowrap;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:inherit;}
.stat-tab.active{background:rgba(96,165,250,.18);border-color:var(--accent);color:var(--accentL);}
.insight{border-radius:16px;padding:16px;margin-bottom:10px;border:1px solid;}
.insight.pos{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.3);}
.insight.warn{background:rgba(252,211,77,.08);border-color:rgba(252,211,77,.3);}
.insight.info{background:rgba(96,165,250,.08);border-color:rgba(96,165,250,.3);}
.insight-icon{font-size:20px;margin-bottom:5px;}
.insight-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.insight-title.pos{color:var(--green);}
.insight-title.warn{color:var(--yellow);}
.insight-title.info{color:var(--accentL);}
.insight-text{font-size:13px;color:var(--muted);line-height:1.6;}
.sbar-wrap{min-height:5px;height:5px;background:var(--dim);border-radius:4px;overflow:hidden;margin-top:4px;}
.sbar-fill{height:100%;border-radius:4px;}
.mini-stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 8px;text-align:center;}
.mini-stat-num{font-size:26px;font-weight:800;}
.mini-stat-lbl{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em;}
.best-card{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);border-radius:16px;padding:16px;margin-bottom:10px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:flex;align-items:flex-end;}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:430px;margin:0 auto;
  padding:24px 20px calc(40px + env(safe-area-inset-bottom));border:1px solid var(--border);
  max-height:90vh;overflow-y:auto;box-sizing:border-box;}
.sheet input,.sheet select,.sheet textarea{margin-bottom:2px;}
.sheet-title{font-size:20px;font-weight:700;margin-bottom:18px;}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  background:rgba(10,14,26,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);display:flex;justify-content:space-around;
  padding:10px 0 calc(28px + env(safe-area-inset-bottom));z-index:50;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;
  background:none;color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 10px;font-family:inherit;}
.nav-btn.active{color:var(--accentL);}
.nav-icon{font-size:26px;}
.empty{text-align:center;padding:60px 0;color:var(--muted);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--green);
  color:#0a0e1a;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:700;z-index:300;
  animation:fadeInOut 2s forwards;}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(-8px);}15%{opacity:1;transform:translateX(-50%) translateY(0);}75%{opacity:1;}100%{opacity:0;}}
.backup-card{background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.2);border-radius:16px;padding:16px;margin-bottom:10px;}
.backup-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.bup-btn{flex:1;min-width:80px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;
  padding:13px 8px;cursor:pointer;font-family:inherit;color:var(--text);font-size:13px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:5px;box-sizing:border-box;}
.bup-icon{font-size:24px;}
.import-area{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;
  padding:12px;color:var(--text);font-size:13px;font-family:'Courier New',monospace;outline:none;
  min-height:80px;resize:vertical;margin-top:8px;line-height:1.5;}
.report-box{font-family:'Courier New',monospace;font-size:12px;line-height:1.8;color:var(--muted);
  white-space:pre-wrap;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;}
.seg{display:flex;background:var(--dim);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px;}
.seg-btn{flex:1;padding:8px;border-radius:9px;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);background:transparent;}
.seg-btn.active{background:var(--card);color:var(--text);}
.cat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px;display:block;}
.vital-row{display:grid;gap:8px;margin-top:6px;}
.vital-field{display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden;}
.vital-field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;white-space:normal;word-break:break-word;line-height:1.3;}
.vital-field input{padding:10px 8px;font-size:14px;min-width:0;width:100%;-webkit-appearance:none;appearance:none;overflow:hidden;}
.ctx-strip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.ctx-tag{padding:6px 12px;border-radius:20px;cursor:pointer;font-size:13px;font-family:inherit;
  border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);}
.ctx-tag.on{border-color:var(--accent);background:rgba(96,165,250,.15);color:var(--accentL);}
.ctx-tag.stress-on{border-color:var(--red);background:rgba(255,112,112,.15);color:var(--red);}
.sleep-subtags{background:rgba(96,165,250,.05);border:1px solid rgba(96,165,250,.2);border-radius:12px;padding:10px 12px;margin-top:8px;}
.pain-local{margin-top:10px;padding:12px;background:rgba(255,112,112,.06);border:1px solid rgba(255,112,112,.2);border-radius:12px;}
.pain-local-title{font-size:11px;color:var(--red);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.pain-hotspot{cursor:pointer;}
.med-list-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
.med-list-item:last-child{border-bottom:none;}
.med-list-label{flex:1;font-size:14px;}
.med-del-btn{background:rgba(255,112,112,.15);border:1px solid rgba(255,112,112,.3);color:var(--red);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px;font-family:inherit;}
.baseline-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:rgba(252,211,77,.15);border:1px solid rgba(252,211,77,.4);color:var(--yellow);margin-left:6px;}
.treatment-opts{display:flex;gap:6px;flex-wrap:wrap;}
.treatment-opt{padding:8px 14px;border-radius:12px;cursor:pointer;font-size:13px;font-family:inherit;border:1.5px solid var(--border);background:transparent;color:var(--muted);}
.treatment-opt.on{border-color:var(--yellow);background:rgba(252,211,77,.12);color:var(--yellow);}
.pause-btn{width:100%;padding:14px;border-radius:14px;cursor:pointer;font-size:15px;font-weight:700;font-family:inherit;border:2px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);margin-bottom:14px;}
.pause-btn.active{border-color:var(--orange);background:rgba(253,186,116,.15);color:var(--orange);}
.therapy-toggle{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;cursor:pointer;border:1.5px solid var(--border);background:rgba(255,255,255,.03);margin-bottom:10px;}
.therapy-toggle.on{border-color:var(--green);background:rgba(74,222,128,.08);}
.toggle-track{width:44px;height:24px;border-radius:12px;background:var(--dim);position:relative;flex-shrink:0;transition:background .2s;}
.therapy-toggle.on .toggle-track{background:var(--green);}
.toggle-thumb{width:20px;height:20px;border-radius:10px;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s;}
.therapy-toggle.on .toggle-thumb{left:22px;}
.ctx-today-card{background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.18);border-radius:16px;padding:14px 16px;margin-bottom:10px;}
.ibu-select{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.ibu-btn{padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;font-family:inherit;border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);}
.ibu-btn.on{border-color:var(--red);background:rgba(255,112,112,.15);color:var(--red);}
.quick-med{margin-bottom:10px;}
.quick-med-btn{width:100%;padding:18px;border-radius:16px;border:1.5px solid var(--accent);
  background:rgba(96,165,250,.14);color:var(--accentL);font-family:inherit;font-size:17px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s;}
.quick-med-btn:active{transform:scale(.98);}
.quick-med-sub{text-align:center;font-size:11px;color:var(--muted);margin-top:6px;}
.quick-med.taken{background:rgba(74,222,128,.07);border:1px solid rgba(74,222,128,.3);border-radius:16px;padding:14px 16px;}
.quick-med.warn{background:rgba(253,186,116,.09);border-color:rgba(253,186,116,.45);}
.quick-med.ended{background:rgba(255,112,112,.08);border-color:rgba(255,112,112,.35);}
.quick-med.pause{background:rgba(253,186,116,.08);border:1px solid rgba(253,186,116,.35);border-radius:16px;padding:14px 16px;color:var(--orange);font-size:14px;font-weight:600;text-align:center;}
.quick-med-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;}
.quick-med-head .qm-check{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--green);color:#08210f;font-weight:800;font-size:13px;flex-shrink:0;}
.qm-undo{margin-left:auto;background:none;border:none;color:var(--muted);font-family:inherit;font-size:12px;cursor:pointer;text-decoration:underline;padding:4px;flex-shrink:0;}
.peak-bar{height:8px;border-radius:6px;background:var(--dim);margin-top:12px;overflow:hidden;}
.peak-fill{height:100%;border-radius:6px;transition:width .4s ease;}
.peak-fill.active{background:linear-gradient(90deg,var(--green),var(--accent));}
.peak-fill.rebound-soon{background:linear-gradient(90deg,var(--green),var(--orange));}
.peak-fill.ended{background:linear-gradient(90deg,var(--orange),var(--red));}

// Neues Datenmodell: day.medications = [{medication,dosage,takenAt,manufacturer}, …]
// Die Alt-Felder medication/dosage/takenAt/manufacturer werden als Spiegel der
// ERSTEN (frühesten) Einnahme des Tages weitergepflegt. Dadurch funktionieren alle
// bestehenden Auswertungen, Graphen und Berichte unverändert weiter (Basis = erste Einnahme).
function migrateMeds(data){
  if(!data||typeof data!=="object")return data;
  Object.keys(data).forEach(date=>{
    const day=data[date];
    if(!day||typeof day!=="object")return;
    if(!Array.isArray(day.medications)){
      if(day.medication&&!day.isPauseDay)
        day.medications=[{medication:day.medication,dosage:day.dosage||"",takenAt:day.takenAt||"",manufacturer:day.manufacturer||""}];
      else
        day.medications=[];
    }
  });
  return data;
}
function sortMeds(list){
  return [...(list||[])].sort((a,b)=>{
    const ta=a.takenAt||"99:99",tb=b.takenAt||"99:99";
    return ta<tb?-1:ta>tb?1:0;
  });
}
function normalizeMedList(day){
  if(!day)return[];
  if(Array.isArray(day.medications))return day.medications;
  if(day.medication&&!day.isPauseDay)
    return[{medication:day.medication,dosage:day.dosage||"",takenAt:day.takenAt||"",manufacturer:day.manufacturer||""}];
  return[];
}

  if(!day)return;
  if(day.isPauseDay){day.medication=null;day.dosage="";day.takenAt="";day.manufacturer="";return;}
  if(Array.isArray(day.medications)){
    const list=sortMeds(day.medications);
    if(list.length){const f=list[0];day.medication=f.medication;day.dosage=f.dosage||"";day.takenAt=f.takenAt||"";day.manufacturer=f.manufacturer||"";}
    else{day.medication=null;day.dosage="";day.takenAt="";day.manufacturer="";}
  }
}

function buildDateRange(){
  const today=todayStr();
  const keys=Object.keys(S.data||{}).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
  let startStr=keys.length?keys[0]:today;

  const min14Str=min14.toISOString().slice(0,10);
  if(startStr>min14Str)startStr=min14Str; // immer mindestens ein 14-Tage-Fenster anzeigen
  const start=new Date(startStr+"T12:00"),end=new Date(today+"T12:00");
  const out=[];let guard=0;
  for(let dt=new Date(start);dt<=end&&guard<4001;dt.setDate(dt.getDate()+1),guard++)out.push(dt.toISOString().slice(0,10));

function calcSleepDuration(schlafenAt,aufgestandenAt){
  // schlafenAt = time person went to sleep (may be after midnight, e.g. 02:00)
  // aufgestandenAt = time person woke up that morning
  // Sleep = wakeup - bedtime, but bedtime after midnight means add 24h to wakeup
  if(!schlafenAt||!aufgestandenAt)return null;
  const[sh,sm]=schlafenAt.split(":").map(Number);
  const[wh,wm]=aufgestandenAt.split(":").map(Number);
  let sleepMins=sh*60+sm;
  let wakeMins=wh*60+wm;
  // If bedtime is after midnight (0-6h), wakeup must be later that same day
  // sleepMins < 360 = before 6am => night before
  // We need: wakeup > bedtime. If not, bedtime is previous evening -> add 24h to wakeup.
  // Strategy: if sleepMins > wakeMins (e.g. 23:00 > 08:00), wakeup is next day.

  } else if(sleepMins < 360) {

function medEffectAt(kind,tH,durH){

function computeEffectForDoses(doseList){
  const doses=(doseList||[]).filter(d=>d.takenAt&&hhmmToH(d.takenAt)!=null);
  if(!doses.length)return null;
  const items=doses.map(d=>{

  const maxS=Math.max(...curve.map(p=>p.s),1e-4);

      let j=i;while(j<curve.length-1&&curve[j+1].s===curve[j].s)j++;

// Für jede Stunde, zu der historisch Koffein konsumiert wurde: Ø Fokus & Energie in den folgenden 1–3 Stunden.
function caffeineHourStats(){
  const stats={};
  Object.keys(S.data).forEach(date=>{
    const cks=Object.entries(S.data[date]?.checkins||{}).map(([h,c])=>[+h,c]).sort((a,b)=>a[0]-b[0]);
    cks.forEach(([h,c])=>{
      if(!(c.events||[]).some(e=>e.type==="caff"))return;
      const after=cks.filter(([h2])=>h2>h&&h2<=h+3);
      const fVals=after.map(([,c2])=>c2.symptoms?.focus).filter(Boolean);
      const eVals=after.map(([,c2])=>c2.symptoms?.energy).filter(Boolean);
      const uVals=after.map(([,c2])=>c2.symptoms?.unrest).filter(Boolean); // Innere Unruhe nach Koffein
      if(!fVals.length&&!eVals.length&&!uVals.length)return;
      if(!stats[h])stats[h]={fSum:0,fN:0,eSum:0,eN:0,uSum:0,uN:0};
      if(fVals.length){stats[h].fSum+=avg(fVals);stats[h].fN++;}
      if(eVals.length){stats[h].eSum+=avg(eVals);stats[h].eN++;}
      if(uVals.length){stats[h].uSum+=avg(uVals);stats[h].uN++;}
    });
  });
  return Object.entries(stats).map(([h,s])=>({
    hour:+h,
    avgFocus:s.fN?s.fSum/s.fN:null,
    avgEnergy:s.eN?s.eSum/s.eN:null,
    avgUnrest:s.uN?s.uSum/s.uN:null, // 1–5, hoch = ungünstiger Zeitpunkt
    n:Math.max(s.fN,s.eN,s.uN),
  })).sort((a,b)=>a.hour-b.hour);
}
const UNREST_HIGH_THRESHOLD=3.4; // ab hier gilt Unruhe nach Koffein als auffällig
function getBestCaffeineHours(minN=2){
  return caffeineHourStats().filter(s=>s.n>=minN&&s.avgFocus!=null).sort((a,b)=>{
    // Zeiten mit hoher innerer Unruhe werden bei gleichem Fokus nach hinten gestuft (ungünstiger Zeitpunkt)
    const au=a.avgUnrest!=null&&a.avgUnrest>=UNREST_HIGH_THRESHOLD,bu=b.avgUnrest!=null&&b.avgUnrest>=UNREST_HIGH_THRESHOLD;
    if(au!==bu)return au?1:-1;
    return b.avgFocus-a.avgFocus;
  });
}

function buildMedCompareData(mode="day"){

    if(mode==="week"){const dt=new Date(date+"T12:00");return`${med} W${Math.ceil(dt.getDate()/7)}/${dt.getMonth()+1}`;}
    if(mode==="month"){const dt=new Date(date+"T12:00");return`${med} ${dt.toLocaleDateString("de-DE",{month:"short",year:"numeric"})}`;}

}

function generateInsights(){

  {

      //    damit nur tatsächlich erfasste Kurzschlaf-Nächte zählen).

        else if(diff<-0.4)ins.push({type:"warn",icon:"💤",title:"Nap gleicht schlechte Nächte nicht aus",
          text:`Nach schlechten Nächten ist der Nachmittags-Fokus trotz Schläfchen Ø ${Math.abs(diff).toFixed(1)} Punkte niedriger (${avg(bnNap).toFixed(1)} vs. ${avg(bnNo).toFixed(1)}). Evtl. zu lange oder zu späte Naps?`});
      }
      // b) Fokus vor vs. nach dem Schläfchen am selben Tag (within-day-Vergleich)

      }

    const unrestHours=caffeineHourStats().filter(s=>s.n>=2&&s.avgUnrest!=null&&s.avgUnrest>=UNREST_HIGH_THRESHOLD).sort((a,b)=>b.avgUnrest-a.avgUnrest);
    if(unrestHours.length)ins.push({type:"warn",icon:"⚡",
      title:`Koffein um ${unrestHours[0].hour}:00 Uhr oft mit innerer Unruhe`,
      text:`Nach Koffein um ${unrestHours.map(u=>u.hour+":00").join(", ")} Uhr ist die innere Unruhe in den Folgestunden Ø ${unrestHours[0].avgUnrest.toFixed(1)}/5 – ein Hinweis, dass Koffein zu diesem Zeitpunkt nicht gut passt. Ein anderer Zeitpunkt oder weniger Koffein könnten helfen.`});
  }
  const trend=buildTrendData("focus",14).filter(t=>t.avg);
  if(trend.length>=5){
    const f3=trend.slice(0,3).reduce((a,b)=>a+b.avg,0)/3,l3=trend.slice(-3).reduce((a,b)=>a+b.avg,0)/3;
    const diff=l3-f3;
    if(Math.abs(diff)>0.3)ins.push({type:diff>0?"pos":"warn",icon:diff>0?"📈":"📊",title:diff>0?"Fokus verbessert sich":"Fokus nimmt ab",text:diff>0?`Fokus hat sich um Ø +${diff.toFixed(1)} verbessert.`:`Fokus ist um Ø ${diff.toFixed(1)} gesunken.`});
  }
  // ── BMI ──
  const sets=loadSettings();
  const wDaysSorted=Object.keys(S.data).filter(d=>S.data[d]?.gewicht).sort();
  const curW=wDaysSorted.length?+S.data[wDaysSorted[wDaysSorted.length-1]].gewicht:null;
  const heightM=sets.koerpergroesse?+sets.koerpergroesse/100:null;
  if(curW&&heightM&&heightM>1){
    const bmi=+(curW/(heightM*heightM)).toFixed(1);
    const bmiCat=bmi<18.5?"Untergewicht":bmi<25?"Normalgewicht":bmi<30?"Übergewicht":"Adipositas";
    const bmiIcon=bmi<18.5?"⚠️":bmi<25?"✅":bmi<30?"⚠️":"🔴";
    ins.push({type:bmi>=18.5&&bmi<25?"pos":"warn",icon:"⚖️",title:`BMI: ${bmi} – ${bmiCat}`,
      text:bmi>=18.5&&bmi<25?`Aus ${curW} kg / ${sets.koerpergroesse} cm. Normalgewicht unterstützt gleichmäßige Medikamentenwirkung.`:
        bmi<18.5?`Aus ${curW} kg / ${sets.koerpergroesse} cm. Stimulanzien können Appetit hemmen – bitte auf ausreichende Ernährung achten.`:
        `Aus ${curW} kg / ${sets.koerpergroesse} cm. Erhöhter BMI kann ADHS-Symptome und Medikamentenwirkung beeinflussen.`});
    if(wDaysSorted.length>=2){
      const firstW=+S.data[wDaysSorted[0]].gewicht;
      const wdiff=+(curW-firstW).toFixed(1);
      if(Math.abs(wdiff)>=1.5)ins.push({type:wdiff<0?"warn":"pos",icon:"⚖️",title:`Gewicht: ${wdiff>0?"+":""}${wdiff} kg seit Beginn`,
        text:wdiff<0?`Gewichtsverlust von ${Math.abs(wdiff)} kg – häufige Nebenwirkung von Stimulanzien (Appetithemmung). Auf ausreichende Kalorienaufnahme achten.`:
          `Gewichtszunahme von ${wdiff} kg im Verlauf.`});
    }
  }
  // ── Blutdruck & Puls ──
  const allDaysSorted=Object.keys(S.data).sort();
  const bpMeasDays=allDaysSorted.filter(d=>S.data[d]?.sys&&S.data[d]?.dia);
  if(bpMeasDays.length>=3){
    const avgS=Math.round(bpMeasDays.reduce((s,d)=>s+(+S.data[d].sys),0)/bpMeasDays.length);
    const avgD=Math.round(bpMeasDays.reduce((s,d)=>s+(+S.data[d].dia),0)/bpMeasDays.length);
    const bpGrade=avgS>=160||avgD>=100?"Hypertonie Grad 2":avgS>=140||avgD>=90?"Hypertonie Grad 1":avgS>=130||avgD>=85?"Hochnormal":"Normal";
    const bpWarn=avgS>=130||avgD>=85;
    ins.push({type:bpWarn?"warn":"pos",icon:"❤️",title:`Blutdruck Ø: ${avgS}/${avgD} mmHg – ${bpGrade}`,
      text:bpWarn?`Ø aus ${bpMeasDays.length} Messungen. Bei dauerhaft erhöhten Werten bitte mit Arzt besprechen – Stimulanzien können Blutdruck leicht erhöhen.`:
        `Ø aus ${bpMeasDays.length} Messungen. Im Normalbereich.`});
    const medBpD=bpMeasDays.filter(d=>S.data[d]?.medication&&!S.data[d]?.isPauseDay);
    const pauseBpD=bpMeasDays.filter(d=>S.data[d]?.isPauseDay);
    if(medBpD.length>=3&&pauseBpD.length>=2){
      const mS=Math.round(medBpD.reduce((s,d)=>s+(+S.data[d].sys),0)/medBpD.length);
      const pS=Math.round(pauseBpD.reduce((s,d)=>s+(+S.data[d].sys),0)/pauseBpD.length);
      if(Math.abs(mS-pS)>=5)ins.push({type:mS>pS?"warn":"pos",icon:"💊",
        title:mS>pS?`Medikament erhöht Blutdruck um ~${mS-pS} mmHg`:`Blutdruck niedriger an Med-Tagen`,
        text:`Systolisch Ø ${mS} mmHg (Med) vs. ${pS} mmHg (Pause). ${mS>pS?"Typisch für Stimulanzien – im Auge behalten.":""}`});
    }
    const stressBpD=bpMeasDays.filter(d=>S.data[d]?.dayCtx?.stress);
    const noStressBpD=bpMeasDays.filter(d=>!S.data[d]?.dayCtx?.stress);
    if(stressBpD.length>=2&&noStressBpD.length>=2){
      const sS=Math.round(stressBpD.reduce((s,d)=>s+(+S.data[d].sys),0)/stressBpD.length);
      const nS=Math.round(noStressBpD.reduce((s,d)=>s+(+S.data[d].sys),0)/noStressBpD.length);
      if(sS-nS>=5)ins.push({type:"warn",icon:"🔴",title:`Stress erhöht Blutdruck um ~${sS-nS} mmHg`,
        text:`Systolisch Ø ${sS} mmHg (Stresstage) vs. ${nS} mmHg (normale Tage).`});
    }
    const pulsMeasDays=allDaysSorted.filter(d=>S.data[d]?.puls);
    if(pulsMeasDays.length>=3){
      const medPD=pulsMeasDays.filter(d=>S.data[d]?.medication&&!S.data[d]?.isPauseDay);
      const pausePD=pulsMeasDays.filter(d=>S.data[d]?.isPauseDay);
      if(medPD.length>=2&&pausePD.length>=2){
        const mP=Math.round(medPD.reduce((s,d)=>s+(+S.data[d].puls),0)/medPD.length);
        const pP=Math.round(pausePD.reduce((s,d)=>s+(+S.data[d].puls),0)/pausePD.length);
        if(mP-pP>=5)ins.push({type:mP>90?"warn":"pos",icon:"💓",title:`Puls erhöht an Med-Tagen (+${mP-pP} bpm)`,
          text:`Ø ${mP} bpm (Med) vs. ${pP} bpm (Pause). ${mP>90?"Bei dauerhaft über 90 bpm Arzt informieren.":"Leichte Erhöhung, typisch für Stimulanzien."}`});
      }
    }
  }
  // ── Sport → Fokus Folgetag ──
  if(sportDays.length>=3){
    const sFocus=[],nsFocus=[];
    allDaysSorted.forEach((date,i)=>{
      const next=allDaysSorted[i+1];if(!next)return;
      const nf=avg(Object.values(S.data[next]?.checkins||{}).map(c=>c.symptoms?.focus).filter(Boolean));
      if(!nf)return;
      if(sportDays.includes(date))sFocus.push(nf);
      else nsFocus.push(nf);
    });
    if(sFocus.length>=3&&nsFocus.length>=3){
      const sf=avg(sFocus),nsf=avg(nsFocus),diff=sf-nsf;
      if(diff>0.3)ins.push({type:"pos",icon:"🏃",title:`Sport verbessert Fokus am Folgetag`,
        text:`Nach Sporttagen Fokus-Ø ${sf.toFixed(1)} vs. ${nsf.toFixed(1)} ohne Sport (+${diff.toFixed(1)}).`});
    }
  }
  // ── Appetithemmung durch Medikament ──
  {const mH=[],bH=[];
  allDaysSorted.forEach(d=>{
    const dd=S.data[d];const hv=Object.values(dd?.checkins||{}).map(c=>c.symptoms?.hunger).filter(Boolean);
    if(!hv.length)return;const ha=avg(hv);
    if(dd?.medication&&!dd?.isPauseDay)mH.push(ha);else if(dd?.isPauseDay||dd?.isBaseline)bH.push(ha);
  });
  if(mH.length>=3&&bH.length>=2){const diff=avg(bH)-avg(mH);if(diff>0.4)ins.push({type:"warn",icon:"🍽️",title:`Appetithemmung durch Medikament`,
    text:`Hunger Ø ${avg(mH).toFixed(1)}/5 (Med) vs. ${avg(bH).toFixed(1)}/5 (Pause). Ausreichende Ernährung stabilisiert die Medikamentenwirkung.`});}}
  // ── Gelenkschmerz → Schlafqualität ──
  {const painDays2=allDaysSorted.filter(d=>Object.values(S.data[d]?.checkins||{}).some(c=>c.healthFlags?.gelenke));
  const noPainDays2=allDaysSorted.filter(d=>!painDays2.includes(d));
  if(painDays2.length>=3&&noPainDays2.length>=3){
    const pSleep=painDays2.map(d=>getSleepDurationForDate(d,{fallback:true})).filter(Boolean);
    const npSleep=noPainDays2.map(d=>getSleepDurationForDate(d,{fallback:true})).filter(Boolean);
    if(pSleep.length>=3&&npSleep.length>=3){const diff=avg(npSleep)-avg(pSleep);if(diff>0.5)ins.push({type:"warn",icon:"🦵",title:`Gelenkschmerzen verkürzen Schlaf`,
      text:`An Schmerztagen Ø ${avg(pSleep).toFixed(1)}h Schlaf vs. ${avg(npSleep).toFixed(1)}h ohne Schmerzen.`});}}}
  // ── Ibuprofen-Häufigkeit ──
  if(allDaysSorted.length>=14){
    const ibuDays=allDaysSorted.filter(d=>Object.values(S.data[d]?.checkins||{}).some(c=>(c.ibuprofenMg||0)>0));
    if(ibuDays.length/allDaysSorted.length>0.25)ins.push({type:"warn",icon:"💊",title:`Ibuprofen an ${Math.round(ibuDays.length/allDaysSorted.length*100)}% der Tage`,
      text:`An ${ibuDays.length} von ${allDaysSorted.length} Tagen Ibuprofen. Häufiger Gebrauch kann Magenschleimhaut und Nieren belasten.`});
  }
  // ── Hersteller-Vergleich ──
  {const mfrGroups={};
  Object.keys(S.data).forEach(date=>{
    const d=S.data[date];
    if(!d?.medication||d?.isPauseDay||!d?.manufacturer)return;
    const key=d.medication+'||'+d.manufacturer;
    if(!mfrGroups[key])mfrGroups[key]={med:d.medication,mfr:d.manufacturer,focus:[],mood:[],energy:[]};
    const cks=Object.values(d.checkins||{});
    const fv=cks.map(c=>c.symptoms?.focus).filter(Boolean);
    const mv=cks.map(c=>c.symptoms?.mood).filter(Boolean);
    const ev=cks.map(c=>c.symptoms?.energy).filter(Boolean);
    if(fv.length>=2){mfrGroups[key].focus.push(avg(fv));mfrGroups[key].mood.push(avg(mv));mfrGroups[key].energy.push(avg(ev));}
  });
  // Group by medication, compare manufacturers within same med
  const byMed={};
  Object.values(mfrGroups).forEach(g=>{
    if(g.focus.length<3)return;
    if(!byMed[g.med])byMed[g.med]=[];
    byMed[g.med].push({mfr:g.mfr,f:avg(g.focus),m:avg(g.mood),e:avg(g.energy),n:g.focus.length});
  });
  Object.entries(byMed).forEach(([med,groups])=>{
    if(groups.length<2)return;
    groups.sort((a,b)=>b.f-a.f);
    const best=groups[0],worst=groups[groups.length-1];
    const diff=best.f-worst.f;
    if(diff>=0.3){
      ins.push({type:"pos",icon:"🏭",title:`${med}: ${best.mfr} wirkt besser (Fokus +${diff.toFixed(1)})`,
        text:`${best.mfr}: Ø ${best.f.toFixed(1)} Fokus (n=${best.n}) vs. ${worst.mfr}: Ø ${worst.f.toFixed(1)} (n=${worst.n}). Stimmung und Energie zeigen ${Math.abs(best.m-worst.m)>0.2?'ähnliches':'kaum'} Muster.`});
    }
  });}
  return ins;
}

// ── Kontext & Situation: Einfluss aller Tags auf die Kernmetriken (Fokus/Stimmung/Unruhe) ──
// A/B-Vergleich: Tage MIT einem Tag vs. Tage OHNE diesen Tag, alle Check-ins gepoolt.
// Nur Tags mit belastbarer Datenbasis (≥2 Tage je Gruppe, ≥3 Messwerte je Metrik).
const CTX_IMPACT_METRICS=[
  {id:"focus",icon:"🎯",label:"Fokus",inv:false},
  {id:"mood",icon:"😊",label:"Stimmung",inv:false},
  {id:"unrest",icon:"⚡",label:"Unruhe",inv:true},
];
function getContextImpact(){
  const TAGS=[...CTX_TAGS,...STRESS_TAGS];
  const dates=Object.keys(S.data);
  const out=[];
  TAGS.forEach(t=>{
    const tagged=[],untag=[];let nT=0,nU=0;
    dates.forEach(d=>{
      const day=S.data[d];if(!day)return;
      const cks=Object.values(day.checkins||{});if(!cks.length)return;
      if(day.dayCtx&&day.dayCtx[t.id]){nT++;tagged.push(...cks);}else{nU++;untag.push(...cks);}
    });
    if(nT<2||nU<2)return; // zu wenige Tage für einen sinnvollen Vergleich
    const metrics=CTX_IMPACT_METRICS.map(m=>{
      const tv=tagged.map(c=>c.symptoms?.[m.id]).filter(Boolean);
      const uv=untag.map(c=>c.symptoms?.[m.id]).filter(Boolean);
      if(tv.length<3||uv.length<3)return null;
      return{...m,delta:avg(tv)-avg(uv),tagged:avg(tv),baseline:avg(uv)};
    }).filter(Boolean);
    if(!metrics.length)return;
    out.push({id:t.id,label:t.label,nDays:nT,metrics,sortKey:Math.max(...metrics.map(m=>Math.abs(m.delta)))});
  });
  return out.sort((a,b)=>b.sortKey-a.sortKey); // stärkster Einfluss zuerst
}
// Ist eine Veränderung günstig? Bei inv-Metriken (Unruhe/Impulsivität) ist „weniger“ besser.
function ctxDeltaIsGood(m){return m.inv?m.delta<0:m.delta>0;}
function ctxDeltaColor(m){return Math.abs(m.delta)<0.15?"var(--muted)":(ctxDeltaIsGood(m)?"var(--green)":"var(--red)");}

// ── Punkt 2+3+4 (neu): NOTIZEN – Sammeln & Darstellen ─────────────────────────────────────────
// Quellen: (a) stündliche Check-in-Notizen (day.checkins[h].note), (b) Medikamenten-Notizen (day.medications[i].note).
// Alle Notizen eines Tages, chronologisch aufsteigend (für Tagesprotokoll & Archiv).
function getDayNotes(date){
  const d=S.data[date];if(!d)return[];
  const items=[];
  Object.entries(d.checkins||{}).forEach(([h,c])=>{
    if(c&&c.note&&String(c.note).trim())
      items.push({date,kind:"checkin",sort:+h,time:String(h).padStart(2,"0")+":00",label:"Stunden-Check-in",text:String(c.note).trim()});
  });
  getDayMeds(d).forEach(m=>{
    if(m&&m.note&&String(m.note).trim())
      items.push({date,kind:"med",sort:m.takenAt?(hhmmToH(m.takenAt)??98):99,time:m.takenAt||"–:–",
        label:`${m.medication||"Medikament"}${m.dosage?" "+m.dosage+" mg":""}`,text:String(m.note).trim()});
  });
  return items.sort((a,b)=>a.sort-b.sort);
}
// Alle Notizen aller Tage: Tage neueste zuerst, innerhalb eines Tages chronologisch (liest sich wie ein Tagebuch).
function collectAllNotes(){
  const out=[];
  Object.keys(S.data).sort().reverse().forEach(date=>{const items=getDayNotes(date);if(items.length)out.push({date,items});});
  return out;
}
// Vertikale Mini-Timeline für eine Notizliste (gemeinsame Optik für Tagesprotokoll & Archiv).
function noteTimelineEl(items){
  return el("div",{class:"notebook-tl"},...items.map(it=>el("div",{class:"nb-item"},
    el("div",{class:"nb-dot "+it.kind}),
    el("div",{class:"nb-time"},
      el("span",{class:"nb-hh"},it.time),
      el("span",{class:"nb-kind "+it.kind},(it.kind==="med"?"💊 ":"🕐 ")+it.label)),
    el("div",{class:"nb-text"},it.text)
  )));
}
// Punkt 4: kompaktes „Tagesprotokoll / Notizbuch“ für einen ausgewählten Tag.
function buildDayNotebookCard(date){
  const items=getDayNotes(date);
  if(!items.length)return null;
  return el("div",{class:"card"},
    el("span",{class:"card-label"},`📓 Tagesprotokoll · ${items.length} Notiz${items.length>1?"en":""}`),
    noteTimelineEl(items)
  );
}
// ── Punkt 5 (neu): Vollständiger Rohdaten-Zugriff je Tag ─────────────────────────────────────
// Zeigt ALLE erfassten Rohdaten des Tages: Status, sämtliche Medikamenten-Einnahmen (inkl. Notizen),
// Schlafzeiten & -qualität, Vitals/Blutdruck (Basis + Peak), Kontext-Tags, Health-Flags, Ibuprofen,
// Schmerzorte und Check-in-Übersicht.
function buildDayRawDataCard(date){
  const day=S.data[date];
  const card=el("div",{class:"card"});
  card.appendChild(el("span",{class:"card-label"},"🗂 Rohdaten – "+fmtDateS(date)));
  if(!day){card.appendChild(el("div",{style:{color:"var(--muted)",fontSize:"13px"}},"Für diesen Tag wurden noch keine Daten erfasst."));return card;}
  const grp=t=>el("div",{class:"raw-group-title"},t);
  const row=(lbl,val,color)=>el("div",{class:"raw-row"},
    el("span",{class:"raw-lbl"},lbl),
    el("span",{class:"raw-val",style:color?{color}:{}},(val==null||val==="")?"–":String(val)));
  // Status-Chips
  const status=[];
  if(day.isPauseDay)status.push(["⏸ Medikations-Pause","var(--orange)"]);
  if(day.isBaseline)status.push(["⚡ Baseline","var(--yellow)"]);
  if(day.isSick)status.push(["🤒 Krank","var(--red)"]);
  if(status.length)card.appendChild(el("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"6px"}},
    ...status.map(([t,c])=>el("span",{class:"event-chip",style:{borderColor:c,color:c,cursor:"default"}},t))));
  // 💊 Medikamente – vollständige Einnahmeliste inkl. Notizen
  card.appendChild(grp("💊 Medikamenten-Einnahmen"));
  const meds=getDayMeds(day);
  if(!meds.length)card.appendChild(row("Einnahmen",day.isPauseDay?"Pause-Tag":"keine"));
  else{
    meds.forEach(m=>{
      card.appendChild(row(m.takenAt||"–:–",`${m.medication}${m.dosage?" · "+m.dosage+" mg":""}${m.manufacturer?" · "+m.manufacturer:""}`));
      if(m.note&&String(m.note).trim())card.appendChild(el("div",{class:"raw-note"},"📝 "+m.note));
    });
    const sum=dayDoseSummary(day);
    if(sum.count>1&&sum.totalMg>0)card.appendChild(row("Σ Tagesdosis",sum.totalMg+" mg","var(--accentL)"));
  }
  // 😴 Schlaf
  card.appendChild(grp("😴 Schlaf"));
  card.appendChild(row("Aufgestanden",day.aufgestandenAt));
  card.appendChild(row("Schlafen gegangen",day.schlafenAt));
  const durH=getSleepDurationForDate(date); // ehrlich, ohne 8h-Fallback
  card.appendChild(row("Schlafdauer (Vornacht)",durH!=null?durH.toFixed(1)+" h":null));
  const wakeH=calcWakeDuration(day.aufgestandenAt,day.schlafenAt);
  if(wakeH)card.appendChild(row("Wachzeit",wakeH.toFixed(1)+" h"));
  if(hasDaySleepQuality(date)){
    const bad=getDaySleepBad(date);
    card.appendChild(row("Schlafqualität",bad?"Schlecht":"Gut",bad?"var(--red)":"var(--green)"));
  }
  const slT=getDaySleepTags(date);const slK=Object.keys(slT).filter(k=>slT[k]);
  if(slK.length)card.appendChild(row("Störfaktoren",slK.map(id=>SLEEP_TAGS.find(t=>t.id===id)?.label||id).join(", ")));
  // ❤️ Vitalwerte – Basis UND Wirkungshöhepunkt
  card.appendChild(grp("❤️ Vitalwerte"));
  card.appendChild(row("Gewicht",day.gewicht?day.gewicht+" kg"+(day.gewichtTime?" · "+day.gewichtTime:""):null));
  card.appendChild(row("RR morgens (Basis)",(day.sys||day.dia||day.puls)?`${day.sys||"–"}/${day.dia||"–"} mmHg${day.puls?" · "+day.puls+" bpm":""}${day.bpTime?" · "+day.bpTime:""}`:null));
  card.appendChild(row("RR Wirkungshöhepunkt",(day.sysPeak||day.diaPeak||day.pulsPeak)?`${day.sysPeak||"–"}/${day.diaPeak||"–"} mmHg${day.pulsPeak?" · "+day.pulsPeak+" bpm":""}${day.bpTimePeak?" · "+day.bpTimePeak:""}`:null));
  // 🗂 Kontext & Situation – ALLE gesetzten Tages-Tags
  card.appendChild(grp("🗂 Kontext & Situation"));
  const ctx=day.dayCtx||{};const known=[...CTX_TAGS,...STRESS_TAGS];
  const activeCtx=Object.keys(ctx).filter(k=>ctx[k]).map(k=>known.find(t=>t.id===k)?.label||k);
  if(activeCtx.length)card.appendChild(el("div",{class:"chips-wrap",style:{marginTop:"2px"}},
    ...activeCtx.map(l=>el("span",{class:"event-chip ctx",style:{cursor:"default"}},l))));
  else card.appendChild(row("Tags","keine"));
  // 🕐 Stunden-Check-ins: Übersicht + alle Flags/Checkboxen mit Stundenangabe
  card.appendChild(grp("🕐 Stunden-Check-ins"));
  const cks=Object.entries(day.checkins||{}).sort((a,b)=>+a[0]-+b[0]);
  card.appendChild(row("Erfasst",cks.length?`${cks.length}× (${cks.map(([h])=>h+"h").join(", ")})`:"keine"));
  HEALTH_FLAGS.forEach(f=>{
    const hrs=cks.filter(([,c])=>c.healthFlags?.[f.id]).map(([h])=>h+"h");
    if(hrs.length)card.appendChild(row(f.icon+" "+f.label,hrs.join(", ")));
  });
  let ibu=0;const ibuH=[];
  cks.forEach(([h,c])=>{if(c.ibuprofenMg){ibu+=c.ibuprofenMg;ibuH.push(`${h}h: ${c.ibuprofenMg} mg`);}});
  if(ibu)card.appendChild(row("💊 Ibuprofen",`Σ ${ibu} mg (${ibuH.join(", ")})`));
  const painSet=new Set();cks.forEach(([,c])=>(c.painLocations||[]).forEach(p=>painSet.add(p)));
  if(painSet.size)card.appendChild(row("📍 Schmerzorte",[...painSet].map(id=>PAIN_LOCATIONS_SVG.find(l=>l.id===id)?.label||id).join(", ")));
  const evs=cks.flatMap(([,c])=>c.events||[]);
  if(evs.length)card.appendChild(row("Ereignisse",["pos","neg","caff","food"].map(t=>{
    const n=evs.filter(e=>e.type===t).length;
    return n?`${n}× ${t==="pos"?"✅":t==="neg"?"⚠️":t==="caff"?"☕":"🍽️"}`:null;
  }).filter(Boolean).join(" · ")));
  return card;
}

// ── SVG GRAPHS ──
// Punkt 2: kompakte Sparkline der überlagerten Tages-Wirkung (Superposition) mit Peak-Markierung.
function buildComboSparkline(de){
  const W=330,H=80,PAD={t:20,r:8,b:16,l:8};
  const gW=W-PAD.l-PAD.r,gH=H-PAD.t-PAD.b;
  const t0=de.firstT,t1=Math.max(de.winEnd,de.peakT,t0+1),span=(t1-t0)||1;
  const X=t=>PAD.l+((t-t0)/span)*gW;
  const Y=s=>PAD.t+gH-Math.max(0,Math.min(1,s/de.maxS))*gH;
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;overflow:visible;">`;
  const seg=de.curve.filter(p=>p.t>=t0-1e-6&&p.t<=t1+1e-6);
  if(seg.length>1){
    let area=`M${X(seg[0].t).toFixed(1)},${(PAD.t+gH).toFixed(1)}`;
    seg.forEach(p=>{area+=` L${X(p.t).toFixed(1)},${Y(p.s).toFixed(1)}`;});
    area+=` L${X(seg[seg.length-1].t).toFixed(1)},${(PAD.t+gH).toFixed(1)} Z`;
    svg+=`<path d="${area}" fill="#c084fc" opacity="0.15"/>`;
    let ln=`M${X(seg[0].t).toFixed(1)},${Y(seg[0].s).toFixed(1)}`;
    for(let k=1;k<seg.length;k++)ln+=` L${X(seg[k].t).toFixed(1)},${Y(seg[k].s).toFixed(1)}`;
    svg+=`<path d="${ln}" fill="none" stroke="#c084fc" stroke-width="2" stroke-linejoin="round"/>`;
  }
  de.items.forEach(i=>{const x=X(i.t0);svg+=`<line x1="${x.toFixed(1)}" y1="${(PAD.t+gH).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(PAD.t+gH+4).toFixed(1)}" stroke="#c084fc" stroke-width="1.5"/><text x="${x.toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="7" fill="#9a7fd0">💊${i.takenAt}</text>`;});
  // Alle lokalen Wirk-Maxima (Scheitelpunkte) mit Uhrzeit + normiertem Wert (0–10) markieren
  let lastLx=-999,lane=0;
  (de.maxima&&de.maxima.length?de.maxima:[{t:de.peakT,v:de.peakV}]).forEach(mx=>{
    const px=X(mx.t);
    svg+=`<line x1="${px.toFixed(1)}" y1="${PAD.t-2}" x2="${px.toFixed(1)}" y2="${(PAD.t+gH).toFixed(1)}" stroke="#e9d5ff" stroke-width="1" stroke-dasharray="2,2" opacity="0.8"/>`;
    svg+=`<circle cx="${px.toFixed(1)}" cy="${Y(mx.v).toFixed(1)}" r="2.6" fill="#e9d5ff"/>`;
    lane=(px-lastLx<34)?(lane^1):0;
    svg+=`<text x="${px.toFixed(1)}" y="${lane?9:17}" text-anchor="middle" font-size="7.5" fill="#e9d5ff" font-weight="700">▲${hToHHMM(mx.t)}</text>`;
    lastLx=px;
  });
  // Punkt 3: Wirkungsminima (Interdosis-Täler / Rebound-Fenster) markieren
  (de.minima||[]).forEach(mn=>{
    const px=X(mn.t),py=Y(mn.v);
    svg+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.4" fill="none" stroke="#fb923c" stroke-width="1.3"/>`;
    svg+=`<text x="${px.toFixed(1)}" y="${(py+11).toFixed(1)}" text-anchor="middle" font-size="7.5" fill="#fdba74" font-weight="700">▼${hToHHMM(mn.t)}</text>`;
  });
  // Punkt 5 (neu): vermutetes Wirkungsende markieren (Ende des Gesamtwirkfensters, winEnd)
  if(de.winEnd!=null&&de.winEnd<=t1+1e-6){
    const px=X(de.winEnd);
    svg+=`<line x1="${px.toFixed(1)}" y1="${PAD.t-2}" x2="${px.toFixed(1)}" y2="${(PAD.t+gH).toFixed(1)}" stroke="#94a8c8" stroke-width="1.2" stroke-dasharray="1,3" opacity="0.85"/>`;
    svg+=`<circle cx="${px.toFixed(1)}" cy="${(PAD.t+gH).toFixed(1)}" r="2.4" fill="#94a8c8"/>`;
    svg+=`<text x="${px.toFixed(1)}" y="${PAD.t-4}" text-anchor="middle" font-size="7.5" fill="#94a8c8" font-weight="700">⏹${hToHHMM(de.winEnd)}</text>`;
  }
  return svg+"</svg>";
}
function buildDayGraph(date,selectedMetrics){
  const W=360,ICON_H=34,H=202,PAD={t:ICON_H+14,r:10,b:28,l:28};

  const day=S.data[date]||{};const pts=buildDayTimeline(date);
  function xOf(h){return PAD.l+(h-1)/23*gW;}
  function yOf(v){return PAD.t+gH-(v-1)/4*gH;}

    if(sw<24){const x1=xOf(Math.max(sw,1));svg+=`<rect x="${x1}" y="${PAD.t}" width="${W-PAD.r-x1}" height="${gH}" fill="rgba(96,165,250,0.07)" rx="2"/>`;svg+=`<text x="${x1+3}" y="${PAD.t+9}" font-size="8" fill="#60a5fa">🌙${day.schlafenAt}</text>`;}
    svg+=`<text x="${PAD.l+3}" y="${PAD.t+9}" font-size="8" fill="#60a5fa">☀️${day.aufgestandenAt}</text>`;
  }
  // Punkt 1 (neu): Power-Nap-Stunden als 💤-Band markieren (analog zur Schlafphase, aber tagsüber)
  HOURS.forEach(h=>{
    if(!day.checkins?.[h]?.healthFlags?.nap)return;
    const x1=xOf(Math.max(h-0.5,1)),x2=xOf(Math.min(h+0.5,24));
    svg+=`<rect x="${x1.toFixed(1)}" y="${PAD.t}" width="${(x2-x1).toFixed(1)}" height="${gH}" fill="rgba(34,211,238,0.10)" rx="2"/>`;
    svg+=`<text x="${((x1+x2)/2).toFixed(1)}" y="${PAD.t+gH-4}" text-anchor="middle" font-size="9" fill="#22d3ee">💤</text>`;
  });
  for(let v=1;v<=5;v++){const y=yOf(v);svg+=`<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="#253050" stroke-width="1"/><text x="${PAD.l-4}" y="${y+4}" text-anchor="end" font-size="9" fill="#5a6890">${v}</text>`;}
  // Punkt 4: Y-Achse klar beschriften – Skala 1–5 gilt für BEIDE Ebenen (Symptom-Score UND normierte Wirkung)
  svg+=`<text x="${PAD.l-14}" y="${PAD.t+gH/2}" transform="rotate(-90 ${PAD.l-14} ${PAD.t+gH/2})" text-anchor="middle" font-size="8" fill="#5a6890">Score 1–5 · Wirkung normiert</text>`;
  for(let h=4;h<=24;h+=4){const x=xOf(h);svg+=`<line x1="${x}" y1="${PAD.t}" x2="${x}" y2="${PAD.t+gH}" stroke="#1e2840" stroke-width="1"/><text x="${x}" y="${H-4}" text-anchor="middle" font-size="9" fill="#5a6890">${h}h</text>`;}
  getDayMeds(day).forEach(dose=>{

    const hv=hhmmToH(dose.takenAt);if(hv==null)return;
    const x=xOf(hv);
    svg+=`<line x1="${x}" y1="${PAD.t}" x2="${x}" y2="${PAD.t+gH}" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,3"/><text x="${x+3}" y="${PAD.t+22}" font-size="9" fill="#c084fc">💊</text>`;
  });
  // Punkt 2 + 4: kombinierte Wirkkurve (Superposition ALLER Einnahmen), normiert auf DIESELBE 1–5-Achse wie die Symptome.
  //   Wirkung 0 → Achsenboden (Score 1), Tages-Maximum → Score 5. So liegen Symptom-Eingaben und theoretische Wirkung
  //   im GLEICHEN Koordinatensystem und sind direkt vergleichbar (Punkt-4-Transparenz).
  const de=computeDayEffect(day);
  if(de&&!de.allNonstim){
    const yEff=s=>yOf(1+ (Math.max(0,Math.min(1,s/de.maxS))*4)); // 0..maxS → Score 1..5
    const csx=t=>xOf(Math.max(1,Math.min(24,t)));
    const seg=de.curve.filter(p=>p.t>=1&&p.t<=24.001);
    if(seg.length>1){
      let area=`M${csx(seg[0].t).toFixed(1)},${(PAD.t+gH).toFixed(1)}`;
      seg.forEach(p=>{area+=` L${csx(p.t).toFixed(1)},${yEff(p.s).toFixed(1)}`;});
      area+=` L${csx(seg[seg.length-1].t).toFixed(1)},${(PAD.t+gH).toFixed(1)} Z`;
      svg+=`<path d="${area}" fill="#c084fc" opacity="0.10"/>`;
      let ln=`M${csx(seg[0].t).toFixed(1)},${yEff(seg[0].s).toFixed(1)}`;
      for(let k=1;k<seg.length;k++)ln+=` L${csx(seg[k].t).toFixed(1)},${yEff(seg[k].s).toFixed(1)}`;

    }
    // Alle lokalen Wirk-Maxima (Scheitelpunkte) mit Uhrzeit markieren
    let lastLx=-999,lrow=0;
    (de.maxima&&de.maxima.length?de.maxima:[{t:de.peakT,v:de.peakV}]).forEach(mx=>{
      if(mx.t<1||mx.t>24.4||mx.v<=0.05)return;
      const px=csx(mx.t);
      svg+=`<line x1="${px.toFixed(1)}" y1="${PAD.t}" x2="${px.toFixed(1)}" y2="${(PAD.t+gH).toFixed(1)}" stroke="#c084fc" stroke-width="1" stroke-dasharray="2,3" opacity="0.85"/>`;
      lrow=(px-lastLx<36)?(lrow^1):0;
      const ly=Math.max(PAD.t+8,yEff(mx.v)-5)-(lrow?10:0);
      svg+=`<text x="${px.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="8" fill="#e9d5ff" font-weight="700">▲${hToHHMM(mx.t)}·${de.norm10(mx.v).toFixed(0)}</text>`;
      lastLx=px;
    });
    // Punkt 3: Wirkungsminima (Tiefpunkte / Interdosis-Täler / Rebound-Fenster) markieren
    (de.minima||[]).forEach(mn=>{
      if(mn.t<1||mn.t>24.4)return;
      const px=csx(mn.t),py=yEff(mn.v);
      svg+=`<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${px.toFixed(1)}" y2="${(PAD.t+gH).toFixed(1)}" stroke="#fb923c" stroke-width="1" stroke-dasharray="1,3" opacity="0.7"/>`;
      svg+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.6" fill="none" stroke="#fb923c" stroke-width="1.4"/>`;
      svg+=`<text x="${px.toFixed(1)}" y="${(py+13).toFixed(1)}" text-anchor="middle" font-size="8" fill="#fdba74" font-weight="700">▼${hToHHMM(mn.t)}</text>`;
    });
    // Punkt 5 (neu): vermutetes Wirkungsende (Ende des Gesamtwirkfensters) markieren
    if(de.winEnd!=null&&de.winEnd>=1&&de.winEnd<=24.4){
      const px=csx(de.winEnd);
      svg+=`<line x1="${px.toFixed(1)}" y1="${PAD.t}" x2="${px.toFixed(1)}" y2="${(PAD.t+gH).toFixed(1)}" stroke="#94a8c8" stroke-width="1" stroke-dasharray="1,3" opacity="0.8"/>`;
      svg+=`<circle cx="${px.toFixed(1)}" cy="${(PAD.t+gH).toFixed(1)}" r="2.6" fill="#94a8c8"/>`;
      svg+=`<text x="${px.toFixed(1)}" y="${(PAD.t+gH-6).toFixed(1)}" text-anchor="middle" font-size="8" fill="#94a8c8" font-weight="700">⏹${hToHHMM(de.winEnd)}</text>`;
    }
  }
  selectedMetrics.forEach(mid=>{
    const m=METRICS.find(x=>x.id===mid);if(!m)return;
    const dp=pts.filter(p=>p[mid]!=null).map(p=>({x:xOf(p.hour),y:yOf(p[mid])}));
    if(dp.length<1)return;
    if(dp.length>1){let d=`M${dp[0].x},${dp[0].y}`;for(let i=1;i<dp.length;i++){const mx=(dp[i-1].x+dp[i].x)/2;d+=` C${mx},${dp[i-1].y} ${mx},${dp[i].y} ${dp[i].x},${dp[i].y}`;}svg+=`<path d="${d}" fill="none" stroke="${m.color}" stroke-width="2.5" stroke-linecap="round"/>`;}
    dp.forEach(pt=>{svg+=`<circle cx="${pt.x}" cy="${pt.y}" r="4" fill="${m.color}" stroke="#0a0e1a" stroke-width="1.5"/>`;});
  });
  pts.forEach(p=>{
    if(!p.events.length)return;const x=xOf(p.hour);
    const ei=p.events.filter(e=>e.type==="pos"||e.type==="neg").slice(0,3).map(e=>e.type==="pos"?"✅":"⚠️");
    const ci=p.events.filter(e=>e.type==="caff"||e.type==="food").slice(0,3).map(e=>e.type==="caff"?"☕":"🍽️");
    ei.forEach((ic,i)=>{svg+=`<text x="${x+(i-ei.length/2+.5)*12}" y="${ICON_H-13}" text-anchor="middle" font-size="11">${ic}</text>`;});
    ci.forEach((ic,i)=>{svg+=`<text x="${x+(i-ci.length/2+.5)*12}" y="${ICON_H-2}" text-anchor="middle" font-size="11">${ic}</text>`;});
  });
  return svg+"</svg>";
}
function medAbbr(name){
  if(!name)return'';
  const M={Elvanse:'ELV',Lisdexamfetamin:'LDX',Methylphenidat:'MPH',[MPH_NEURAXPHARM]:'NPX',Metiphenal:'MTP',Ritalin:'RIT',Concerta:'CON',Medikinet:'MED',Strattera:'STR',Intuniv:'INT'};
  return M[name]||(name||'').slice(0,3).toUpperCase();
}
function buildTrendGraph(metricId,days=14){
  const W=360,H=200,PAD={t:8,r:28,b:94,l:28};
  const gW=W-PAD.l-PAD.r,gH=H-PAD.t-PAD.b;
  const AX=PAD.t+gH;
  const data=[...buildTrendData(metricId,days)].reverse();
  const m=METRICS.find(x=>x.id===metricId);if(!data.length||!m)return'';
  const n=data.length;
  const sleepMap={};
  buildSleepTrendData(days).forEach(d=>{if(d.avg!=null)sleepMap[d.date]=d.avg;});
  const SL_MIN=4,SL_MAX=10;
  function xOf(i){return PAD.l+(i/(n-1||1))*gW;}
  function yOf(v){return PAD.t+gH-((v-1)/4)*gH;}
  function yOfSleep(h){return PAD.t+gH-Math.max(0,Math.min(1,(h-SL_MIN)/(SL_MAX-SL_MIN)))*gH;}
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;overflow:visible;">`;
  for(let v=1;v<=5;v+=2){const y=yOf(v);svg+=`<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="#253050" stroke-width="1"/><text x="${PAD.l-4}" y="${y+4}" text-anchor="end" font-size="9" fill="#5a6890">${v}</text>`;}
  [[4,'4h'],[7,'7h'],[10,'10h']].forEach(([h,lbl])=>{
    svg+=`<text x="${W-PAD.r+4}" y="${yOfSleep(h)+3}" font-size="7" fill="#22d3ee" opacity="0.4">${lbl}</text>`;
  });
  data.forEach((d,i)=>{if(d.avg==null)svg+=`<line x1="${xOf(i)}" y1="${PAD.t}" x2="${xOf(i)}" y2="${AX}" stroke="#1e2840" stroke-width="6" opacity="0.45"/>`;});
  const slPts=data.map((d,i)=>({i,h:sleepMap[d.date]})).filter(p=>p.h!=null);
  if(slPts.length>1){
    let aPath=`M${xOf(slPts[0].i)},${AX}`;
    slPts.forEach(pt=>{aPath+=` L${xOf(pt.i)},${yOfSleep(pt.h)}`;});
    aPath+=` L${xOf(slPts[slPts.length-1].i)},${AX} Z`;
    svg+=`<path d="${aPath}" fill="#22d3ee" opacity="0.09"/>`;
    for(let k=1;k<slPts.length;k++){
      const a=slPts[k-1],b=slPts[k],gap=(b.i-a.i)>1;
      svg+=`<line x1="${xOf(a.i)}" y1="${yOfSleep(a.h)}" x2="${xOf(b.i)}" y2="${yOfSleep(b.h)}" stroke="#22d3ee" stroke-width="0.8" stroke-dasharray="2,4" opacity="${gap?0.1:0.25}"/>`;
    }
  }
  const valid=data.map((d,i)=>({...d,i})).filter(d=>d.avg!=null);
  for(let k=1;k<valid.length;k++){
    const a=valid[k-1],b=valid[k],gap=(b.i-a.i)>1;
    svg+=`<line x1="${xOf(a.i)}" y1="${yOf(a.avg)}" x2="${xOf(b.i)}" y2="${yOf(b.avg)}" stroke="${gap?'#46557e':m.color}" stroke-width="${gap?1.5:2.5}" stroke-linecap="round" ${gap?'stroke-dasharray="3,4"':''}/>`;
  }
  valid.forEach(pt=>{
    const date=data[pt.i]?.date,dd=date?S.data[date]:null,ctx=dd?.dayCtx||{};
    const x=xOf(pt.i),y=yOf(pt.avg);
    svg+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${m.color}"/>`;
    // Kontextfaktoren direkt am Datenpunkt – formcodiert (für Rotgrünblinde gut unterscheidbar)
    const marks=[];
    if(ctx.stress)marks.push("stress");
    if(ctx.arbeit)marks.push("arbeit");
    if(ctx.hitze)marks.push("hitze");
    if(ctx.kaelte)marks.push("kaelte");
    if(ctx.bildschirm)marks.push("bildschirm");
    if(ctx.trinken)marks.push("trinken");
    if(ctx.routine)marks.push("routine");
    if(dd?.medication&&!dd?.isPauseDay)marks.push("med");
    marks.forEach((mk,j)=>{
      const my=y-8-j*7;
      if(mk==="stress")svg+=`<circle cx="${x}" cy="${my}" r="2.7" fill="#ff7070"/>`;                                  // 🔴 Stress = Kreis ●
      else if(mk==="arbeit")svg+=`<rect x="${x-2.5}" y="${my-2.5}" width="5" height="5" rx="1" fill="#56B4E9"/>`;       // 🟦 Arbeit = Quadrat ■
      else if(mk==="hitze")svg+=`<path d="M${x},${my-3.4} L${x+3.2},${my+2.6} L${x-3.2},${my+2.6} Z" fill="#D55E00"/>`; // 🔥 Hitze = Dreieck ▲
      else if(mk==="kaelte")svg+=`<path d="M${x},${my+3.4} L${x+3.2},${my-2.6} L${x-3.2},${my-2.6} Z" fill="#0072B2"/>`;// ❄️ Kälte = Dreieck ▼
      else if(mk==="bildschirm")svg+=`<rect x="${x-2.5}" y="${my-2.5}" width="5" height="5" rx="1" fill="none" stroke="#CC79A7" stroke-width="1.4"/>`; // 📱 Bildschirm = leeres Quadrat □
      else if(mk==="trinken")svg+=`<path d="M${x},${my-3.3} C${x+2.6},${my-0.3} ${x+2.2},${my+3} ${x},${my+3} C${x-2.2},${my+3} ${x-2.6},${my-0.3} ${x},${my-3.3} Z" fill="#E69F00"/>`; // 💧 Zu wenig getrunken = Tropfen
      else if(mk==="routine")svg+=`<path d="M${x-3},${my+0.2} L${x-1},${my+2.6} L${x+3},${my-2.8}" fill="none" stroke="#009E73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>`; // ✅ Routine = Haken ✓
      else if(mk==="med")svg+=`<path d="M${x},${my-3.2} L${x+3.2},${my} L${x},${my+3.2} L${x-3.2},${my} Z" fill="#c084fc"/>`; // 🟣 Medikament = Raute ◆
    });
  });
  const step=n>16?Math.ceil(n/8):2;
  data.forEach((d,i)=>{
    const x=xOf(i),dd=S.data[d.date];
    if(i%step===0||i===n-1)
      svg+=`<text x="${x}" y="${AX+20}" text-anchor="middle" font-size="8" fill="#5a6890">${fmtDateXS(d.date)}</text>`;
    if(dd?.medication&&!dd.isPauseDay){
      if(i%step===0||i===n-1)
        svg+=`<text x="${x}" y="${AX+34}" text-anchor="middle" font-size="6.5" fill="#c084fc" font-weight="600">${medAbbr(dd.medication)}</text>`;
      else
        svg+=`<circle cx="${x}" cy="${AX+28}" r="2" fill="#c084fc" opacity="0.6"/>`;
    } else if(dd?.isPauseDay){
      if(i%step===0||i===n-1)
        svg+=`<text x="${x}" y="${AX+34}" text-anchor="middle" font-size="7" fill="#fdba74">–P–</text>`;
      else
        svg+=`<circle cx="${x}" cy="${AX+28}" r="2" fill="#fdba74" opacity="0.55"/>`;
    } else if(d.date){
      svg+=`<circle cx="${x}" cy="${AX+28}" r="1.5" fill="#253050" opacity="0.4"/>`;
    }
    const cks=Object.values(dd?.checkins||{});
    [
      [cks.some(c=>c.healthFlags?.gelenke),'🦵'],
      [cks.some(c=>c.healthFlags?.sport),'💪'],
      [cks.some(c=>(c.ibuprofenMg||0)>0),'💊'],
      [(sleepMap[d.date]!=null&&sleepMap[d.date]<6),'😪'],
      [cks.some(c=>c.healthFlags?.nap),'💤'], // Punkt 1 (neu): Power Nap
    ].filter(([on])=>on).forEach(([,emoji],j)=>{
      svg+=`<text x="${x}" y="${AX+50+j*13}" text-anchor="middle" font-size="10">${emoji}</text>`;
    });
  });
  // Unsichtbare Trefferflächen je Tag → Tooltip mit Kontextfaktoren beim Tippen/Hovern
  const hw=n>1?(gW/(n-1))/2:gW/2;
  data.forEach((d,i)=>{
    if(!d.date)return;const x=xOf(i);
    svg+=`<rect x="${(x-hw).toFixed(1)}" y="${PAD.t}" width="${(hw*2).toFixed(1)}" height="${(AX-PAD.t).toFixed(1)}" fill="transparent" style="cursor:pointer" onclick="window._trendTip(event,'${d.date}')" onmouseenter="window._trendTip(event,'${d.date}')" onmousemove="window._trendTip(event,'${d.date}')" onmouseleave="window._trendTipHide()"/>`;
  });
  return svg+'</svg>';
}

function buildBodyGraph(series,yMin,yMax,rangeKey){

function buildCorrelationTimelineGraph(dates,ibuByDate,gelenkeByDate,verdauByDate){

    svg+=`<line x1="${PAD.l}" y1="${(r.y+ROW_H).toFixed(1)}" x2="${W-PAD.r}" y2="${(r.y+ROW_H).toFixed(1)}" stroke="#1e2840" stroke-width="1"/>`;

  dates.forEach((d,i)=>{

    if(ibu>0){const h=Math.max((ibu/maxIbu)*(ROW_H-8),3);svg+=`<rect x="${(x+1).toFixed(1)}" y="${(rows[0].y+ROW_H-4-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${rows[0].color}" rx="2" opacity="0.85"/>`;}
    if(gel)svg+=`<circle cx="${(x+bw/2+1).toFixed(1)}" cy="${(rows[1].y+ROW_H/2).toFixed(1)}" r="4" fill="${rows[1].color}"/>`;
    if(ver)svg+=`<circle cx="${(x+bw/2+1).toFixed(1)}" cy="${(rows[2].y+ROW_H/2).toFixed(1)}" r="4" fill="${rows[2].color}"/>`;

  });
  return svg+"</svg>";
}

function el(tag,attrs,...kids){

  const avgDia=bpDays.length?Math.round(bpDays.reduce((s,d)=>s+(+S.data[d].dia),0)/bpDays.length):null;
  const pDays=allDays.filter(d=>S.data[d]?.puls);
  const avgPuls=pDays.length?Math.round(pDays.reduce((s,d)=>s+(+S.data[d].puls),0)/pDays.length):null;
  const wirkDauern=[];
  allDays.forEach(date=>{
    const d=S.data[date];if(!d?.takenAt)return;

    const cks=Object.entries(d.checkins||{}).sort((a,b)=>+a[0]-+b[0]);

    if(rb){const dur=+rb[0]-mh;if(dur>=2&&dur<=12)wirkDauern.push(dur);}
  });
  const avgWirkDauer=wirkDauern.length?(wirkDauern.reduce((a,b)=>a+b,0)/wirkDauern.length).toFixed(1):null;
  const baselineAvg=getBaselineFocusAvg();
  const fMedVals=[];
  allDays.forEach(date=>{
    const d=S.data[date];if(!d?.medication||d?.isBaseline)return;
    const vs=Object.values(d.checkins||{}).map(c=>c.symptoms?.focus).filter(Boolean);
    if(vs.length)fMedVals.push(vs.reduce((a,b)=>a+b,0)/vs.length);
  });
  const avgFMed=fMedVals.length?fMedVals.reduce((a,b)=>a+b,0)/fMedVals.length:null;
  const fokusDiff=(avgFMed&&baselineAvg)?Math.round((avgFMed-baselineAvg)/baselineAvg*100):null;
  const rHours=[];
  allDays.forEach(date=>{Object.entries(S.data[date]?.checkins||{}).forEach(([h,c])=>{if((c.events||[]).some(e=>e.type==="neg"&&(e.label.includes("Rebound")||e.label.includes("Wirkung weg"))))rHours.push(+h);});});
  const sortedDays=[...allDays].sort();
  const sfPairs=[];
  sortedDays.forEach((date,i)=>{
    const d=S.data[date];if(!d?.aufgestandenAt)return;
    const next=sortedDays[i+1];if(!next)return;
    const dur=getSleepDurationForDate(date);
    const nf=avg(Object.values(S.data[next]?.checkins||{}).map(c=>c.symptoms?.focus).filter(Boolean));
    if(nf&&dur>2&&dur<14)sfPairs.push({sleep:dur,focus:nf});

  let sleepCorr=null;const sfN=sfPairs.length;
  if(sfN>=14){
    const ms=sfPairs.reduce((a,p)=>a+p.sleep,0)/sfN,mf=sfPairs.reduce((a,p)=>a+p.focus,0)/sfN;

    const den=Math.sqrt(sfPairs.reduce((a,p)=>a+(p.sleep-ms)**2,0)*sfPairs.reduce((a,p)=>a+(p.focus-mf)**2,0));

  }

      const next=sortedDays[i+1];if(!next)return;
      const hasTag=!!getDaySleepTags(date)[tag.id]; // Punkt 3: tagesbasierte Schlafqualität
      const nf=avg(Object.values(S.data[next]?.checkins||{}).map(c=>c.symptoms?.focus).filter(Boolean));
      if(nf!=null)pairs.push({x:hasTag?1:0,y:nf});
    });

      const n=pairs.length,mx=pairs.reduce((a,p)=>a+p.x,0)/n,my=pairs.reduce((a,p)=>a+p.y,0)/n;
      const num=pairs.reduce((a,p)=>a+(p.x-mx)*(p.y-my),0);
      const den=Math.sqrt(pairs.reduce((a,p)=>a+(p.x-mx)**2,0)*pairs.reduce((a,p)=>a+(p.y-my)**2,0));

    }
  });
  const hfCounts={};
  allDays.forEach(d=>{Object.values(S.data[d]?.checkins||{}).forEach(c=>{Object.entries(c.healthFlags||{}).forEach(([id,v])=>{if(v)hfCounts[id]=(hfCounts[id]||0)+1;});});});
  const topFlags=HEALTH_FLAGS.map(f=>({label:f.icon+" "+f.label,count:hfCounts[f.id]||0})).filter(f=>f.count>0).sort((a,b)=>b.count-a.count).slice(0,4);
  const latestMed=allDays.find(d=>S.data[d]?.medication&&!S.data[d]?.isBaseline);
  const currentMed=latestMed?`${S.data[latestMed].medication} ${S.data[latestMed].dosage}`.trim():"k. A.";
  const medHistory={};
  allDays.forEach(date=>{const d=S.data[date];if(!d?.medication||d?.isBaseline||d?.isPauseDay)return;const k=`${d.medication} ${d.dosage}`.trim();medHistory[k]=(medHistory[k]||0)+1;});
  const last3=allDays.slice(0,3).reverse();

    const mVals=Object.values(d.checkins||{}).map(c=>c.symptoms?.mood).filter(Boolean);
    const eVals=Object.values(d.checkins||{}).map(c=>c.symptoms?.energy).filter(Boolean);

    return{date,medication:d.isPauseDay?"PAUSE":(d.medication?`${d.medication} ${d.dosage}`.trim():"–"),
      takenAt:d.takenAt||"–",avgFocus:fVals.length?(fVals.reduce((a,b)=>a+b,0)/fVals.length).toFixed(1):"–",
      avgMood:mVals.length?(mVals.reduce((a,b)=>a+b,0)/mVals.length).toFixed(1):"–",
      avgEnergy:eVals.length?(eVals.reduce((a,b)=>a+b,0)/eVals.length).toFixed(1):"–",
      schlafenAt:d.schlafenAt||"–",aufgestandenAt:d.aufgestandenAt||"–",
      sleepDur:dur?dur.toFixed(1)+"h":"–",sys:d.sys||"–",dia:d.dia||"–",puls:d.puls||"–",
      sysPeak:d.sysPeak||"",diaPeak:d.diaPeak||"",gewicht:d.gewicht||"–"};
  });
  return{today,allDays,totalCheckins:checks.length,startWeight,currentWeight,weightDiff,
    avgSys,avgDia,avgPuls,bpDays,avgWirkDauer,wirkDauern,avgFMed,avgFNoMed:baselineAvg,fokusDiff,
    reboundHours:rHours,reboundMin:rHours.length?Math.min(...rHours):null,reboundMax:rHours.length?Math.max(...rHours):null,
    reboundAvg:rHours.length?Math.round(rHours.reduce((a,b)=>a+b,0)/rHours.length):null,

    currentMed,baselineDayCount:getBaselineDays().length,pauseDayCount:allDays.filter(d=>S.data[d]?.isPauseDay).length,
    medHistory,last3Detail};
}

${"═".repeat(56)}
