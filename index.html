<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FocusLog">
<title>FocusLog</title>
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%230a0e1a'/><path d='M40 90h25c5 0 8-5 10-15l10-35c3-10 8-10 11 0l15 80c2 10 7 10 10 0l10-45c2-10 5-15 10-15h40' stroke='%2360a5fa' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='106' cy='75' r='6' fill='%234ade80'/></svg>">
<style>
:root {
  --bg:#0a0e1a; --surface:#12172a; --card:#161d30; --border:#253050;
  --accent:#60a5fa; --accentL:#93c5fd;
  --green:#4ade80; --red:#ff7070; --yellow:#fcd34d; --orange:#fdba74;
  --purple:#c084fc; --pink:#f472b6;
  --text:#f4f7ff; --muted:#94a8c8; --dim:#1e2840;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  min-height:100vh;max-width:430px;margin:0 auto;padding-bottom:calc(80px + env(safe-area-inset-bottom));font-size:16px;}
.topbar{padding:52px 20px 12px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--bg) 70%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
.topbar-logo{display:flex;align-items:center;gap:10px;}
.topbar h1{font-size:28px;font-weight:700;}
.sub{font-size:13px;color:var(--muted);margin-top:3px;}
.section{padding:0 16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;overflow:hidden;}
.card-label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px;margin-top:0;}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;overflow:hidden;}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;overflow:hidden;}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;overflow:hidden;}
@media(max-width:320px){.row4{grid-template-columns:repeat(2,minmax(0,1fr));}.row3{grid-template-columns:repeat(2,minmax(0,1fr));}}
.btn{width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;}
.btn.primary{background:var(--accent);}
.btn.green{background:var(--green);color:#0a0e1a;}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:13px;margin-top:8px;}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:10px;width:auto;}
.btn.sm.active{background:rgba(96,165,250,.2);border:1px solid var(--accent);color:var(--accentL);}
.btn.sm.ghost-sm{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn:disabled{opacity:.4;cursor:default;}
input,textarea,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:12px;padding:13px 15px;color:var(--text);font-size:16px;font-family:inherit;outline:none;
  box-sizing:border-box;min-width:0;-webkit-appearance:none;appearance:none;}
select{background:#161d30;}
textarea{min-height:70px;resize:vertical;line-height:1.6;}
input[type=time],input[type=date]{padding:10px 8px;font-size:14px;max-width:100%;overflow:hidden;}
.scale-row{display:flex;gap:6px;}
.scale-btn{flex:1;padding:12px 0;border-radius:10px;cursor:pointer;font-size:17px;font-weight:700;
  border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);font-family:inherit;}
.date-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.date-strip::-webkit-scrollbar{display:none;}
.date-pill{display:flex;flex-direction:column;align-items:center;padding:8px 12px;border-radius:12px;
  cursor:pointer;border:1.5px solid var(--border);background:transparent;min-width:52px;font-family:inherit;}
.date-pill.active{background:rgba(96,165,250,.18);border-color:var(--accent);}
.date-pill.has-data{border-color:var(--green);}
.date-pill-dow{font-size:11px;color:var(--muted);}
.date-pill-day{font-size:18px;font-weight:700;}
.date-pill-dot{width:5px;height:5px;border-radius:50%;background:var(--green);margin-top:2px;}
.med-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;
  padding:10px 16px;cursor:pointer;color:var(--muted);font-size:14px;font-family:inherit;}
.med-btn.has-med{background:rgba(96,165,250,.15);border-color:var(--accent);color:var(--accentL);}
.timeline-scroll{overflow-x:auto;padding-bottom:4px;}
.timeline-row{display:flex;gap:6px;min-width:max-content;padding-bottom:4px;}
.hour-dot{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:36px;}
.hour-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;border:1.5px dashed var(--dim);background:transparent;color:var(--muted);position:relative;}
.hour-label{font-size:9px;color:var(--muted);}
.med-badge{position:absolute;top:-5px;right:-4px;font-size:10px;}
.entry-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.entry-row:last-child{border-bottom:none;}
.entry-time{font-size:14px;color:var(--muted);min-width:40px;padding-top:2px;}
.entry-tags{display:flex;flex-wrap:wrap;gap:4px;flex:1;}
.etag{font-size:12px;border-radius:6px;padding:3px 8px;}
.entry-note{font-size:13px;color:var(--muted);margin-top:3px;}
.event-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;
  font-size:13px;cursor:pointer;border:1.5px solid transparent;font-family:inherit;background:rgba(255,255,255,.04);
  border-color:var(--border);color:var(--muted);}
.event-chip.pos{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.4);color:var(--green);}
.event-chip.neg{background:rgba(255,112,112,.1);border-color:rgba(255,112,112,.4);color:var(--red);}
.event-chip.caff{background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.4);color:var(--accentL);}
.event-chip.food{background:rgba(253,186,116,.1);border-color:rgba(253,186,116,.4);color:var(--orange);}
.event-chip.med{background:rgba(192,132,252,.1);border-color:rgba(192,132,252,.4);color:var(--purple);}
.event-chip.health{background:rgba(148,168,200,.1);border-color:rgba(148,168,200,.3);color:var(--muted);}
.event-chip.ctx{background:rgba(96,165,250,.08);border-color:rgba(96,165,250,.3);color:var(--accentL);}
.chip-del{cursor:pointer;opacity:.6;margin-left:3px;font-size:15px;}
.chips-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.health-checks{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.hcheck{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  cursor:pointer;border:1.5px solid var(--border);background:rgba(255,255,255,.03);}
.hcheck.on{background:rgba(148,168,200,.1);border-color:rgba(148,168,200,.4);}
.hcheck-icon{font-size:18px;min-width:24px;text-align:center;}
.hcheck-label{font-size:14px;color:var(--muted);flex:1;}
.hcheck.on .hcheck-label{color:var(--text);}
.hcheck-box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.hcheck.on .hcheck-box{background:rgba(148,168,200,.3);border-color:var(--muted);}
.preset-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.preset-btn{padding:7px 13px;border-radius:20px;cursor:pointer;font-size:13px;font-family:inherit;
  border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);}
.preset-btn.active-tag{border-color:var(--accent);background:rgba(96,165,250,.15);color:var(--accentL);}
.graph-wrap{overflow-x:auto;padding-bottom:32px;}
.graph-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);}
.legend-dot{width:10px;height:10px;border-radius:50%;}
.legend-line{width:18px;height:3px;border-radius:2px;}
.legend-line.dash{background:none!important;border-top:3px dashed currentColor;height:0;}
.bp-sub{font-size:12px;font-weight:600;margin:10px 0 2px;display:flex;align-items:center;gap:6px;}
.bp-sub.base{color:#56B4E9;}
.bp-sub.peak{color:#E69F00;}
.peak-hint{font-size:12px;color:var(--orange);line-height:1.5;background:rgba(253,186,116,.1);border:1px solid rgba(253,186,116,.3);border-radius:10px;padding:8px 10px;margin:8px 0;}
.trend-tip{position:fixed;z-index:400;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);box-shadow:0 8px 28px rgba(0,0,0,.55);pointer-events:none;max-width:210px;line-height:1.55;display:none;}
.trend-tip .tt-date{font-weight:700;margin-bottom:4px;color:var(--accentL);}
.trend-tip .tt-row{color:var(--muted);}
.trend-tip .tt-none{color:var(--dim);}
.stat-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
.stat-tabs::-webkit-scrollbar{display:none;}
.stat-tab{padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;
  white-space:nowrap;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:inherit;}
.stat-tab.active{background:rgba(96,165,250,.18);border-color:var(--accent);color:var(--accentL);}
.insight{border-radius:16px;padding:16px;margin-bottom:10px;border:1px solid;}
.insight.pos{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.3);}
.insight.warn{background:rgba(252,211,77,.08);border-color:rgba(252,211,77,.3);}
.insight.info{background:rgba(96,165,250,.08);border-color:rgba(96,165,250,.3);}
.insight-icon{font-size:20px;margin-bottom:5px;}
.insight-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.insight-title.pos{color:var(--green);}
.insight-title.warn{color:var(--yellow);}
.insight-title.info{color:var(--accentL);}
.insight-text{font-size:13px;color:var(--muted);line-height:1.6;}
.sbar-wrap{min-height:5px;height:5px;background:var(--dim);border-radius:4px;overflow:hidden;margin-top:4px;}
.sbar-fill{height:100%;border-radius:4px;}
.mini-stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 8px;text-align:center;}
.mini-stat-num{font-size:26px;font-weight:800;}
.mini-stat-lbl{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em;}
.best-card{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);border-radius:16px;padding:16px;margin-bottom:10px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:flex;align-items:flex-end;}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:430px;margin:0 auto;
  padding:24px 20px calc(40px + env(safe-area-inset-bottom));border:1px solid var(--border);
  max-height:90vh;overflow-y:auto;box-sizing:border-box;}
.sheet input,.sheet select,.sheet textarea{margin-bottom:2px;}
.sheet-title{font-size:20px;font-weight:700;margin-bottom:18px;}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  background:rgba(10,14,26,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);display:flex;justify-content:space-around;
  padding:10px 0 calc(28px + env(safe-area-inset-bottom));z-index:50;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;
  background:none;color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 10px;font-family:inherit;}
.nav-btn.active{color:var(--accentL);}
.nav-icon{font-size:26px;}
.empty{text-align:center;padding:60px 0;color:var(--muted);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--green);
  color:#0a0e1a;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:700;z-index:300;
  animation:fadeInOut 2s forwards;}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(-8px);}15%{opacity:1;transform:translateX(-50%) translateY(0);}75%{opacity:1;}100%{opacity:0;}}
.backup-card{background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.2);border-radius:16px;padding:16px;margin-bottom:10px;}
.backup-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.bup-btn{flex:1;min-width:80px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;
  padding:13px 8px;cursor:pointer;font-family:inherit;color:var(--text);font-size:13px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:5px;box-sizing:border-box;}
.bup-icon{font-size:24px;}
.import-area{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;
  padding:12px;color:var(--text);font-size:13px;font-family:'Courier New',monospace;outline:none;
  min-height:80px;resize:vertical;margin-top:8px;line-height:1.5;}
.report-box{font-family:'Courier New',monospace;font-size:12px;line-height:1.8;color:var(--muted);
  white-space:pre-wrap;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;}
.seg{display:flex;background:var(--dim);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px;}
.seg-btn{flex:1;padding:8px;border-radius:9px;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);background:transparent;}
.seg-btn.active{background:var(--card);color:var(--text);}
.cat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px;display:block;}
.vital-row{display:grid;gap:8px;margin-top:6px;}
.vital-field{display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden;}
.vital-field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;white-space:normal;word-break:break-word;line-height:1.3;}
.vital-field input{padding:10px 8px;font-size:14px;min-width:0;width:100%;-webkit-appearance:none;appearance:none;overflow:hidden;}
.ctx-strip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.ctx-tag{padding:6px 12px;border-radius:20px;cursor:pointer;font-size:13px;font-family:inherit;
  border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);}
.ctx-tag.on{border-color:var(--accent);background:rgba(96,165,250,.15);color:var(--accentL);}
.ctx-tag.stress-on{border-color:var(--red);background:rgba(255,112,112,.15);color:var(--red);}
.sleep-subtags{background:rgba(96,165,250,.05);border:1px solid rgba(96,165,250,.2);border-radius:12px;padding:10px 12px;margin-top:8px;}
.pain-local{margin-top:10px;padding:12px;background:rgba(255,112,112,.06);border:1px solid rgba(255,112,112,.2);border-radius:12px;}
.pain-local-title{font-size:11px;color:var(--red);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.pain-hotspot{cursor:pointer;}
.med-list-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
.med-list-item:last-child{border-bottom:none;}
.med-list-label{flex:1;font-size:14px;}
.med-del-btn{background:rgba(255,112,112,.15);border:1px solid rgba(255,112,112,.3);color:var(--red);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px;font-family:inherit;}
.baseline-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:rgba(252,211,77,.15);border:1px solid rgba(252,211,77,.4);color:var(--yellow);margin-left:6px;}
.treatment-opts{display:flex;gap:6px;flex-wrap:wrap;}
.treatment-opt{padding:8px 14px;border-radius:12px;cursor:pointer;font-size:13px;font-family:inherit;border:1.5px solid var(--border);background:transparent;color:var(--muted);}
.treatment-opt.on{border-color:var(--yellow);background:rgba(252,211,77,.12);color:var(--yellow);}
.pause-btn{width:100%;padding:14px;border-radius:14px;cursor:pointer;font-size:15px;font-weight:700;font-family:inherit;border:2px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);margin-bottom:14px;}
.pause-btn.active{border-color:var(--orange);background:rgba(253,186,116,.15);color:var(--orange);}
.therapy-toggle{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;cursor:pointer;border:1.5px solid var(--border);background:rgba(255,255,255,.03);margin-bottom:10px;}
.therapy-toggle.on{border-color:var(--green);background:rgba(74,222,128,.08);}
.toggle-track{width:44px;height:24px;border-radius:12px;background:var(--dim);position:relative;flex-shrink:0;transition:background .2s;}
.therapy-toggle.on .toggle-track{background:var(--green);}
.toggle-thumb{width:20px;height:20px;border-radius:10px;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s;}
.therapy-toggle.on .toggle-thumb{left:22px;}
.ctx-today-card{background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.18);border-radius:16px;padding:14px 16px;margin-bottom:10px;}
.ibu-select{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.ibu-btn{padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;font-family:inherit;border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);}
.ibu-btn.on{border-color:var(--red);background:rgba(255,112,112,.15);color:var(--red);}
.quick-med{margin-bottom:10px;}
.quick-med-btn{width:100%;padding:18px;border-radius:16px;border:1.5px solid var(--accent);
  background:rgba(96,165,250,.14);color:var(--accentL);font-family:inherit;font-size:17px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s;}
.quick-med-btn:active{transform:scale(.98);}
.quick-med-sub{text-align:center;font-size:11px;color:var(--muted);margin-top:6px;}
.quick-med.taken{background:rgba(74,222,128,.07);border:1px solid rgba(74,222,128,.3);border-radius:16px;padding:14px 16px;}
.quick-med.warn{background:rgba(253,186,116,.09);border-color:rgba(253,186,116,.45);}
.quick-med.ended{background:rgba(255,112,112,.08);border-color:rgba(255,112,112,.35);}
.quick-med.pause{background:rgba(253,186,116,.08);border:1px solid rgba(253,186,116,.35);border-radius:16px;padding:14px 16px;color:var(--orange);font-size:14px;font-weight:600;text-align:center;}
.quick-med-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;}
.quick-med-head .qm-check{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--green);color:#08210f;font-weight:800;font-size:13px;flex-shrink:0;}
.qm-undo{margin-left:auto;background:none;border:none;color:var(--muted);font-family:inherit;font-size:12px;cursor:pointer;text-decoration:underline;padding:4px;flex-shrink:0;}
.peak-bar{height:8px;border-radius:6px;background:var(--dim);margin-top:12px;overflow:hidden;}
.peak-fill{height:100%;border-radius:6px;transition:width .4s ease;}
.peak-fill.active{background:linear-gradient(90deg,var(--green),var(--accent));}
.peak-fill.rebound-soon{background:linear-gradient(90deg,var(--green),var(--orange));}
.peak-fill.ended{background:linear-gradient(90deg,var(--orange),var(--red));}
.peak-text{font-size:12px;margin-top:8px;color:var(--muted);line-height:1.45;}
.peak-text.rebound-soon{color:var(--orange);font-weight:600;}
.peak-text.ended{color:var(--red);}
.finger-block{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
.finger-row{display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap;}
.finger-row-lbl{font-size:11px;color:var(--muted);width:44px;flex-shrink:0;}
.finger-chip{padding:6px 9px;border-radius:9px;cursor:pointer;font-size:12px;font-family:inherit;border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);}

function calcSleepDuration(schlafenAt,aufgestandenAt){
  // schlafenAt = time person went to sleep (may be after midnight, e.g. 02:00)
  // aufgestandenAt = time person woke up that morning
  // Sleep = wakeup - bedtime, but bedtime after midnight means add 24h to wakeup
  if(!schlafenAt||!aufgestandenAt)return null;
  const[sh,sm]=schlafenAt.split(":").map(Number);
  const[wh,wm]=aufgestandenAt.split(":").map(Number);
  let sleepMins=sh*60+sm;
  let wakeMins=wh*60+wm;
  // If bedtime is after midnight (0-6h), wakeup must be later that same day
  // sleepMins < 360 = before 6am => night before
  // We need: wakeup > bedtime. If not, bedtime is previous evening -> add 24h to wakeup.
  // Strategy: if sleepMins > wakeMins (e.g. 23:00 > 08:00), wakeup is next day.
  if(sleepMins > wakeMins) wakeMins += 1440;
  const dur = wakeMins - sleepMins;
  if(dur<=0||dur>1440)return null;
  return dur/60;
}
function calcWakeDuration(aufgestandenAt,schlafenAt){
  // Wake duration = from wakeup until bedtime (same evening, possibly after midnight)
  if(!aufgestandenAt||!schlafenAt)return null;
  const[wh,wm]=aufgestandenAt.split(":").map(Number);
  const[sh,sm]=schlafenAt.split(":").map(Number);
  let wakeMins=wh*60+wm;
  let sleepMins=sh*60+sm;
  // If bedtime is after midnight (sleepMins < 360 = before 6am), add 24h
  if(sleepMins < wakeMins) {
    // normal case: sleep after wake on same day
  } else if(sleepMins < 360) {
    // bedtime is early morning next day
    sleepMins += 1440;
  }
  let dur=sleepMins-wakeMins;
  if(dur<0)dur+=1440;
  if(dur<=0||dur>1440)return null;
  return dur/60;
}
function getPrevDate(dateStr){const d=new Date(dateStr+'T12:00');d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);}
function getSleepDurationForDate(date){
  // schlafenAt on a day's record = when they go to sleep THAT NIGHT (end of day).
  // Sleep that ended at aufgestandenAt started the PREVIOUS night → use prevDay.schlafenAt.
  const d=S.data[date];if(!d?.aufgestandenAt)return null;
  const prev=S.data[getPrevDate(date)];
  if(prev?.schlafenAt)return calcSleepDuration(prev.schlafenAt,d.aufgestandenAt);
  // Fallback for older entries where schlafenAt = last night's bedtime on same record:
  // only if bedtime is clearly evening (≥18h) or hour > wakeup hour (unambiguously last night)
  if(d?.schlafenAt){
    const sh=+d.schlafenAt.split(':')[0],wh=+d.aufgestandenAt.split(':')[0];
    if(sh>wh||sh>=18)return calcSleepDuration(d.schlafenAt,d.aufgestandenAt);
  }
  return null;
}
function loadSettings(){

const MIN_LEARN=3;
function hhmmToH(s){if(!s)return null;const[h,m]=String(s).split(":").map(Number);return h+(m||0)/60;}
function learnMedDuration(med,mfr){
  const samples=[];
  Object.keys(S.data).forEach(date=>{
    const d=S.data[date];
    if(!d||!d.takenAt||!d.medication||d.isPauseDay)return;
    if(med&&d.medication!==med)return;
    if(mfr&&(d.manufacturer||"")!==mfr)return;
    const mh=hhmmToH(d.takenAt);if(mh==null)return;
    const cks=Object.entries(d.checkins||{}).sort((a,b)=>+a[0]-+b[0]);
    const rb=cks.find(([h,c])=>+h>mh&&(c.events||[]).some(e=>e.type==="neg"&&(e.label.includes("Rebound")||e.label.includes("Wirkung weg"))));
    if(rb){const dur=+rb[0]-mh;if(dur>=2&&dur<=12)samples.push(dur);}
  });
  return{avg:samples.length?+(samples.reduce((a,b)=>a+b,0)/samples.length).toFixed(1):null,n:samples.length};
}
function getEffectiveMedDuration(med,mfr){
  const s=loadSettings();med=med||s.defaultMed||"Elvanse";mfr=mfr||"";
  const byMfr=s.medDurationsByMfr||{},key=med+"||"+mfr;
  if(mfr&&byMfr[key])return{h:byMfr[key],src:"präparat",n:null};
  if(mfr){const l=learnMedDuration(med,mfr);if(l.n>=MIN_LEARN)return{h:l.avg,src:"gelernt-präparat",n:l.n};}
  if((s.medDurations||{})[med])return{h:s.medDurations[med],src:"med",n:null};
  const lm=learnMedDuration(med,"");if(lm.n>=MIN_LEARN)return{h:lm.avg,src:"gelernt",n:lm.n};
  return{h:DEFAULT_MED_DURATIONS[med]||8,src:"standard",n:null};
}

function buildDayTimeline(date){
  const day=S.data[date]||{};
  return HOURS.map(h=>{
    const c=day.checkins?.[h];const pt={hour:h};
    METRICS.forEach(m=>{if(c?.symptoms?.[m.id])pt[m.id]=c.symptoms[m.id];});
    pt.events=c?.events||[];pt.hasMed=day.takenAt&&parseInt(day.takenAt)===h;
    return pt;
  });
}
function buildTrendData(metricId,days=14){
  const MINC=3;
  const allDays=Object.keys(S.data).sort().reverse().slice(0,days).reverse();
  return allDays.map(date=>{
    const vals=Object.values(S.data[date]?.checkins||{}).map(c=>c.symptoms?.[metricId]).filter(Boolean);
    const n=vals.length;
    return{date,n,avg:n>=MINC?(vals.reduce((a,b)=>a+b,0)/n):null};
  });
}
function buildMonthlyTrendData(metricId){
  const byM={};
  Object.keys(S.data).forEach(date=>{
    const vals=Object.values(S.data[date]?.checkins||{}).map(c=>c.symptoms?.[metricId]).filter(Boolean);
    if(vals.length<3)return;
    const mk=date.slice(0,7);
    if(!byM[mk])byM[mk]=[];
    byM[mk].push(vals.reduce((a,b)=>a+b,0)/vals.length);
  });
  const out=[],now=new Date();
  for(let i=11;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1),mk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,arr=byM[mk];
    out.push({label:d.toLocaleDateString("de-DE",{month:"short"}),value:arr&&arr.length?+(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(2):0});
  }
  return out;
}
function hourlyAvg(metricId){

function buildMedCompareData(mode="day"){
  const medGroups={};
  function groupKey(date,med){
    if(mode==="week"){const dt=new Date(date+"T12:00");return`${med} W${Math.ceil(dt.getDate()/7)}/${dt.getMonth()+1}`;}
    if(mode==="month"){const dt=new Date(date+"T12:00");return`${med} ${dt.toLocaleDateString("de-DE",{month:"short",year:"numeric"})}`;}
    return med;
  }
  Object.keys(S.data).forEach(date=>{
    const d=S.data[date];if(!d?.medication||d?.isBaseline)return;
    const key=groupKey(date,`${d.medication} ${d.dosage}`.trim());
    if(!medGroups[key])medGroups[key]={days:[],fVals:[],mVals:[],eVals:[],neg:0,pos:0,total:0};
    medGroups[key].days.push(date);
    Object.values(d.checkins||{}).forEach(c=>{
      medGroups[key].total++;
      if(c.symptoms?.focus)medGroups[key].fVals.push(c.symptoms.focus);
      if(c.symptoms?.mood)medGroups[key].mVals.push(c.symptoms.mood);
      if(c.symptoms?.energy)medGroups[key].eVals.push(c.symptoms.energy);
      (c.events||[]).forEach(e=>{if(e.type==="neg")medGroups[key].neg++;if(e.type==="pos")medGroups[key].pos++;});
    });
  });
  return Object.entries(medGroups).map(([name,g])=>({
    name,days:g.days.length,
    avgFocus:g.fVals.length?(g.fVals.reduce((a,b)=>a+b,0)/g.fVals.length).toFixed(1):"–",
    avgMood:g.mVals.length?(g.mVals.reduce((a,b)=>a+b,0)/g.mVals.length).toFixed(1):"–",
    avgEnergy:g.eVals.length?(g.eVals.reduce((a,b)=>a+b,0)/g.eVals.length).toFixed(1):"–",
    negRate:(g.neg/Math.max(g.total,1)).toFixed(2),posRate:(g.pos/Math.max(g.total,1)).toFixed(2),
  }));
}

function buildSleepTrendGraph(days=14){
  const W=360,H=140,PAD={t:8,r:10,b:34,l:28};const gW=W-PAD.l-PAD.r,gH=H-PAD.t-PAD.b;
  const data=[...buildSleepTrendData(days)].reverse();
  if(!data.some(d=>d.avg!=null))return"";
  const vals=data.filter(d=>d.avg!=null).map(d=>d.avg);
  const yMin=Math.max(0,Math.floor(Math.min(...vals)-0.5));
  const yMax=Math.ceil(Math.max(...vals)+0.5);
  const yRange=yMax-yMin||1;
  function xOf(i){return PAD.l+(i/(data.length-1||1))*gW;}
  function yOf(v){return PAD.t+gH-((v-yMin)/yRange)*gH;}
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;overflow:visible;">`;
  for(let s=0;s<=3;s++){const v=yMin+(yRange)*s/3;const y=yOf(v);svg+=`<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="#253050" stroke-width="1"/><text x="${PAD.l-4}" y="${y+4}" text-anchor="end" font-size="9" fill="#5a6890">${v.toFixed(0)}h</text>`;}
  const valid=data.map((d,i)=>({...d,i})).filter(d=>d.avg!=null);
  if(valid.length>1){let path=`M${xOf(valid[0].i)},${yOf(valid[0].avg)}`;for(let k=1;k<valid.length;k++){const mx=(xOf(valid[k-1].i)+xOf(valid[k].i))/2;path+=` C${mx},${yOf(valid[k-1].avg)} ${mx},${yOf(valid[k].avg)} ${xOf(valid[k].i)},${yOf(valid[k].avg)}`;}svg+=`<path d="${path}" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>`;}
  valid.forEach(pt=>{svg+=`<circle cx="${xOf(pt.i)}" cy="${yOf(pt.avg)}" r="3.5" fill="#60a5fa"/>`;});
  data.forEach((d,i)=>{
    if(i%2===0||i===data.length-1)svg+=`<text x="${xOf(i)}" y="${H-14}" text-anchor="middle" font-size="8" fill="#5a6890">${fmtDateXS(d.date)}</text>`;
    const dd=S.data[d.date];
    if(dd?.medication&&!dd?.isPauseDay)svg+=`<circle cx="${xOf(i)}" cy="${H-6}" r="3" fill="var(--purple)" opacity="0.8"/>`;
    else if(dd?.isPauseDay)svg+=`<text x="${xOf(i)}" y="${H-2}" text-anchor="middle" font-size="7" fill="var(--orange)">P</text>`;
  });
  return svg+"</svg>";
}
function getPainLocationFreq(locId,rangeKey){
  const now=new Date(),cutoff=new Date(now);
  if(rangeKey==="week")cutoff.setDate(now.getDate()-7);
  else if(rangeKey==="month")cutoff.setMonth(now.getMonth()-1);
  else cutoff.setFullYear(now.getFullYear()-1);
  const cutStr=cutoff.toISOString().slice(0,10);
  return Object.keys(S.data).filter(d=>d>=cutStr).sort().map(date=>{
    let count=0;
    Object.values(S.data[date]?.checkins||{}).forEach(c=>{if((c.painLocations||[]).includes(locId))count++;});
    return{date,count};
  });
}
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="class")e.className=v;
    else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  });
  kids.flat().forEach(c=>{if(c==null)return;typeof c==="string"||typeof c==="number"?e.appendChild(document.createTextNode(String(c))):e.appendChild(c);});
  return e;
}

function trendFactorsForDate(date){
  const dd=S.data[date];if(!dd)return[];
  const ctx=dd.dayCtx||{},f=[];
  if(ctx.stress)f.push("🔴 Viel Stress");
  if(ctx.arbeit)f.push("🏢 Arbeitstag");
  CTX_TAGS.filter(t=>t.id!=="arbeit"&&ctx[t.id]).forEach(t=>f.push(t.label));
  if(dd.medication&&!dd.isPauseDay)f.push(`💊 ${dd.medication}${dd.dosage?" "+dd.dosage:""}${dd.takenAt?" · "+dd.takenAt:""}`);
  else if(dd.isPauseDay)f.push("⏸ Medikations-Pause");
  const cks=Object.values(dd.checkins||{});
  if(cks.some(c=>c.healthFlags?.sport))f.push("💪 Sport gemacht");
  if(cks.some(c=>c.healthFlags?.gelenke))f.push("🦵 Gelenkschmerzen");
  if(cks.some(c=>(c.ibuprofenMg||0)>0))f.push("💊 Ibuprofen");
  return f;
}
window._trendTip=function(ev,date){
  if(ev&&ev.stopPropagation)ev.stopPropagation();

  if(!tip){tip=document.createElement("div");tip.id="trend-tip";tip.className="trend-tip";document.body.appendChild(tip);}
  const facs=trendFactorsForDate(date);
  tip.innerHTML=`<div class="tt-date">${fmtDateS(date)}</div>`+(facs.length?facs.map(t=>`<div class="tt-row">${t}</div>`).join(""):`<div class="tt-none">Keine besonderen Faktoren</div>`);
  tip.style.display="block";
  const px=(ev&&(ev.clientX??(ev.touches&&ev.touches[0]?.clientX)))||0;
  const py=(ev&&(ev.clientY??(ev.touches&&ev.touches[0]?.clientY)))||0;
  const pad=10,w=tip.offsetWidth,h=tip.offsetHeight;
  let x=px+12,y=py+12;
  if(x+w+pad>window.innerWidth)x=Math.max(pad,window.innerWidth-w-pad);
  if(y+h+pad>window.innerHeight)y=Math.max(pad,py-h-12);
  tip.style.left=x+"px";tip.style.top=y+"px";
  clearTimeout(window._trendTipT);
  window._trendTipT=setTimeout(window._trendTipHide,2800); // auf Mobile nach Tippen automatisch ausblenden
};

function buildReportData(){
  const allDays=Object.keys(S.data).sort().reverse();
  const checks=allCheckins();
  const today=new Date().toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
  const wDays=allDays.filter(d=>S.data[d]?.gewicht).sort();
  const startWeight=wDays.length?+S.data[wDays[0]].gewicht:null;
  const currentWeight=wDays.length?+S.data[wDays[wDays.length-1]].gewicht:null;
  const weightDiff=startWeight&&currentWeight?(currentWeight-startWeight).toFixed(1):null;
  const bpDays=allDays.filter(d=>S.data[d]?.sys&&S.data[d]?.dia);
  const avgSys=bpDays.length?Math.round(bpDays.reduce((s,d)=>s+(+S.data[d].sys),0)/bpDays.length):null;
  const avgDia=bpDays.length?Math.round(bpDays.reduce((s,d)=>s+(+S.data[d].dia),0)/bpDays.length):null;
  const pDays=allDays.filter(d=>S.data[d]?.puls);
  const avgPuls=pDays.length?Math.round(pDays.reduce((s,d)=>s+(+S.data[d].puls),0)/pDays.length):null;
  const wirkDauern=[];
  allDays.forEach(date=>{
    const d=S.data[date];if(!d?.takenAt)return;
    const mh=parseFloat(d.takenAt.split(":").reduce((h,m,i)=>i===0?+h:+h+m/60));
    const cks=Object.entries(d.checkins||{}).sort((a,b)=>+a[0]-+b[0]);
    const rb=cks.find(([h,c])=>+h>mh&&(c.events||[]).some(e=>e.type==="neg"&&(e.label.includes("Rebound")||e.label.includes("Wirkung weg"))));
    if(rb){const dur=+rb[0]-mh;if(dur>=2&&dur<=12)wirkDauern.push(dur);}
  });
  const avgWirkDauer=wirkDauern.length?(wirkDauern.reduce((a,b)=>a+b,0)/wirkDauern.length).toFixed(1):null;
  const baselineAvg=getBaselineFocusAvg();
  const fMedVals=[];
  allDays.forEach(date=>{
    const d=S.data[date];if(!d?.medication||d?.isBaseline)return;
    const vs=Object.values(d.checkins||{}).map(c=>c.symptoms?.focus).filter(Boolean);
    if(vs.length)fMedVals.push(vs.reduce((a,b)=>a+b,0)/vs.length);
  });
  const avgFMed=fMedVals.length?fMedVals.reduce((a,b)=>a+b,0)/fMedVals.length:null;
  const fokusDiff=(avgFMed&&baselineAvg)?Math.round((avgFMed-baselineAvg)/baselineAvg*100):null;
  const rHours=[];
  allDays.forEach(date=>{Object.entries(S.data[date]?.checkins||{}).forEach(([h,c])=>{if((c.events||[]).some(e=>e.type==="neg"&&(e.label.includes("Rebound")||e.label.includes("Wirkung weg"))))rHours.push(+h);});});
  const sortedDays=[...allDays].sort();
  const sfPairs=[];
  sortedDays.forEach((date,i)=>{
    const d=S.data[date];if(!d?.aufgestandenAt)return;
    const next=sortedDays[i+1];if(!next)return;
    const dur=getSleepDurationForDate(date);
    const nf=avg(Object.values(S.data[next]?.checkins||{}).map(c=>c.symptoms?.focus).filter(Boolean));
    if(nf&&dur>2&&dur<14)sfPairs.push({sleep:dur,focus:nf});
  });
  let sleepCorr=null;const sfN=sfPairs.length;
  if(sfN>=14){
    const ms=sfPairs.reduce((a,p)=>a+p.sleep,0)/sfN,mf=sfPairs.reduce((a,p)=>a+p.focus,0)/sfN;
    const num=sfPairs.reduce((a,p)=>a+(p.sleep-ms)*(p.focus-mf),0);
    const den=Math.sqrt(sfPairs.reduce((a,p)=>a+(p.sleep-ms)**2,0)*sfPairs.reduce((a,p)=>a+(p.focus-mf)**2,0));
    sleepCorr=den>0?(num/den).toFixed(2):null;
  }
  const avgSleepDur=sfPairs.length?(sfPairs.reduce((a,p)=>a+p.sleep,0)/sfPairs.length).toFixed(1):null;
  const sleepTagCorrs={},sleepTagCorrNs={};
  SLEEP_TAGS.forEach(tag=>{
    const pairs=[];
    sortedDays.forEach((date,i)=>{
      const next=sortedDays[i+1];if(!next)return;
      const hasTag=Object.values(S.data[date]?.checkins||{}).some(c=>c.sleepTags?.[tag.id]);
      const nf=avg(Object.values(S.data[next]?.checkins||{}).map(c=>c.symptoms?.focus).filter(Boolean));
      if(nf!=null)pairs.push({x:hasTag?1:0,y:nf});
    });
    sleepTagCorrNs[tag.id]=pairs.length;
    if(pairs.length>=14){
      const n=pairs.length,mx=pairs.reduce((a,p)=>a+p.x,0)/n,my=pairs.reduce((a,p)=>a+p.y,0)/n;
      const num=pairs.reduce((a,p)=>a+(p.x-mx)*(p.y-my),0);
      const den=Math.sqrt(pairs.reduce((a,p)=>a+(p.x-mx)**2,0)*pairs.reduce((a,p)=>a+(p.y-my)**2,0));
      sleepTagCorrs[tag.id]=den>0?(num/den).toFixed(2):null;
    }
  });
  const hfCounts={};
  allDays.forEach(d=>{Object.values(S.data[d]?.checkins||{}).forEach(c=>{Object.entries(c.healthFlags||{}).forEach(([id,v])=>{if(v)hfCounts[id]=(hfCounts[id]||0)+1;});});});
  const topFlags=HEALTH_FLAGS.map(f=>({label:f.icon+" "+f.label,count:hfCounts[f.id]||0})).filter(f=>f.count>0).sort((a,b)=>b.count-a.count).slice(0,4);
  const latestMed=allDays.find(d=>S.data[d]?.medication&&!S.data[d]?.isBaseline);
  const currentMed=latestMed?`${S.data[latestMed].medication} ${S.data[latestMed].dosage}`.trim():"k. A.";
  const medHistory={};
  allDays.forEach(date=>{const d=S.data[date];if(!d?.medication||d?.isBaseline||d?.isPauseDay)return;const k=`${d.medication} ${d.dosage}`.trim();medHistory[k]=(medHistory[k]||0)+1;});
  const last3=allDays.slice(0,3).reverse();
  const last3Detail=last3.map(date=>{
    const d=S.data[date]||{};
    const fVals=Object.values(d.checkins||{}).map(c=>c.symptoms?.focus).filter(Boolean);
    const mVals=Object.values(d.checkins||{}).map(c=>c.symptoms?.mood).filter(Boolean);
    const eVals=Object.values(d.checkins||{}).map(c=>c.symptoms?.energy).filter(Boolean);
    const dur=getSleepDurationForDate(date);
    return{date,medication:d.isPauseDay?"PAUSE":(d.medication?`${d.medication} ${d.dosage}`.trim():"–"),
      takenAt:d.takenAt||"–",avgFocus:fVals.length?(fVals.reduce((a,b)=>a+b,0)/fVals.length).toFixed(1):"–",
      avgMood:mVals.length?(mVals.reduce((a,b)=>a+b,0)/mVals.length).toFixed(1):"–",
      avgEnergy:eVals.length?(eVals.reduce((a,b)=>a+b,0)/eVals.length).toFixed(1):"–",
      schlafenAt:d.schlafenAt||"–",aufgestandenAt:d.aufgestandenAt||"–",
      sleepDur:dur?dur.toFixed(1)+"h":"–",sys:d.sys||"–",dia:d.dia||"–",puls:d.puls||"–",
      sysPeak:d.sysPeak||"",diaPeak:d.diaPeak||"",gewicht:d.gewicht||"–"};
  });
  return{today,allDays,totalCheckins:checks.length,startWeight,currentWeight,weightDiff,
    avgSys,avgDia,avgPuls,bpDays,avgWirkDauer,wirkDauern,avgFMed,avgFNoMed:baselineAvg,fokusDiff,
    reboundHours:rHours,reboundMin:rHours.length?Math.min(...rHours):null,reboundMax:rHours.length?Math.max(...rHours):null,
    reboundAvg:rHours.length?Math.round(rHours.reduce((a,b)=>a+b,0)/rHours.length):null,
    sleepCorr,avgSleepDur,sleepFocusPairs:sfPairs,sleepTagCorrs,sleepTagCorrNs,topFlags,
    currentMed,baselineDayCount:getBaselineDays().length,pauseDayCount:allDays.filter(d=>S.data[d]?.isPauseDay).length,
    medHistory,last3Detail};
}

function exportJSON(){const b=new Blob([JSON.stringify(S.data,null,2)],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=`focuslog-${todayStr()}.json`;a.click();URL.revokeObjectURL(u);}
function importJSON(str){
  try{
    if(!str?.trim())throw new Error("empty");
    const p=JSON.parse(str);
    if(typeof p!=="object"||p===null||Array.isArray(p))throw new Error("invalid");
    S.data=p;persist(p);set({showImport:false});showToast("✓ Wiederhergestellt!");
  }catch(err){alert("Ungültiges Format: "+err.message);}
}
function exportCSV(){
  const allDays=Object.keys(S.data).sort();
  const DOW=["So","Mo","Di","Mi","Do","Fr","Sa"];
  const rows=["Datum;Wochentag;Medikament;Dosis;Krank;Schlafzeit (Std);Wachzeit (Std);Fokus (Avg);Stimmung (Avg);Energie (Avg);Gelenkschmerzen;Ibuprofen (mg);Sport"];
  allDays.forEach(date=>{
    const d=S.data[date]||{};
    const dt=new Date(date+"T12:00");
    const dow=DOW[dt.getDay()];
    const med=d.isPauseDay?"PAUSE":(d.medication||"");
    const dosis=d.isPauseDay?"":(d.dosage||"");
    const krank=d.isSick?"Ja":"Nein";
    const schlaf=getSleepDurationForDate(date);
    const wach=calcWakeDuration(d.aufgestandenAt,d.schlafenAt);
    const cks=Object.values(d.checkins||{});
    const fVals=cks.map(c=>c.symptoms?.focus).filter(Boolean);
    const mVals=cks.map(c=>c.symptoms?.mood).filter(Boolean);
    const eVals=cks.map(c=>c.symptoms?.energy).filter(Boolean);
    const fokusAvg=fVals.length?(fVals.reduce((a,b)=>a+b,0)/fVals.length).toFixed(2):"";
    const moodAvg=mVals.length?(mVals.reduce((a,b)=>a+b,0)/mVals.length).toFixed(2):"";
    const energyAvg=eVals.length?(eVals.reduce((a,b)=>a+b,0)/eVals.length).toFixed(2):"";
    const gelenke=cks.some(c=>c.healthFlags?.gelenke)?"Ja":"Nein";
    let ibuTotal=0;cks.forEach(c=>{if(c.ibuprofenMg)ibuTotal+=c.ibuprofenMg;});
    const sport=cks.some(c=>c.healthFlags?.sport)?"Ja":"Nein";
    rows.push([date,dow,med,dosis,krank,schlaf?schlaf.toFixed(1):"",wach?wach.toFixed(1):"",fokusAvg,moodAvg,energyAvg,gelenke,ibuTotal||"",sport].join(";"));
  });
  const bom="\uFEFF";
  const b=new Blob([bom+rows.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=`focuslog-export-${todayStr()}.csv`;a.click();URL.revokeObjectURL(u);
  showToast("✓ CSV exportiert!");
}

        const d=calcSleepDuration(f.schlafenAt||day.schlafenAt,f.aufgestandenAt||day.aufgestandenAt);

  else if(S.tab==="stats")view=renderStats();
  if(view)app.appendChild(view);
  const modal=renderMedModal();if(modal)app.appendChild(modal);
  const sm=renderSettingsModal();if(sm)app.appendChild(sm);
  if(S.checkinHour===null){
    app.appendChild(el("nav",{},...[{id:"today",icon:"🏠",label:"Heute"},{id:"history",icon:"📅",label:"Verlauf"},{id:"stats",icon:"📊",label:"Auswertung"}].map(({id,icon,label})=>el("button",{class:"nav-btn"+(S.tab===id?" active":""),onClick:()=>set({tab:id,selDate:todayStr()})},el("span",{class:"nav-icon"},icon),label))));
  }
}
render();
setInterval(()=>{if(S.tab==="today"&&S.checkinHour===null&&!S.showMed&&!S.showSettings&&S.data[todayStr()]&&S.data[todayStr()].takenAt)render();},60000);
</script>
</body>
</html>
