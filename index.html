<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ADHS Tagebuch">
<title>ADHS Tagebuch</title>
<style>
:root {
  --bg:#0a0e1a; --surface:#12172a; --card:#161d30; --border:#253050;
  --accent:#60a5fa; --accentL:#93c5fd;
  --green:#4ade80; --red:#ff7070; --yellow:#fcd34d; --orange:#fdba74;
  --purple:#c084fc; --pink:#f472b6;
  --text:#f4f7ff; --muted:#94a8c8; --dim:#1e2840;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  min-height:100vh;max-width:430px;margin:0 auto;padding-bottom:calc(80px + env(safe-area-inset-bottom));font-size:16px;}

/* ── Topbar */
.topbar{padding:52px 20px 12px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--bg) 70%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
.topbar h1{font-size:28px;font-weight:700;}
.sub{font-size:13px;color:var(--muted);margin-top:3px;}

/* ── Layout */
.section{padding:0 16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;overflow:hidden;}
.card-label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px;margin-top:0;}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;overflow:hidden;}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;overflow:hidden;}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;overflow:hidden;}
@media(max-width:320px){
  .row4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .row3{grid-template-columns:repeat(2,minmax(0,1fr));}
}

/* ── Buttons */
.btn{width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;
  color:#fff;cursor:pointer;font-family:inherit;}
.btn.primary{background:var(--accent);}
.btn.green{background:var(--green);color:#0a0e1a;}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:13px;margin-top:8px;}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:10px;width:auto;}
.btn.sm.active{background:rgba(96,165,250,.2);border:1px solid var(--accent);color:var(--accentL);}
.btn.sm.ghost-sm{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn:disabled{opacity:.4;cursor:default;}

/* ── Inputs */
input,textarea,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:12px;padding:13px 15px;color:var(--text);font-size:16px;font-family:inherit;outline:none;
  box-sizing:border-box;min-width:0;-webkit-appearance:none;appearance:none;}
select{background:#161d30;-webkit-appearance:none;appearance:none;}
textarea{min-height:70px;resize:vertical;line-height:1.6;}
/* iOS time/date: overflow:hidden + max-width:100% zwingt den Browser,
   den Input in seinen Container zu quetschen */
input[type=time],input[type=date]{padding:10px 8px;font-size:14px;max-width:100%;overflow:hidden;}

/* ── Scale buttons */
.scale-row{display:flex;gap:6px;}
.scale-btn{flex:1;padding:12px 0;border-radius:10px;cursor:pointer;font-size:17px;font-weight:700;
  border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);font-family:inherit;}

/* ── Date strip */
.date-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.date-strip::-webkit-scrollbar{display:none;}
.date-pill{display:flex;flex-direction:column;align-items:center;padding:8px 12px;border-radius:12px;
  cursor:pointer;border:1.5px solid var(--border);background:transparent;min-width:52px;font-family:inherit;}
.date-pill.active{background:rgba(96,165,250,.18);border-color:var(--accent);}
.date-pill.has-data{border-color:var(--green);}
.date-pill-dow{font-size:11px;color:var(--muted);}
.date-pill-day{font-size:18px;font-weight:700;}
.date-pill-dot{width:5px;height:5px;border-radius:50%;background:var(--green);margin-top:2px;}

/* ── Medication button */
.med-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;
  padding:10px 16px;cursor:pointer;color:var(--muted);font-size:14px;font-family:inherit;}
.med-btn.has-med{background:rgba(96,165,250,.15);border-color:var(--accent);color:var(--accentL);}

/* ── Timeline */
.timeline-scroll{overflow-x:auto;padding-bottom:4px;}
.timeline-row{display:flex;gap:6px;min-width:max-content;padding-bottom:4px;}
.hour-dot{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:36px;}
.hour-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;border:1.5px dashed var(--dim);background:transparent;color:var(--muted);position:relative;}
.hour-label{font-size:9px;color:var(--muted);}
.med-badge{position:absolute;top:-5px;right:-4px;font-size:10px;}

/* ── Entry list */
.entry-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.entry-row:last-child{border-bottom:none;}
.entry-time{font-size:14px;color:var(--muted);min-width:40px;padding-top:2px;}
.entry-tags{display:flex;flex-wrap:wrap;gap:4px;flex:1;}
.etag{font-size:12px;border-radius:6px;padding:3px 8px;}
.entry-note{font-size:13px;color:var(--muted);margin-top:3px;}

/* ── Event chips */
.event-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;
  font-size:13px;cursor:pointer;border:1.5px solid transparent;font-family:inherit;background:rgba(255,255,255,.04);
  border-color:var(--border);color:var(--muted);}
.event-chip.pos{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.4);color:var(--green);}
.event-chip.neg{background:rgba(255,112,112,.1);border-color:rgba(255,112,112,.4);color:var(--red);}
.event-chip.caff{background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.4);color:var(--accentL);}
.event-chip.food{background:rgba(253,186,116,.1);border-color:rgba(253,186,116,.4);color:var(--orange);}
.event-chip.med{background:rgba(192,132,252,.1);border-color:rgba(192,132,252,.4);color:var(--purple);}
.event-chip.health{background:rgba(148,168,200,.1);border-color:rgba(148,168,200,.3);color:var(--muted);}
.chip-del{cursor:pointer;opacity:.6;margin-left:3px;font-size:15px;}
.chips-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}

/* ── Health checkboxes */
.health-checks{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.hcheck{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  cursor:pointer;border:1.5px solid var(--border);background:rgba(255,255,255,.03);}
.hcheck.on{background:rgba(148,168,200,.1);border-color:rgba(148,168,200,.4);}
.hcheck-icon{font-size:18px;min-width:24px;text-align:center;}
.hcheck-label{font-size:14px;color:var(--muted);flex:1;}
.hcheck.on .hcheck-label{color:var(--text);}
.hcheck-box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.hcheck.on .hcheck-box{background:rgba(148,168,200,.3);border-color:var(--muted);}

/* ── Preset buttons */
.preset-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.preset-btn{padding:7px 13px;border-radius:20px;cursor:pointer;font-size:13px;font-family:inherit;
  border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);}

/* ── SVG Graph */
.graph-wrap{overflow-x:auto;padding-bottom:4px;}
.graph-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);}
.legend-dot{width:10px;height:10px;border-radius:50%;}
.legend-line{width:18px;height:3px;border-radius:2px;}

/* ── Stat tabs */
.stat-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
.stat-tabs::-webkit-scrollbar{display:none;}
.stat-tab{padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;
  white-space:nowrap;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:inherit;}
.stat-tab.active{background:rgba(96,165,250,.18);border-color:var(--accent);color:var(--accentL);}

/* ── Insight cards */
.insight{border-radius:16px;padding:16px;margin-bottom:10px;border:1px solid;}
.insight.pos{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.3);}
.insight.warn{background:rgba(252,211,77,.08);border-color:rgba(252,211,77,.3);}
.insight.info{background:rgba(96,165,250,.08);border-color:rgba(96,165,250,.3);}
.insight-icon{font-size:20px;margin-bottom:5px;}
.insight-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.insight-title.pos{color:var(--green);}
.insight-title.warn{color:var(--yellow);}
.insight-title.info{color:var(--accentL);}
.insight-text{font-size:13px;color:var(--muted);line-height:1.6;}

/* ── Stat bar */
.sbar-wrap{min-height:5px;height:5px;background:var(--dim);border-radius:4px;overflow:hidden;margin-top:4px;}
.sbar-fill{height:100%;border-radius:4px;}

/* ── Stat mini card */
.mini-stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 8px;text-align:center;}
.mini-stat-num{font-size:26px;font-weight:800;}
.mini-stat-lbl{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em;}

/* ── Best hour */
.best-card{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);border-radius:16px;padding:16px;margin-bottom:10px;}

/* ── Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:flex;align-items:flex-end;}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:430px;margin:0 auto;
  padding:24px 20px calc(40px + env(safe-area-inset-bottom));border:1px solid var(--border);
  max-height:90vh;overflow-y:auto;box-sizing:border-box;}
.sheet input,.sheet select,.sheet textarea{margin-bottom:2px;}
.sheet-title{font-size:20px;font-weight:700;margin-bottom:18px;}

/* ── Nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  background:rgba(10,14,26,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);display:flex;justify-content:space-around;
  padding:10px 0 calc(28px + env(safe-area-inset-bottom));z-index:50;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;
  background:none;color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 10px;font-family:inherit;}
.nav-btn.active{color:var(--accentL);}
.nav-icon{font-size:26px;}

/* ── Empty */
.empty{text-align:center;padding:60px 0;color:var(--muted);}
.empty-icon{font-size:48px;margin-bottom:12px;}

/* ── Toast */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--green);
  color:#0a0e1a;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:700;z-index:300;
  animation:fadeInOut 2s forwards;}
@keyframes fadeInOut{
  0%{opacity:0;transform:translateX(-50%) translateY(-8px);}
  15%{opacity:1;transform:translateX(-50%) translateY(0);}
  75%{opacity:1;}100%{opacity:0;}
}

/* ── Backup */
.backup-card{background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.2);border-radius:16px;padding:16px;margin-bottom:10px;}
.backup-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.bup-btn{flex:1;min-width:80px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;
  padding:13px 8px;cursor:pointer;font-family:inherit;color:var(--text);font-size:13px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:5px;box-sizing:border-box;}
.bup-icon{font-size:24px;}
.import-area{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;
  padding:12px;color:var(--text);font-size:13px;font-family:'Courier New',monospace;outline:none;
  min-height:80px;resize:vertical;margin-top:8px;line-height:1.5;}
.report-box{font-family:'Courier New',monospace;font-size:12px;line-height:1.8;color:var(--muted);
  white-space:pre-wrap;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;}

/* ── Seg control */
.seg{display:flex;background:var(--dim);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px;}
.seg-btn{flex:1;padding:8px;border-radius:9px;border:none;cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:600;color:var(--muted);background:transparent;}
.seg-btn.active{background:var(--card);color:var(--text);}

/* ── Checkin category label */
.cat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px;display:block;}

/* ── Vital inline inputs */
.vital-row{display:grid;gap:8px;margin-top:6px;}
/* overflow:hidden auf dem Kind-Element zwingt iOS dazu, time/date-Inputs
   in die Grid-Spalte zu quetschen statt den Container zu sprengen */
.vital-field{display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden;}
.vital-field label{font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.07em;white-space:normal;word-break:break-word;line-height:1.3;}
.vital-field input{padding:10px 8px;font-size:14px;min-width:0;width:100%;
  -webkit-appearance:none;appearance:none;overflow:hidden;}

/* ── Print Stylesheet (DIN A4) ─────────────────────────────────────────────── */
#print-report-overlay{display:none;}
@media print{
  /* Alles ausblenden */
  body > #app{display:none!important;}
  nav{display:none!important;}
  .toast{display:none!important;}
  /* Druckbereich einblenden */
  #print-report-overlay{
    display:block!important;
    position:fixed;inset:0;z-index:9999;
    background:#fff;color:#000;
    font-family:Arial,Helvetica,sans-serif;
    font-size:11pt;line-height:1.7;
    padding:18mm 20mm 18mm 20mm;
    box-sizing:border-box;
  }
  #print-report-overlay h1{
    font-size:15pt;font-weight:700;border-bottom:2px solid #000;
    padding-bottom:4pt;margin-bottom:10pt;letter-spacing:0.03em;
  }
  #print-report-overlay h2{
    font-size:11pt;font-weight:700;margin-top:14pt;margin-bottom:4pt;
    text-transform:uppercase;letter-spacing:0.07em;
    border-bottom:1px solid #aaa;padding-bottom:2pt;
  }
  #print-report-overlay .pr-meta{
    font-size:9pt;color:#555;margin-bottom:10pt;
  }
  #print-report-overlay .pr-row{
    display:flex;gap:32pt;margin-bottom:5pt;flex-wrap:wrap;
  }
  #print-report-overlay .pr-kv{min-width:140pt;}
  #print-report-overlay .pr-label{font-size:8.5pt;color:#555;text-transform:uppercase;letter-spacing:0.05em;}
  #print-report-overlay .pr-value{font-size:13pt;font-weight:700;color:#000;}
  #print-report-overlay .pr-divider{
    border:none;border-top:1px solid #ccc;margin:10pt 0;
  }
  #print-report-overlay .pr-list{margin:0;padding-left:14pt;}
  #print-report-overlay .pr-list li{margin-bottom:3pt;}
  #print-report-overlay .pr-note{
    font-size:8.5pt;color:#666;margin-top:10pt;border-top:1px solid #ddd;padding-top:8pt;
  }
  @page{size:A4 portrait;margin:0;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print-report-overlay"></div>
<script>
// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const SK = "adhs_v4";
// 01–24 Uhr (1–24)
const HOURS = Array.from({length:24},(_,i)=>i+1);

const MEDS_PRESET = ["Methylphenidat","Elvanse","Ritalin","Concerta","Medikinet","Strattera","Intuniv"];

const METRICS = [
  {id:"focus",   label:"Fokus",        icon:"🎯", color:"#60a5fa", inv:false},
  {id:"mood",    label:"Stimmung",     icon:"😊", color:"#4ade80", inv:false},
  {id:"energy",  label:"Energie",      icon:"🔋", color:"#fcd34d", inv:false},
  {id:"unrest",  label:"Innere Unruhe",icon:"⚡", color:"#fb923c", inv:true},
  {id:"impulse", label:"Impulsivität", icon:"💥", color:"#f472b6", inv:true},
  {id:"hunger",  label:"Hunger",       icon:"🍽️", color:"#a78bfa", inv:false},
];

const SCALE_LABELS = ["","Sehr wenig","Wenig","Mittel","Gut","Sehr stark"];

const HEALTH_FLAGS = [
  {id:"verdauung", icon:"🪠", label:"Verdauungsprobleme"},
  {id:"gelenke",   icon:"🦵", label:"Knie- und Gelenkschmerzen"},
  {id:"depression",icon:"🌧️", label:"Depressive Gedanken"},
];

const EV_POS = ["Sehr fokussiert","Im Flow","Sehr motiviert","Entspannt","Gute Laune","Emotional stabil","Organisiert","Sozial präsent","Aufgaben erledigt","Kreativ"];
const EV_NEG = ["Reizbar","Traurig","Ängstlich","Rebound","Crash","Überwältigt","Aggressiv","Wirkung weg","Herzrasen","Kopfschmerzen","Übelkeit","Schwindel","Mund trocken","Schlafprobleme"];
const EV_CAFF= ["Kaffee","Matcha","Grüntee","Schwarztee","Energy Drink","Cola"];
const EV_FOOD= ["Frühstück","Mittagessen","Abendessen","Snack","Süßes","Obst","Proteinreich","Kohlenhydratreich"];

const EV_COLORS = {pos:"var(--green)",neg:"var(--red)",caff:"var(--accentL)",food:"var(--orange)",med:"var(--purple)"};

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function load(){try{return JSON.parse(localStorage.getItem(SK)||"{}");}catch{return {};}}
function persist(d){try{localStorage.setItem(SK,JSON.stringify(d));}catch{}}
function todayStr(){return new Date().toISOString().slice(0,10);}
function nowHour(){return new Date().getHours()||24;}
function fmtDate(d){return new Date(d+"T12:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});}
function fmtDateS(d){return new Date(d+"T12:00").toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"});}
function fmtDateXS(d){const dt=new Date(d+"T12:00");return`${dt.getDate()}.${dt.getMonth()+1}`;}
function ratingColor(v,inv){const val=inv?6-v:v;if(val<=1)return"#ff7070";if(val===2)return"#fb923c";if(val===3)return"#fcd34d";if(val===4)return"#86efac";return"#4ade80";}
function getLast7(){const a=[];for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()-i);a.push(d.toISOString().slice(0,10));}return a;}
function avg(arr){return arr.length?(arr.reduce((a,b)=>a+b,0)/arr.length):null;}

// ─── STATE ────────────────────────────────────────────────────────────────────
let S = {
  tab:"today", data:load(), selDate:todayStr(),
  checkinHour:null, draft:null, saved:false,
  showMed:false, medForm:{medication:"",dosage:"",takenAt:"",manufacturer:""},
  statsTab:"graph", graphMetrics:["focus","mood","energy"],
  compareMode:false, showImport:false,
  medViewMode:"day", // day|week|month for compare tab
  bodyStatsRange:"month", // week|month|year for body stats
};
function set(u){Object.assign(S,u);render();}

// ─── DATA ACTIONS ─────────────────────────────────────────────────────────────
function openCheckin(hour){
  const ex=S.data[S.selDate]?.checkins?.[hour]||{symptoms:{},events:[],note:"",healthFlags:{}};
  set({checkinHour:hour,draft:{
    symptoms:{...ex.symptoms},
    events:[...(ex.events||[])],
    note:ex.note||"",
    healthFlags:{...(ex.healthFlags||{})}
  }});
}
function saveCheckin(){
  const d=S.data;
  if(!d[S.selDate])d[S.selDate]={checkins:{}};
  if(!d[S.selDate].checkins)d[S.selDate].checkins={};
  d[S.selDate].checkins[S.checkinHour]={...S.draft};
  S.data=d; persist(d);
  set({saved:true});
  setTimeout(()=>set({saved:false,checkinHour:null,draft:null}),1200);
}
function saveMed(){
  const d=S.data;
  if(!d[S.selDate])d[S.selDate]={checkins:{}};
  Object.assign(d[S.selDate],S.medForm);
  S.data=d; persist(d); set({showMed:false});
}
function saveVitals(vitals){
  const d=S.data;
  if(!d[S.selDate])d[S.selDate]={checkins:{}};
  Object.assign(d[S.selDate],vitals);
  S.data=d; persist(d);
}
function deleteCheckin(hour){
  const d=S.data;
  if(d[S.selDate]?.checkins?.[hour])delete d[S.selDate].checkins[hour];
  S.data=d; persist(d); set({checkinHour:null,draft:null});
}
function addEvent(type,label){
  if(!label.trim())return;
  S.draft={...S.draft,events:[...(S.draft.events||[]),{type,label:label.trim()}]};
  render();
}
function removeEvent(i){
  S.draft={...S.draft,events:S.draft.events.filter((_,j)=>j!==i)};
  render();
}
function setSym(id,v){S.draft={...S.draft,symptoms:{...S.draft.symptoms,[id]:v}};render();}
function toggleHealthFlag(id){
  const cur=S.draft.healthFlags||{};
  S.draft={...S.draft,healthFlags:{...cur,[id]:!cur[id]}};
  render();
}

// ─── STATS HELPERS ────────────────────────────────────────────────────────────
function allCheckins(){return Object.keys(S.data).flatMap(d=>Object.values(S.data[d]?.checkins||{}));}
function avgStat(id){const v=allCheckins().map(c=>c.symptoms?.[id]).filter(Boolean);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):"–";}

function buildDayTimeline(date){
  const day=S.data[date]||{};
  return HOURS.map(h=>{
    const c=day.checkins?.[h];
    const pt={hour:h};
    METRICS.forEach(m=>{if(c?.symptoms?.[m.id])pt[m.id]=c.symptoms[m.id];});
    pt.events=c?.events||[];
    pt.hasMed=day.takenAt&&parseInt(day.takenAt)===h;
    return pt;
  });
}

function buildTrendData(metricId,days=14){
  // sorted descending: index 0 = newest (LEFT on graph)
  const allDays=Object.keys(S.data).sort().reverse().slice(0,days).reverse();
  return allDays.map(date=>{
    const checks=Object.values(S.data[date]?.checkins||{});
    const vals=checks.map(c=>c.symptoms?.[metricId]).filter(Boolean);
    return{date,avg:vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length):null};
  });
}

function hourlyAvg(metricId){
  const byH={};
  Object.keys(S.data).forEach(date=>{
    Object.entries(S.data[date]?.checkins||{}).forEach(([h,c])=>{
      if(c.symptoms?.[metricId]){if(!byH[h])byH[h]=[];byH[h].push(c.symptoms[metricId]);}
    });
  });
  return HOURS.map(h=>({hour:h,avg:byH[h]?(byH[h].reduce((a,b)=>a+b,0)/byH[h].length):null}));
}

function getBestHour(){
  const ha=hourlyAvg("focus").filter(h=>h.avg);
  return ha.length?ha.reduce((b,h)=>h.avg>b.avg?h:b,ha[0]):null;
}

function eventCounts(){
  const counts={};
  allCheckins().forEach(c=>(c.events||[]).forEach(e=>{
    const k=e.type+":"+e.label;
    counts[k]=(counts[k]||0)+1;
  }));
  return counts;
}

// ── Body data series (weight, BP) ─────────────────────────────────────────────
function getBodySeries(rangeKey){
  const now=new Date();
  let cutoff=new Date(now);
  if(rangeKey==="week")cutoff.setDate(now.getDate()-7);
  else if(rangeKey==="month")cutoff.setMonth(now.getMonth()-1);
  else cutoff.setFullYear(now.getFullYear()-1);
  const cutStr=cutoff.toISOString().slice(0,10);
  return Object.keys(S.data).filter(d=>d>=cutStr).sort();
}

// ── Insights ──────────────────────────────────────────────────────────────────
function generateInsights(){
  const ins=[];
  const checks=allCheckins();
  if(checks.length<4)return[];
  const best=getBestHour();
  if(best)ins.push({type:"pos",icon:"🕐",title:`Beste Wirkungszeit: ~${best.hour}:00 Uhr`,
    text:`Dein Fokus-Durchschnitt ist um ${best.hour}:00 am höchsten (${best.avg.toFixed(1)}/5). Das ist dein optimales Wirkungsfenster.`});

  const reboundC=checks.filter(c=>(c.events||[]).some(e=>e.type==="neg"&&(e.label.includes("Rebound")||e.label.includes("Wirkung weg")))).length;
  if(reboundC/checks.length>0.2)ins.push({type:"warn",icon:"📉",title:"Häufiger Rebound erkannt",
    text:`Bei ${Math.round(reboundC/checks.length*100)}% der Einträge treten Rebound-Symptome auf. Mögliche Lösungen: Retardpräparat, spätere Einnahme, zweite Dosis mittags – mit deinem Arzt besprechen.`});

  let wCaff=[],woCaff=[];
  Object.keys(S.data).forEach(date=>{
    const cks=Object.entries(S.data[date]?.checkins||{}).sort((a,b)=>+a[0]-+b[0]);
    cks.forEach(([,c],i)=>{
      const hasCaff=cks.slice(Math.max(0,i-2),i).some(([,p])=>(p.events||[]).some(e=>e.type==="caff"));
      if(c.symptoms?.focus){hasCaff?wCaff.push(c.symptoms.focus):woCaff.push(c.symptoms.focus);}
    });
  });
  if(wCaff.length>2&&woCaff.length>2){
    const aw=(wCaff.reduce((a,b)=>a+b,0)/wCaff.length);
    const awo=(woCaff.reduce((a,b)=>a+b,0)/woCaff.length);
    const diff=aw-awo;
    if(Math.abs(diff)>0.4)ins.push({type:diff>0?"pos":"warn",icon:"☕",
      title:diff>0?"Koffein verbessert deinen Fokus":"Koffein könnte stören",
      text:diff>0?`Mit Koffein ist dein Fokus im Schnitt ${diff.toFixed(1)} Punkte höher.`
        :`Nach Koffein ist dein Fokus im Schnitt ${Math.abs(diff).toFixed(1)} Punkte niedriger.`});
  }

  const trend=buildTrendData("focus",14).filter(t=>t.avg);
  if(trend.length>=5){
    const f3=trend.slice(0,3).reduce((a,b)=>a+b.avg,0)/3;
    const l3=trend.slice(-3).reduce((a,b)=>a+b.avg,0)/3;
    const diff=l3-f3;
    if(Math.abs(diff)>0.3)ins.push({type:diff>0?"pos":"warn",icon:diff>0?"📈":"📊",
      title:diff>0?"Fokus verbessert sich":"Fokus nimmt ab",
      text:diff>0?`Dein Fokus hat sich um Ø +${diff.toFixed(1)} verbessert.`
        :`Dein Fokus ist um Ø ${diff.toFixed(1)} gesunken.`});
  }

  const medTimes=Object.keys(S.data).map(d=>S.data[d]?.takenAt).filter(Boolean);
  const avgMedH=medTimes.length?Math.round(medTimes.reduce((s,t)=>s+parseInt(t),0)/medTimes.length):null;
  if(avgMedH&&best&&(best.hour-avgMedH)>3)ins.push({type:"info",icon:"⏰",
    title:"Einnahmezeit überdenken",
    text:`Einnahme Ø um ${avgMedH}:00, beste Wirkung um ${best.hour}:00 (+${best.hour-avgMedH}h). Eventuell könnte eine spätere Einnahme helfen – mit Arzt besprechen.`});

  return ins;
}

function buildMedCompareData(mode="day"){
  const medGroups={};
  // Group by week or month if needed
  function groupKey(date,med){
    if(mode==="week"){const d=new Date(date+"T12:00");const wk=Math.ceil(d.getDate()/7);return`${med} W${wk}/${d.getMonth()+1}`;}
    if(mode==="month"){const d=new Date(date+"T12:00");return`${med} ${d.toLocaleDateString("de-DE",{month:"short",year:"numeric"})}`;}
    return med;
  }
  Object.keys(S.data).forEach(date=>{
    const d=S.data[date];
    if(!d?.medication)return;
    const medName=`${d.medication} ${d.dosage}${d.manufacturer?" ("+d.manufacturer+")":""}`.trim();
    const key=groupKey(date,medName);
    if(!medGroups[key])medGroups[key]={days:[],focusVals:[],moodVals:[],energyVals:[],negEvents:0,posEvents:0,totalCheckins:0};
    medGroups[key].days.push(date);
    Object.values(d.checkins||{}).forEach(c=>{
      medGroups[key].totalCheckins++;
      if(c.symptoms?.focus)medGroups[key].focusVals.push(c.symptoms.focus);
      if(c.symptoms?.mood)medGroups[key].moodVals.push(c.symptoms.mood);
      if(c.symptoms?.energy)medGroups[key].energyVals.push(c.symptoms.energy);
      (c.events||[]).forEach(e=>{
        if(e.type==="neg")medGroups[key].negEvents++;
        if(e.type==="pos")medGroups[key].posEvents++;
      });
    });
  });
  return Object.entries(medGroups).map(([name,g])=>({
    name,days:g.days.length,
    avgFocus:g.focusVals.length?(g.focusVals.reduce((a,b)=>a+b,0)/g.focusVals.length).toFixed(1):"–",
    avgMood: g.moodVals.length?(g.moodVals.reduce((a,b)=>a+b,0)/g.moodVals.length).toFixed(1):"–",
    avgEnergy:g.energyVals.length?(g.energyVals.reduce((a,b)=>a+b,0)/g.energyVals.length).toFixed(1):"–",
    negRate:(g.negEvents/Math.max(g.totalCheckins,1)).toFixed(2),
    posRate:(g.posEvents/Math.max(g.totalCheckins,1)).toFixed(2),
  }));
}

// ─── SVG GRAPH ────────────────────────────────────────────────────────────────
function buildDayGraph(date,selectedMetrics){
  const W=360,ICON_H=34,H=202,PAD={t:ICON_H+14,r:10,b:28,l:28};
  const gW=W-PAD.l-PAD.r, gH=H-PAD.t-PAD.b;
  const day=S.data[date]||{};
  const pts=buildDayTimeline(date);

  const hMin=1,hMax=24;
  function xOf(h){return PAD.l+(h-hMin)/(hMax-hMin)*gW;}
  function yOf(v){return PAD.t+gH-(v-1)/4*gH;}

  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;overflow:visible;">`;

  // Y grid
  for(let v=1;v<=5;v++){
    const y=yOf(v);
    svg+=`<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="#253050" stroke-width="1"/>`;
    svg+=`<text x="${PAD.l-4}" y="${y+4}" text-anchor="end" font-size="9" fill="#5a6890">${v}</text>`;
  }
  // X grid
  for(let h=4;h<=24;h+=4){
    const x=xOf(h);
    svg+=`<line x1="${x}" y1="${PAD.t}" x2="${x}" y2="${PAD.t+gH}" stroke="#1e2840" stroke-width="1"/>`;
    svg+=`<text x="${x}" y="${H-4}" text-anchor="middle" font-size="9" fill="#5a6890">${h}h</text>`;
  }

  // Medication line
  if(day.takenAt){
    const mh=parseFloat(day.takenAt.replace(":","."));
    const x=xOf(mh);
    svg+=`<line x1="${x}" y1="${PAD.t}" x2="${x}" y2="${PAD.t+gH}" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,3"/>`;
    svg+=`<text x="${x+3}" y="${PAD.t+10}" font-size="9" fill="#c084fc">💊 ${day.takenAt}</text>`;
  }

  // Metric lines
  selectedMetrics.forEach(mid=>{
    const m=METRICS.find(x=>x.id===mid);
    if(!m)return;
    const dp=pts.filter(p=>p[mid]!=null).map(p=>({x:xOf(p.hour),y:yOf(p[mid]),v:p[mid],h:p.hour}));
    if(dp.length<1)return;
    if(dp.length>1){
      let d=`M${dp[0].x},${dp[0].y}`;
      for(let i=1;i<dp.length;i++){
        const mx=(dp[i-1].x+dp[i].x)/2;
        d+=` C${mx},${dp[i-1].y} ${mx},${dp[i].y} ${dp[i].x},${dp[i].y}`;
      }
      svg+=`<path d="${d}" fill="none" stroke="${m.color}" stroke-width="2.5" stroke-linecap="round"/>`;
    }
    dp.forEach(pt=>{
      svg+=`<circle cx="${pt.x}" cy="${pt.y}" r="4" fill="${m.color}" stroke="#0a0e1a" stroke-width="1.5"/>`;
    });
  });

  // Event icons at TOP (above graph area) – two rows:
  // Row 1 (topmost): pos ✅ and neg ⚠️ effects
  // Row 2: caff ☕ and food 🍽️
  const evByHour={};
  pts.forEach(p=>{if(p.events.length)evByHour[p.hour]=p.events;});
  Object.entries(evByHour).forEach(([h,evs])=>{
    const x=xOf(+h);
    // Split events into two groups
    const effectIcons=evs.filter(e=>e.type==="pos"||e.type==="neg").slice(0,3).map(e=>e.type==="pos"?"✅":"⚠️");
    const consumeIcons=evs.filter(e=>e.type==="caff"||e.type==="food").slice(0,3).map(e=>e.type==="caff"?"☕":"🍽️");
    // Row 1: pos/neg effects (y = ICON_H - 2, i.e. original single-row position, shifted up by one row height)
    effectIcons.forEach((ic,i)=>{
      svg+=`<text x="${x+(i-effectIcons.length/2+0.5)*12}" y="${ICON_H-13}" text-anchor="middle" font-size="11">${ic}</text>`;
    });
    // Row 2: caff/food (y = ICON_H - 2, original position)
    consumeIcons.forEach((ic,i)=>{
      svg+=`<text x="${x+(i-consumeIcons.length/2+0.5)*12}" y="${ICON_H-2}" text-anchor="middle" font-size="11">${ic}</text>`;
    });
  });

  svg+="</svg>";
  return svg;
}

// Multi-day trend graph – index 0 = neuestes (links), rechts = älter
function buildTrendGraph(metricId,days=14){
  const W=360,H=130,PAD={t:8,r:10,b:24,l:28};
  const gW=W-PAD.l-PAD.r,gH=H-PAD.t-PAD.b;
  // data: newest first → displayed left; reversed for display so index 0 is oldest on x
  const dataRaw=buildTrendData(metricId,days);// already newest-first from buildTrendData
  // We want to display newest on LEFT: index 0 = newest
  const data=[...dataRaw].reverse(); // now index 0 = newest (left)
  const m=METRICS.find(x=>x.id===metricId);
  if(!data.length||!m)return"";

  function xOf(i){return PAD.l+(i/(data.length-1||1))*gW;}
  function yOf(v){return PAD.t+gH-((v-1)/4)*gH;}

  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;overflow:visible;">`;
  for(let v=1;v<=5;v+=2){const y=yOf(v);svg+=`<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="#253050" stroke-width="1"/><text x="${PAD.l-4}" y="${y+4}" text-anchor="end" font-size="9" fill="#5a6890">${v}</text>`;}

  const valid=data.map((d,i)=>({...d,i})).filter(d=>d.avg!=null);
  if(valid.length>1){
    let path=`M${xOf(valid[0].i)},${yOf(valid[0].avg)}`;
    for(let k=1;k<valid.length;k++){
      const mx=(xOf(valid[k-1].i)+xOf(valid[k].i))/2;
      path+=` C${mx},${yOf(valid[k-1].avg)} ${mx},${yOf(valid[k].avg)} ${xOf(valid[k].i)},${yOf(valid[k].avg)}`;
    }
    const fillPath=path+` L${xOf(valid[valid.length-1].i)},${PAD.t+gH} L${xOf(valid[0].i)},${PAD.t+gH} Z`;
    svg+=`<path d="${fillPath}" fill="${m.color}" opacity="0.12"/>`;
    svg+=`<path d="${path}" fill="none" stroke="${m.color}" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  valid.forEach(pt=>{svg+=`<circle cx="${xOf(pt.i)}" cy="${yOf(pt.avg)}" r="3.5" fill="${m.color}"/>`;});

  // X labels: index 0 = newest on left
  data.forEach((d,i)=>{if(i%2===0||i===data.length-1)svg+=`<text x="${xOf(i)}" y="${H-2}" text-anchor="middle" font-size="8" fill="#5a6890">${fmtDateXS(d.date)}</text>`;});
  // Label arrows
  if(data.length>1){
    svg+=`<text x="${PAD.l}" y="${H-2}" text-anchor="start" font-size="8" fill="#3a4860">◄ neu</text>`;
    svg+=`<text x="${W-PAD.r}" y="${H-2}" text-anchor="end" font-size="8" fill="#3a4860">alt ►</text>`;
  }

  svg+="</svg>";
  return svg;
}

// Generic XY trend graph for body metrics (weight, BP)
function buildBodyGraph(series,yMin,yMax,rangeKey){
  const W=360,H=140,PAD={t:8,r:10,b:24,l:36};
  const gW=W-PAD.l-PAD.r,gH=H-PAD.t-PAD.b;
  const dates=getBodySeries(rangeKey);
  if(dates.length<2)return"";

  function xOf(i){return PAD.l+(i/(dates.length-1))*gW;}
  function yOf(v){return PAD.t+gH-((v-yMin)/(yMax-yMin))*gH;}

  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;overflow:visible;">`;
  // Y gridlines
  const steps=4;
  for(let s=0;s<=steps;s++){
    const v=yMin+(yMax-yMin)*s/steps;
    const y=yOf(v);
    svg+=`<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="#253050" stroke-width="1"/>`;
    svg+=`<text x="${PAD.l-3}" y="${y+4}" text-anchor="end" font-size="9" fill="#5a6890">${Math.round(v)}</text>`;
  }
  // X labels
  dates.forEach((d,i)=>{
    if(dates.length<=10||i%(Math.ceil(dates.length/6))===0||i===dates.length-1)
      svg+=`<text x="${xOf(i)}" y="${H-2}" text-anchor="middle" font-size="8" fill="#5a6890">${fmtDateXS(d)}</text>`;
  });

  series.forEach(({key,color,dayKey})=>{
    const pts=dates.map((d,i)=>{
      const v=S.data[d]?.[dayKey||key];
      return v!=null?{i,v:+v}:null;
    }).filter(Boolean);
    if(pts.length<1)return;
    if(pts.length>1){
      let path=`M${xOf(pts[0].i)},${yOf(pts[0].v)}`;
      for(let k=1;k<pts.length;k++){
        const mx=(xOf(pts[k-1].i)+xOf(pts[k].i))/2;
        path+=` C${mx},${yOf(pts[k-1].v)} ${mx},${yOf(pts[k].v)} ${xOf(pts[k].i)},${yOf(pts[k].v)}`;
      }
      svg+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/>`;
    }
    pts.forEach(pt=>{svg+=`<circle cx="${xOf(pt.i)}" cy="${yOf(pt.v)}" r="3" fill="${color}"/>`;});
  });

  svg+="</svg>";
  return svg;
}

function buildHourlyGraph(metricId){
  const W=360,H=130,PAD={t:8,r:10,b:24,l:28};
  const gW=W-PAD.l-PAD.r,gH=H-PAD.t-PAD.b;
  const data=hourlyAvg(metricId);
  const m=METRICS.find(x=>x.id===metricId);
  if(!m)return"";

  function xOf(i){return PAD.l+(i/(data.length-1))*gW;}
  function yOf(v){return PAD.t+gH-((v-1)/4)*gH;}

  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;overflow:visible;">`;
  for(let v=1;v<=5;v+=2){const y=yOf(v);svg+=`<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="#253050" stroke-width="1"/><text x="${PAD.l-4}" y="${y+4}" text-anchor="end" font-size="9" fill="#5a6890">${v}</text>`;}

  const valid=data.map((d,i)=>({...d,i})).filter(d=>d.avg!=null);
  if(valid.length>1){
    let path=`M${xOf(valid[0].i)},${yOf(valid[0].avg)}`;
    for(let k=1;k<valid.length;k++){const mx=(xOf(valid[k-1].i)+xOf(valid[k].i))/2;path+=` C${mx},${yOf(valid[k-1].avg)} ${mx},${yOf(valid[k].avg)} ${xOf(valid[k].i)},${yOf(valid[k].avg)}`;}
    svg+=`<path d="${path}" fill="none" stroke="${m.color}" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  valid.forEach(pt=>{svg+=`<circle cx="${xOf(pt.i)}" cy="${yOf(pt.avg)}" r="3.5" fill="${m.color}"/>`;});
  data.forEach((d,i)=>{if(d.hour%4===0)svg+=`<text x="${xOf(i)}" y="${H-2}" text-anchor="middle" font-size="8" fill="#5a6890">${d.hour}h</text>`;});
  svg+="</svg>";
  return svg;
}

// ─── DOM HELPERS ─────────────────────────────────────────────────────────────
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="class")e.className=v;
    else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    // NOTE: "html" attr intentionally removed – use svgEl() for trusted SVG only
    else e.setAttribute(k,v);
  });
  kids.flat().forEach(c=>{
    if(c==null)return;
    if(typeof c==="string"||typeof c==="number")
      e.appendChild(document.createTextNode(String(c)));
    else
      e.appendChild(c);
  });
  return e;
}
// svgEl: only for internally generated, trusted SVG strings (never user input)
function svgEl(html){const d=document.createElement("div");d.innerHTML=html;return d;}
function showToast(msg){const t=el("div",{class:"toast"},msg);document.body.appendChild(t);setTimeout(()=>t.remove(),2100);}

// ── Klinisches Arzt-Dashboard (strukturierter Report) ─────────────────────────
function buildReportData(){
  const allDays=Object.keys(S.data).sort().reverse();
  const checks=allCheckins();
  const totalCheckins=checks.length;
  const today=new Date().toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});

  // ── SEKTION 1: KARDIO & VITALDATEN ────────────────────────────────────────
  // Gewicht: erstes vs. letztes
  const weightDays=allDays.filter(d=>S.data[d]?.gewicht).sort();
  const startWeight=weightDays.length?+S.data[weightDays[0]].gewicht:null;
  const currentWeight=weightDays.length?+S.data[weightDays[weightDays.length-1]].gewicht:null;
  const weightDiff=startWeight&&currentWeight?(currentWeight-startWeight).toFixed(1):null;

  // Blutdruck & Puls Durchschnitt
  const bpDays=allDays.filter(d=>S.data[d]?.sys&&S.data[d]?.dia);
  const avgSys=bpDays.length?Math.round(bpDays.reduce((s,d)=>s+(+S.data[d].sys),0)/bpDays.length):null;
  const avgDia=bpDays.length?Math.round(bpDays.reduce((s,d)=>s+(+S.data[d].dia),0)/bpDays.length):null;
  const pulsDays=allDays.filter(d=>S.data[d]?.puls);
  const avgPuls=pulsDays.length?Math.round(pulsDays.reduce((s,d)=>s+(+S.data[d].puls),0)/pulsDays.length):null;

  // ── SEKTION 2: MEDIKATIONS-ANALYSE ────────────────────────────────────────
  // Durchschnittliche spürbare Wirkdauer: Zeit zwischen Einnahme und "Wirkung weg"/"Rebound"-Event
  const wirkDauern=[];
  allDays.forEach(date=>{
    const d=S.data[date];
    if(!d?.takenAt)return;
    const medH=parseFloat(d.takenAt.replace(":","."));
    // Finde früheste Stunde mit Rebound/Wirkung-weg-Event
    const cEntries=Object.entries(d.checkins||{}).sort((a,b)=>+a[0]-+b[0]);
    const reboundEntry=cEntries.find(([h,c])=>+h>medH&&(c.events||[]).some(e=>e.type==="neg"&&(e.label.includes("Rebound")||e.label.includes("Wirkung weg"))));
    if(reboundEntry){wirkDauern.push(+reboundEntry[0]-medH);}
  });
  const avgWirkDauer=wirkDauern.length?(wirkDauern.reduce((a,b)=>a+b,0)/wirkDauern.length).toFixed(1):null;

  // Fokus-Differenz mit vs. ohne Medikation (Tage)
  const fokusWithMed=[];
  const fokusWithoutMed=[];
  allDays.forEach(date=>{
    const d=S.data[date];
    const dayChecks=Object.values(d?.checkins||{});
    const fVals=dayChecks.map(c=>c.symptoms?.focus).filter(Boolean);
    if(!fVals.length)return;
    const dayAvg=fVals.reduce((a,b)=>a+b,0)/fVals.length;
    if(d?.medication)fokusWithMed.push(dayAvg);
    else fokusWithoutMed.push(dayAvg);
  });
  const avgFMed=fokusWithMed.length?(fokusWithMed.reduce((a,b)=>a+b,0)/fokusWithMed.length):null;
  const avgFNoMed=fokusWithoutMed.length?(fokusWithoutMed.reduce((a,b)=>a+b,0)/fokusWithoutMed.length):null;
  const fokusDiff=(avgFMed&&avgFNoMed)?Math.round((avgFMed-avgFNoMed)/avgFNoMed*100):null;

  // Präzises Rebound-Zeitfenster (Uhrzeit der Rebound-Events)
  const reboundHours=[];
  allDays.forEach(date=>{
    Object.entries(S.data[date]?.checkins||{}).forEach(([h,c])=>{
      if((c.events||[]).some(e=>e.type==="neg"&&(e.label.includes("Rebound")||e.label.includes("Wirkung weg"))))
        reboundHours.push(+h);
    });
  });
  const reboundMin=reboundHours.length?Math.min(...reboundHours):null;
  const reboundMax=reboundHours.length?Math.max(...reboundHours):null;
  const reboundAvg=reboundHours.length?Math.round(reboundHours.reduce((a,b)=>a+b,0)/reboundHours.length):null;

  // ── SEKTION 3: VERHALTENS- & TRIGGER-INSIGHTS ─────────────────────────────
  // Schlafqualität → Fokus Folgetag (Korrelation)
  // "Schlafqualität" = Schlafdauer in h (wenn beide Zeiten vorhanden)
  const sleepFocusPairs=[];
  const sortedDays=[...allDays].sort();
  sortedDays.forEach((date,i)=>{
    const d=S.data[date];
    if(!d?.schlafenAt||!d?.aufgestandenAt)return;
    const nextDate=sortedDays[i+1];
    if(!nextDate)return;
    const sleepH=parseFloat(d.schlafenAt.replace(":","."));
    const wakeH=parseFloat(d.aufgestandenAt.replace(":","."));
    // Schlafdauer: wenn schlafenAt > wakeH angenommen, dann nächster Tag
    let duration=wakeH-sleepH; if(duration<0)duration+=24;
    const nextChecks=Object.values(S.data[nextDate]?.checkins||{});
    const nextFocus=nextChecks.map(c=>c.symptoms?.focus).filter(Boolean);
    if(nextFocus.length&&duration>2&&duration<14){
      sleepFocusPairs.push({sleep:duration,focus:nextFocus.reduce((a,b)=>a+b,0)/nextFocus.length});
    }
  });
  // Pearson Korrelation
  let sleepCorr=null;
  if(sleepFocusPairs.length>=3){
    const n=sleepFocusPairs.length;
    const ms=sleepFocusPairs.reduce((a,p)=>a+p.sleep,0)/n;
    const mf=sleepFocusPairs.reduce((a,p)=>a+p.focus,0)/n;
    const num=sleepFocusPairs.reduce((a,p)=>a+(p.sleep-ms)*(p.focus-mf),0);
    const den=Math.sqrt(sleepFocusPairs.reduce((a,p)=>a+(p.sleep-ms)**2,0)*sleepFocusPairs.reduce((a,p)=>a+(p.focus-mf)**2,0));
    sleepCorr=den>0?(num/den).toFixed(2):null;
  }
  const avgSleepDur=sleepFocusPairs.length?(sleepFocusPairs.reduce((a,p)=>a+p.sleep,0)/sleepFocusPairs.length).toFixed(1):null;

  // Hunger/ausgelassene Mahlzeiten → Unruhe/Impulsivität
  const hungerUnrestPairs=[];
  allDays.forEach(date=>{
    const d=S.data[date];
    const cEntries=Object.entries(d?.checkins||{}).sort((a,b)=>+a[0]-+b[0]);
    cEntries.forEach(([,c],i)=>{
      // Hunger-Score (hoch = viel Hunger)
      const hungerVal=c.symptoms?.hunger;
      if(!hungerVal)return;
      const unrestVal=c.symptoms?.unrest;
      const impulseVal=c.symptoms?.impulse;
      if(unrestVal||impulseVal)
        hungerUnrestPairs.push({hunger:hungerVal,neg:((unrestVal||0)+(impulseVal||0))/((unrestVal?1:0)+(impulseVal?1:0)||1)});
    });
  });
  let hungerCorr=null;
  if(hungerUnrestPairs.length>=3){
    const n=hungerUnrestPairs.length;
    const mh=hungerUnrestPairs.reduce((a,p)=>a+p.hunger,0)/n;
    const mn=hungerUnrestPairs.reduce((a,p)=>a+p.neg,0)/n;
    const num=hungerUnrestPairs.reduce((a,p)=>a+(p.hunger-mh)*(p.neg-mn),0);
    const den=Math.sqrt(hungerUnrestPairs.reduce((a,p)=>a+(p.hunger-mh)**2,0)*hungerUnrestPairs.reduce((a,p)=>a+(p.neg-mn)**2,0));
    hungerCorr=den>0?(num/den).toFixed(2):null;
  }

  // Top 3 häufigste Health Flags in %
  const hfCounts={};
  let hfTotal=0;
  allDays.forEach(d=>{
    Object.values(S.data[d]?.checkins||{}).forEach(c=>{
      Object.entries(c.healthFlags||{}).forEach(([id,v])=>{
        hfTotal++;
        if(v)hfCounts[id]=(hfCounts[id]||0)+1;
      });
    });
  });
  const topFlags=HEALTH_FLAGS
    .map(f=>({label:f.icon+" "+f.label,count:hfCounts[f.id]||0}))
    .filter(f=>f.count>0)
    .sort((a,b)=>b.count-a.count)
    .slice(0,3)
    .map(f=>({...f,pct:hfTotal>0?Math.round(f.count/hfTotal*100*HEALTH_FLAGS.length):0}));

  // Aktuelles Medikament
  const latestMedDay=allDays.find(d=>S.data[d]?.medication);
  const currentMed=latestMedDay?`${S.data[latestMedDay].medication} ${S.data[latestMedDay].dosage}${S.data[latestMedDay].manufacturer?" ("+S.data[latestMedDay].manufacturer+")":""}`.trim():"k. A.";

  return{
    today,allDays,totalCheckins,
    startWeight,currentWeight,weightDiff,
    avgSys,avgDia,avgPuls,bpDays,
    avgWirkDauer,wirkDauern,
    avgFMed,avgFNoMed,fokusDiff,
    reboundMin,reboundMax,reboundAvg,reboundHours,
    sleepCorr,avgSleepDur,sleepFocusPairs,
    hungerCorr,hungerUnrestPairs,
    topFlags,currentMed,
  };
}

function importJSON(str){
  try{
    if(!str||!str.trim())throw new Error("empty");
    const p=JSON.parse(str);
    // Muss ein echtes Objekt sein (kein Array, kein null, kein Primitiv)
    if(typeof p!=="object"||p===null||Array.isArray(p))throw new Error("invalid structure");
    // Grobe Plausibilitätsprüfung: Schlüssel sollten datums-artige Strings sein
    const keys=Object.keys(p);
    if(keys.length>0){
      const sample=keys[0];
      if(!/^\d{4}-\d{2}-\d{2}$/.test(sample))throw new Error("unexpected key format");
    }
    S.data=p;persist(p);set({showImport:false});showToast("✓ Daten wiederhergestellt!");
  }catch(err){
    alert("Ungültiges Backup-Format. Bitte eine gültige ADHS-Tagebuch JSON-Datei einfügen.\n("+err.message+")");
  }
}

function renderCheckin(){
  const hour=S.checkinHour, draft=S.draft;
  const wrap=el("div",{});

  if(S.saved){
    wrap.appendChild(el("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"60vh",textAlign:"center",padding:"24px"}},
      el("div",{style:{fontSize:"56px",marginBottom:"12px"}},"✅"),
      el("div",{style:{fontSize:"20px",fontWeight:"700"}},"Gespeichert!"),
    ));
    return wrap;
  }

  wrap.appendChild(el("div",{class:"topbar"},
    el("div",{style:{display:"flex",alignItems:"center",gap:"10px"}},
      el("button",{class:"btn ghost sm",style:{width:"auto"},onClick:()=>set({checkinHour:null,draft:null})},"← Zurück"),
      el("h1",{style:{fontSize:"22px"}},`${hour}:00 Uhr`)
    ),
    el("div",{class:"sub"},fmtDate(S.selDate))
  ));

  const sec=el("div",{class:"section"});

  // ── Symptom Skalen
  sec.appendChild(el("div",{class:"card"},
    el("span",{class:"card-label"},"Wie geht es dir?"),
    ...METRICS.map(m=>{
      const val=draft.symptoms[m.id]||0;
      const col=val?ratingColor(val,m.inv):"var(--muted)";
      return el("div",{style:{marginBottom:"18px"}},
        el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}},
          el("span",{style:{fontSize:"15px",fontWeight:"600"}},`${m.icon} ${m.label}`),
          val?el("span",{style:{fontSize:"13px",color:col,fontWeight:"700"}},SCALE_LABELS[val]):null
        ),
        el("div",{class:"scale-row"},
          ...[1,2,3,4,5].map(v=>{
            const c=ratingColor(v,m.inv);
            const active=val===v;
            return el("button",{class:"scale-btn",
              style:active?{background:c+"33",borderColor:c,color:c}:{},
              onClick:()=>setSym(m.id,v)
            },String(v));
          })
        ),
        m.inv?el("div",{style:{fontSize:"11px",color:"var(--muted)",marginTop:"5px"}},`1 = wenig ${m.label} · 5 = sehr viel`):null
      );
    })
  ));

  // ── Ereignisse
  function makeEventSection(type,title,presets){
    const items=draft.events.filter(e=>e.type===type);
    return el("div",{style:{marginBottom:"6px"}},
      el("span",{class:"cat-label"},title),
      el("div",{class:"preset-wrap"},
        ...presets.map(p=>el("button",{class:"preset-btn",onClick:()=>addEvent(type,p)},p))
      ),
      el("div",{style:{display:"flex",gap:"8px",marginBottom:"6px",alignItems:"stretch"}},
        (()=>{
          const inp=document.createElement("input");
          inp.placeholder="Eigenes eingeben …";inp.style.flex="1";inp.style.minWidth="0";
          inp.onkeydown=e=>{if(e.key==="Enter"&&inp.value){addEvent(type,inp.value);inp.value="";}};
          return inp;
        })(),
        el("button",{class:"btn sm ghost-sm",style:{width:"auto",flexShrink:"0"},
          onClick(e){const inp=e.target.previousSibling;if(inp.value){addEvent(type,inp.value);inp.value="";}}},"＋")
      ),
      items.length?el("div",{class:"chips-wrap"},
        ...items.map((ev)=>el("span",{class:`event-chip ${ev.type}`},
          ev.label,
          el("span",{class:"chip-del",onClick:()=>removeEvent(draft.events.indexOf(ev))},"×")
        ))
      ):null
    );
  }

  sec.appendChild(el("div",{class:"card"},
    el("span",{class:"card-label"},"Ereignisse & Konsum"),
    makeEventSection("pos","✅ Positive Effekte",EV_POS),
    makeEventSection("neg","⚠️ Negative Effekte / Nebenwirkungen",EV_NEG),
    makeEventSection("caff","☕ Koffein & Tee",EV_CAFF),
    makeEventSection("food","🍽️ Essen",EV_FOOD),
  ));

  // ── Gesundheitliche Besonderheiten (neutral, kein Score-Einfluss)
  sec.appendChild(el("div",{class:"card"},
    el("span",{class:"card-label"},"🩺 Gesundheitliche Besonderheiten"),
    el("div",{style:{fontSize:"12px",color:"var(--muted)",marginBottom:"10px"}},"Fließt nicht in die Bewertung ein – nur zur Dokumentation."),
    el("div",{class:"health-checks"},
      ...HEALTH_FLAGS.map(f=>{
        const on=!!(draft.healthFlags||{})[f.id];
        const chip=el("div",{class:"hcheck"+(on?" on":""),onClick:()=>toggleHealthFlag(f.id)},
          el("div",{class:"hcheck-icon"},f.icon),
          el("div",{class:"hcheck-label"},f.label),
          el("div",{class:"hcheck-box"},on?"✓":"")
        );
        return chip;
      })
    )
  ));

  // ── Notiz
  sec.appendChild(el("div",{class:"card"},

    )));
    sec.appendChild(el("div",{class:"card"},
      el("span",{class:"card-label"},"Ø Gesamtwerte"),
      el("div",{class:"row3"},
        ...METRICS.map(m=>{const v=avgStat(m.id);return el("div",{class:"mini-stat"},
          el("div",{},m.icon),
          el("div",{class:"mini-stat-num",style:{color:v!=="–"?ratingColor(+v,m.inv):"var(--muted)"}},v),
          el("div",{class:"mini-stat-lbl"},m.label)
        );})
      ),
      el("div",{style:{fontSize:"11px",color:"var(--muted)",marginTop:"6px"}},"⚡💥 niedrig = besser")
    ));
  }

  // ── COMPARE TAB
  if(S.statsTab==="compare"){
    // View mode switcher
    sec.appendChild(el("div",{class:"seg"},
      ...[["day","Täglich"],["week","Wöchentlich"],["month","Monatlich"]].map(([k,l])=>
        el("button",{class:"seg-btn"+(S.medViewMode===k?" active":""),onClick:()=>set({medViewMode:k})},l)
      )
    ));

    const medData=buildMedCompareData(S.medViewMode);
    if(medData.length<2){
      sec.appendChild(el("div",{style:{textAlign:"center",padding:"40px 0",color:"var(--muted)"}},
        "Erfasse mindestens 2 verschiedene Medikamente/Dosierungen für einen Vergleich."
      ));
    } else {
      sec.appendChild(el("div",{class:"card"},
        el("span",{class:"card-label"},"Medikamente im Vergleich"),
        ...medData.map((med,mi)=>{
          const colors=["var(--accent)","var(--green)","var(--yellow)","var(--purple)"];
          const c=colors[mi%colors.length];
          return el("div",{style:{marginBottom:"16px",paddingBottom:"16px",borderBottom:mi<medData.length-1?"1px solid var(--border)":"none"}},
            el("div",{style:{fontSize:"15px",fontWeight:"700",color:c,marginBottom:"8px"}},`${med.name} (${med.days} Tage)`),
            el("div",{class:"row3",style:{marginBottom:"8px"}},
              ...[["🎯","Fokus",med.avgFocus],["😊","Stimmung",med.avgMood],["🔋","Energie",med.avgEnergy]].map(([icon,lbl,val])=>
                el("div",{class:"mini-stat"},el("div",{},icon),
                  el("div",{class:"mini-stat-num",style:{color:val!=="–"?ratingColor(+val,false):c}},val),
                  el("div",{class:"mini-stat-lbl"},lbl)
                )
              )
            ),
            el("div",{style:{display:"flex",gap:"12px",fontSize:"13px"}},
              el("span",{style:{color:"var(--green)"}},`✅ Ø ${med.posRate} pos/Check-in`),
              el("span",{style:{color:"var(--red)"}},`⚠️ Ø ${med.negRate} neg/Check-in`)
            )
          );
        })
      ));
    }
    if(medData.length>=1&&Object.keys(S.data).length>=3){
      sec.appendChild(el("div",{class:"card"},
        el("span",{class:"card-label"},"Fokus-Verlauf – neueste links"),
        svgEl(buildTrendGraph("focus",30))
      ));
    }
  }

  // ── EVENTS TAB
  if(S.statsTab==="events"){
    const counts=eventCounts();
    const byType={pos:[],neg:[],caff:[],food:[]};
    Object.entries(counts).forEach(([k,n])=>{
      const [type,...rest]=k.split(":");
      if(byType[type])byType[type].push({label:rest.join(":"),count:n});
    });
    [["pos","✅ Positive Effekte","var(--green)"],["neg","⚠️ Negative Effekte","var(--red)"],
     ["caff","☕ Koffein & Tee","var(--accentL)"],["food","🍽️ Essen","var(--orange)"]].forEach(([type,title,col])=>{
      const items=byType[type].sort((a,b)=>b.count-a.count).slice(0,8);
      if(!items.length)return;
      sec.appendChild(el("div",{class:"card"},
        el("span",{class:"card-label"},title),
        ...items.map(({label,count})=>el("div",{style:{marginBottom:"10px"}},
          el("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"14px",marginBottom:"4px"}},
            el("span",{},label),el("span",{style:{color:"var(--muted)"}},count+"×")
          ),
          el("div",{class:"sbar-wrap"},el("div",{class:"sbar-fill",style:{width:`${Math.min(count/checks.length*100*3,100)}%`,background:col}}))
        ))
      ));
    });
  }

  // ── BACKUP TAB
  if(S.statsTab==="backup"){
    sec.appendChild(el("div",{class:"backup-card"},
      el("div",{style:{fontSize:"15px",fontWeight:"700",color:"var(--accentL)",marginBottom:"4px"}},"💾 Backup & Export"),
      el("div",{style:{fontSize:"14px",color:"var(--muted)",marginBottom:"14px",lineHeight:"1.6"}},"Daten sind nur lokal gespeichert. Regelmäßig sichern – am besten wöchentlich."),
      el("div",{class:"backup-row"},
        el("button",{class:"bup-btn",onClick:copyReport},el("span",{class:"bup-icon"},"📋"),"Kopieren"),
        el("button",{class:"bup-btn",onClick:exportMail},el("span",{class:"bup-icon"},"✉️"),"Per Mail"),
        el("button",{class:"bup-btn",onClick:exportJSON},el("span",{class:"bup-icon"},"📥"),"JSON")
      ),
      el("button",{class:"bup-btn",style:{width:"100%",flexDirection:"row",justifyContent:"center",gap:"8px",marginBottom:"8px",background:"rgba(96,165,250,.12)",borderColor:"rgba(96,165,250,.4)",color:"var(--accentL)"},
        onClick:printReport},el("span",{},"🖨️"),"Bericht drucken / PDF"),
      el("button",{class:"bup-btn",style:{width:"100%",flexDirection:"row",justifyContent:"center",gap:"8px"},
        onClick:()=>set({showImport:!S.showImport})},el("span",{},"📤"),"Backup wiederherstellen"),
      S.showImport?(()=>{
        let v="";
        const ta=document.createElement("textarea");ta.className="import-area";ta.placeholder="JSON einfügen …";ta.oninput=e=>v=e.target.value;
        return el("div",{},ta,el("button",{class:"btn primary",style:{marginTop:"8px"},onClick:()=>importJSON(v)},"Wiederherstellen"));
      })():null
    ));
    sec.appendChild(el("div",{class:"card"},el("span",{class:"card-label"},"Arzt-Bericht"),el("div",{class:"report-box"},buildReport())));
  }

  wrap.appendChild(sec);
  return wrap;
}

// ─── MAIN RENDER ──────────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById("app");
  app.innerHTML="";

  let view;
  if(S.checkinHour!==null&&S.draft) view=renderCheckin();
  else if(S.tab==="today")   view=renderToday();
  else if(S.tab==="history") view=renderHistory();
  else if(S.tab==="stats")   view=renderStats();
  if(view)app.appendChild(view);

  const modal=renderMedModal();
  if(modal)app.appendChild(modal);

  if(S.checkinHour===null){
    app.appendChild(el("nav",{},
      ...[{id:"today",icon:"🏠",label:"Heute"},{id:"history",icon:"📅",label:"Verlauf"},{id:"stats",icon:"📊",label:"Auswertung"}]
      .map(({id,icon,label})=>el("button",{class:"nav-btn"+(S.tab===id?" active":""),onClick:()=>set({tab:id,selDate:todayStr()})},
        el("span",{class:"nav-icon"},icon),label
      ))
    ));
  }
}

render();
</script>
</body>
</html>
